apiVersion: v1
kind: ConfigMap
metadata:
  name: palad-app-config
  namespace: palad
data:
  RAILS_ENV: development
  RAILS_PORT: "4000"
  RAILS_LOG_TO_STDOUT: "true"
  RAILS_SECRET_KEY_BASE: secret
  DB_HOST: db
  DB_PORT: "5432"
  DB_USERNAME: postgres
  DB_PASSWORD: postgres
  DB_NAME: palad_development
  REDIS_URL: redis://redis:6379/1
  TEMPORAL_ENABLED: "true"
  TEMPORAL_DEBUG: "true"
  TEMPORAL_HOST: temporal
  TEMPORAL_PORT: "7233"
  TEMPORAL_NAMESPACE: default
  TEMPORAL_TASK_QUEUE: palad_ruby
  TEMPORAL_UI_URL: http://temporal-ui:8080
  TRAEFIK_WS_BASE: ws://localhost
  TRAEFIK_HTTP_BASE: http://localhost
  TRAEFIK_DASHBOARD_URL: http://localhost:8090
  TRAEFIK_CORS_ORIGINS: http://localhost:4000,http://localhost
  CONTAINER_RUNTIME: k8s
  K8S_IMAGE_PULL_POLICY: IfNotPresent
