apiVersion: v1
kind: ServiceAccount
metadata:
  name: palad-web
  namespace: palad
  annotations:
    # Set from Terraform output: eks_assets_irsa_role_arn
    eks.amazonaws.com/role-arn: "arn:aws:iam::541894707537:role/palad-eks-assets-role"
imagePullSecrets:
  - name: ghcr-pull-secret
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: palad-worker
  namespace: palad
  annotations:
    # Set from Terraform output: eks_assets_irsa_role_arn
    eks.amazonaws.com/role-arn: "arn:aws:iam::541894707537:role/palad-eks-assets-role"
imagePullSecrets:
  - name: ghcr-pull-secret
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: palad-otlp
  namespace: palad
  # Add an IRSA role annotation when this workload needs AWS API access.
  # annotations:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::<account-id>:role/palad-otlp-irsa-role
imagePullSecrets:
  - name: ghcr-pull-secret
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: palad-runtime
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["resourcequotas"]
    verbs: ["create", "get", "update"]
  - apiGroups: [""]
    resources: ["pods", "pods/exec", "services"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "get", "list", "watch"]
  - apiGroups: ["traefik.io"]
    resources: ["ingressroutes", "middlewares"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: palad-runtime
subjects:
  - kind: ServiceAccount
    name: palad-web
    namespace: palad
  - kind: ServiceAccount
    name: palad-worker
    namespace: palad
  - kind: ServiceAccount
    name: palad-otlp
    namespace: palad
roleRef:
  kind: ClusterRole
  name: palad-runtime
  apiGroup: rbac.authorization.k8s.io
