apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: web
  namespace: palad
  labels:
    palad.ai/runtime-origin: palad
spec:
  entryPoints:
    - websecure
  routes:
    - match: (Host(`palad.ai`) || Host(`www.palad.ai`)) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: web
          port: 4000
  tls:
    certResolver: letsencrypt
    domains:
      - main: palad.ai
        sans:
          - www.palad.ai
          - traefik.palad.ai
          - temporal.palad.ai
