apiVersion: v1
kind: ConfigMap
metadata:
  name: palad-app-config
  namespace: palad
data:
  RAILS_ENV: production
  RAILS_PORT: "4000"
  RAILS_LOG_TO_STDOUT: "true"
  ACTION_CABLE_URL: /cable
  # Set from Terraform output: rds_endpoint
  DB_HOST: "palad-app-prod.ci58qgcoa7rm.us-east-1.rds.amazonaws.com"
  DB_PORT: "5432"
  DOMAIN: palad.ai
  ASSET_HOST: palad.ai
  DB_USERNAME: postgres
  DB_NAME: palad_production
  # Set from Terraform output: redis_url_database_1
  REDIS_URL: "redis://palad-redis-prod.piqxda.ng.0001.use1.cache.amazonaws.com:6379/1"
  TEMPORAL_ENABLED: "true"
  TEMPORAL_DEBUG: "true"
  TEMPORAL_HOST: temporal
  TEMPORAL_PORT: "7233"
  TEMPORAL_NAMESPACE: default
  TEMPORAL_TASK_QUEUE: palad_ruby
  TEMPORAL_UI_URL: https://temporal.palad.ai
  # Set from Terraform output: temporal_rds_endpoint
  TEMPORAL_DB_HOST: "palad-temporal-prod.ci58qgcoa7rm.us-east-1.rds.amazonaws.com"
  TEMPORAL_DB_PORT: "5432"
  TEMPORAL_DB_USERNAME: "postgres"
  TEMPORAL_DB_NAME: temporal
  TEMPORAL_VISIBILITY_DB_NAME: temporal_visibility
  TEMPORAL_POSTGRES_TLS_ENABLED: "true"
  TEMPORAL_POSTGRES_TLS_DISABLE_HOST_VERIFICATION: "true"
  TEMPORAL_SQL_TLS: "true"
  TEMPORAL_SQL_HOST_VERIFICATION: "false"
  TRAEFIK_WS_BASE: wss://palad.ai
  TRAEFIK_HTTP_BASE: https://palad.ai
  TRAEFIK_DASHBOARD_URL: https://traefik.palad.ai
  TRAEFIK_CORS_ORIGINS: https://palad.ai
  CONTAINER_RUNTIME: k8s
  K8S_IMAGE_PULL_POLICY: IfNotPresent
  K8S_AGENTS_IMAGE_PULL_SECRETS: ghcr-pull-secret
  MCP_SERVER_URL: http://mcp:4002/action_mcp
  MCP_PORT: "4002"
  GITHUB_CLIENT_ID: "get_from_1password"
  GITHUB_APP_URL: "https://github.com/apps/3po-test-dev-app"
  BITBUCKET_OAUTH_KEY: "get_from_1password"
  GITLAB_APP_ID: "get_from_1password"
  K8S_RUNTIME_LIMITS_MEMORY: 2Gi
