apiVersion: v1
kind: ConfigMap
metadata:
  name: palad-app-config
  namespace: palad
data:
  RAILS_ENV: production
  RAILS_PORT: "4000"
  RAILS_LOG_TO_STDOUT: "true"
  ACTION_CABLE_URL: /cable
  # Set from Terraform output: rds_endpoint
  DB_HOST: "palad-app-prod.ci58qgcoa7rm.us-east-1.rds.amazonaws.com"
  DB_PORT: "5432"
  DOMAIN: dev.aixle.com
  # Set from Terraform output: cloudfront_static_assets_url
  ASSET_HOST: "https://static.aixle.com"
  # Set from Terraform output: assets_bucket_name
  AWS_S3_BUCKET: "palad-assets-prod"
  AWS_DEFAULT_REGION: "us-east-1"
  AWS_REGION: "us-east-1"
  DB_USERNAME: postgres
  DB_NAME: palad_production
  # Set from Terraform output: redis_url_database_1
  REDIS_URL: "redis://palad-redis-prod.piqxda.ng.0001.use1.cache.amazonaws.com:6379/1"
  TEMPORAL_ENABLED: "true"
  TEMPORAL_DEBUG: "true"
  TEMPORAL_HOST: temporal
  TEMPORAL_PORT: "7233"
  TEMPORAL_NAMESPACE: default
  TEMPORAL_TASK_QUEUE: aixle_ruby
  TEMPORAL_WORKER_GRACEFUL_SHUTDOWN_PERIOD: "900"
  TEMPORAL_UI_URL: https://temporal.aixle.com
  # Set from Terraform output: temporal_rds_endpoint
  TEMPORAL_DB_HOST: "palad-temporal-prod.ci58qgcoa7rm.us-east-1.rds.amazonaws.com"
  TEMPORAL_DB_PORT: "5432"
  TEMPORAL_DB_USERNAME: "postgres"
  TEMPORAL_DB_NAME: temporal
  TEMPORAL_VISIBILITY_DB_NAME: temporal_visibility
  TEMPORAL_POSTGRES_TLS_ENABLED: "true"
  TEMPORAL_POSTGRES_TLS_DISABLE_HOST_VERIFICATION: "true"
  TEMPORAL_SQL_TLS: "true"
  TEMPORAL_SQL_HOST_VERIFICATION: "false"
  TRAEFIK_WS_BASE: wss://dev.aixle.com
  TRAEFIK_HTTP_BASE: https://dev.aixle.com
  TRAEFIK_DASHBOARD_URL: https://traefik.aixle.com
  TRAEFIK_CORS_ORIGINS: https://dev.aixle.com
  CONTAINER_ASSET_HOST: "https://palad-assets-prod.s3.amazonaws.com"
  CONTAINER_RUNTIME: k8s
  K8S_NAMESPACE: palad
  K8S_IMAGE_PULL_POLICY: Always
  K8S_EKS_VPC_CIDR: "10.10.0.0/16"
  K8S_AGENTS_IMAGE_PULL_SECRETS: ghcr-pull-secret
  MCP_SERVER_URL: "http://mcp.palad.svc.cluster.local:4002/action_mcp"
  MCP_PORT: "4002"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otlp-ingest.palad.svc.cluster.local:4318"
  OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: "http://otlp-ingest.palad.svc.cluster.local:4318/v1/metrics"
  OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: "http://otlp-ingest.palad.svc.cluster.local:4318/v1/logs"
  GITHUB_APP_ID: "3090688"
  GITHUB_APP_SLUG: palad-ai
  GITHUB_APP_URL: "https://github.com/apps/3po-test-dev-app"
  BITBUCKET_OAUTH_KEY: "get_from_1password"
  GITLAB_APP_ID: "get_from_1password"
  K8S_RUNTIME_LIMITS_MEMORY: 3Gi
  GOOGLE_CLIENT_ID: 517277132860-t98k8t78dl7l597ut5moric15dsr09ch.apps.googleusercontent.com
