apiVersion: v1
kind: ConfigMap
metadata:
  name: runtime-notes
  namespace: palad
data:
  README: |
    This file exists to keep all kube resources under version control.
    It is safe to delete if not needed.

    App secret setup:
    1) Edit app secret in cluster:
       make kube-secret-set SECRET_NAME=palad-app-secrets SECRET_KEY=RAILS_SECRET_KEY_BASE
    2) Apply production manifests:
       make kube-apply-prod

    Production image pull setup (GHCR):
    1) Create a GitHub token with package read access.
    2) Edit pull secret in cluster:
       make kube-secret-set SECRET_NAME=ghcr-pull-secret SECRET_KEY=.dockerconfigjson
    3) Re-apply prod manifests:
       make kube-apply-prod

    S3 asset upload setup (IRSA):
    1) Read Terraform output:
       terraform -chdir=terraform output eks_assets_irsa_role_arn
    2) Set that ARN in kube/prod/06-rbac-runtime.yaml for:
       - palad-web service account annotation eks.amazonaws.com/role-arn
       - palad-worker service account annotation eks.amazonaws.com/role-arn
    3) Re-apply prod manifests:
       make kube-apply-prod

    EKS node autoscaling setup (Cluster Autoscaler):
    1) Read Terraform output:
       terraform -chdir=terraform output eks_cluster_autoscaler_irsa_role_arn
    2) Set that ARN in kube/prod/14-cluster-autoscaler.yaml for:
       - cluster-autoscaler service account annotation eks.amazonaws.com/role-arn
    3) If your EKS cluster name is not palad-eks, update:
       - --node-group-auto-discovery=.../k8s.io/cluster-autoscaler/<cluster-name>
         in kube/prod/14-cluster-autoscaler.yaml
    4) Re-apply prod manifests:
       make kube-apply-prod

    CloudFront static asset host setup:
    1) Read Terraform output:
       terraform -chdir=terraform output cloudfront_static_assets_url
    2) Build web image with that value passed as Docker build arg:
       - ASSET_HOST=https://static.palad.ai
       (assets are precompiled at image build time)
    3) Set kube/prod/07-app-config.yaml:
       - ASSET_HOST to that HTTPS URL
    4) Re-apply prod manifests:
       make kube-apply-prod

    GitHub deploy runner (ARC) setup:
    1) Create ARC auth secret from template:
       cp kube/arc/00-github-auth-secret.example.yaml /tmp/arc-github-auth.yaml
       # edit /tmp/arc-github-auth.yaml with GitHub App credentials
       kubectl apply -f /tmp/arc-github-auth.yaml
    2) Install ARC and deploy runner scale set:
       make kube-arc-install
    3) Verify runner is online in GitHub:
       Repository Settings -> Actions -> Runners
