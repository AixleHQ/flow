apiVersion: v1
kind: ConfigMap
metadata:
  name: runtime-notes
  namespace: palad
data:
  README: |
    This file exists to keep all kube resources under version control.
    It is safe to delete if not needed.

    App secret setup:
    1) Edit app secret in cluster:
       make kube-secret-set SECRET_NAME=palad-app-secrets
    2) Apply production manifests:
       make kube-apply-prod

    Production image pull setup (GHCR):
    1) Create a GitHub token with package read access.
    2) Edit pull secret in cluster:
       make kube-secret-set SECRET_NAME=ghcr-pull-secret
    3) Re-apply prod manifests:
       make kube-apply-prod

    S3 asset upload setup (IRSA):
    1) Read Terraform output:
       terraform -chdir=terraform output eks_assets_irsa_role_arn
    2) Set that ARN in kube/prod/06-rbac-runtime.yaml for:
       - palad-web service account annotation eks.amazonaws.com/role-arn
       - palad-worker service account annotation eks.amazonaws.com/role-arn
    3) Re-apply prod manifests:
       make kube-apply-prod

    CloudFront static asset host setup:
    1) Read Terraform output:
       terraform -chdir=terraform output cloudfront_static_assets_url
    2) Build web image with that value passed as Docker build arg:
       - ASSET_HOST=https://static.palad.ai
       (assets are precompiled at image build time)
    3) Set kube/prod/07-app-config.yaml:
       - ASSET_HOST to that HTTPS URL
    4) Re-apply prod manifests:
       make kube-apply-prod
