apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    palad.ai/env: prod
---
# Allow all pods within monitoring to talk to each other
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-same-namespace
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
---
# Allow Traefik (in palad namespace) to reach Grafana and Headlamp
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-to-observability-uis
  namespace: monitoring
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [grafana, headlamp]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: palad
          podSelector:
            matchLabels:
              app: traefik
      ports:
        - protocol: TCP
          port: 3000   # Grafana
        - protocol: TCP
          port: 4466   # Headlamp
