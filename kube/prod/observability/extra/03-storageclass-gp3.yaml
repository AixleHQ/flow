# gp3 StorageClass backed by the AWS EBS CSI driver.
# Required because gp2 is the default on older EKS clusters and gp3 does not
# exist until explicitly created.
#
# Prerequisites:
#   - aws-ebs-csi-driver add-on enabled on the EKS cluster
#     (EKS console → Cluster → Add-ons, or via eksctl/Terraform)
#
# gp3 advantages over gp2:
#   - 20% lower cost per GB
#   - Baseline of 3 000 IOPS and 125 MiB/s throughput included at no extra cost
#   - IOPS and throughput can be configured independently of volume size
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
allowVolumeExpansion: true
parameters:
  type: gp3
  fsType: ext4
