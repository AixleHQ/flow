# Traefik IngressRoutes for the observability UIs.
# These supplement the Helm charts, which do not generate Traefik CRD resources.
# Both routes sit behind admin-basic-auth and share the existing Let's Encrypt
# certificate that already covers grafana.aixle.com and headlamp.aixle.com.
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: monitoring
  labels:
    palad.ai/runtime-origin: palad
spec:
  entryPoints:
    - adminwebsecure
  routes:
    - match: Host(`grafana.aixle.com`)
      kind: Rule
      middlewares:
        - name: admin-basic-auth
          namespace: palad
      services:
        # Service name is {release-name}-grafana; release name is kube-prometheus-stack
        - name: kube-prometheus-stack-grafana
          port: 80
  tls:
    certResolver: letsencrypt
    domains:
      - main: dev.aixle.com
        sans:
          - www.dev.aixle.com
          - traefik.aixle.com
          - temporal.aixle.com
          - grafana.aixle.com
          - headlamp.aixle.com
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: headlamp
  namespace: monitoring
  labels:
    palad.ai/runtime-origin: palad
spec:
  entryPoints:
    - adminwebsecure
  routes:
    - match: Host(`headlamp.aixle.com`)
      kind: Rule
      # middlewares:
      #   - name: admin-basic-auth
      #     namespace: palad
      services:
        # Service name is {release-name}; release name is headlamp
        - name: headlamp
          port: 80
  tls:
    certResolver: letsencrypt
    domains:
      - main: dev.aixle.com
        sans:
          - www.dev.aixle.com
          - traefik.aixle.com
          - temporal.aixle.com
          - grafana.aixle.com
          - headlamp.aixle.com
