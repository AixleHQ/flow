apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp-admin
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: headlamp-admin-reader
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec", "pods/log"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-admin-reader-binding
subjects:
  - kind: ServiceAccount
    name: headlamp-admin
    namespace: monitoring
roleRef:
  kind: ClusterRole
  name: headlamp-admin-reader
  apiGroup: rbac.authorization.k8s.io
