# Helm values for grafana/loki
# Install: make kube-observability-install
# Docs: https://github.com/grafana/loki/tree/main/production/helm/loki
#
# Resource estimate (palad-eks, t3.large nodes — 2 vCPU / 8 GiB each):
#   Steady-state: ~100m CPU, ~256 MiB RAM
#   Log ingest: ~50-200 KiB/s (3-4 app pods + kube-system, light Rails traffic)
#   Storage growth: roughly 1-3 GiB/day compressed; 30-day retention → ~20-90 GiB worst case
#   The 20 GiB PVC is conservative for current cluster size. Increase if log volume grows.
#   ingestion_rate_mb is capped at 4 MiB/s and burst at 6 MiB/s to protect the node.

deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 720h  # 30 days
    # Ingest rate caps to protect the node from log spikes
    ingestion_rate_mb: 4
    ingestion_burst_size_mb: 6
    # Limit query cardinality to keep queries fast on a single-node setup
    max_query_series: 5000

singleBinary:
  replicas: 1
  persistence:
    size: 20Gi
    storageClass: gp3
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

# Disable multi-component mode (only singleBinary is active)
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

chunksCache:
  enabled: false
resultsCache:
  enabled: false

# Do not deploy Grafana via this chart (kube-prometheus-stack provides it)
grafana:
  enabled: false
