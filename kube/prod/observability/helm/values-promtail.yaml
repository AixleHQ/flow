# Helm values for grafana/promtail
# Install: make kube-observability-install
# Docs: https://github.com/grafana/helm-charts/tree/main/charts/promtail

config:
  clients:
    - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push
  snippets:
    # Parse CRI log format used by Kubernetes (containerd/CRI-O)
    pipelineStages:
      - cri: {}
