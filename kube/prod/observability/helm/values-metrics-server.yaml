# Helm values for metrics-server/metrics-server
# Install: make kube-observability-install
# Docs: https://github.com/kubernetes-sigs/metrics-server/tree/master/charts/metrics-server

defaultArgs:
  - --cert-dir=/tmp
  - --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname
  - --kubelet-use-node-status-port
  - --metric-resolution=15s
  # Required on most EKS clusters where kubelets do not present a CA-trusted cert.
  # Remove if your cluster has properly signed kubelet certificates.
  - --kubelet-insecure-tls
