# Helm values for grafana/alloy (replaces the deprecated grafana/promtail)
# Install: make kube-observability-install
# Docs: https://github.com/grafana/alloy/tree/main/operations/helm/charts/alloy
# Migration guide: https://grafana.com/docs/alloy/latest/collect/kubernetes-logs/
#
# Resource estimate (palad-eks, t3.large nodes — 2 vCPU / 8 GiB each):
#   Alloy runs as a DaemonSet (one pod per node). At current cluster size (2-3 nodes):
#   Steady-state per pod: ~20-50m CPU, ~64-128 MiB RAM
#   Tail file handles: ~20-40 (one per container log file across all pods on the node)
#   Network push to Loki: ~10-50 KiB/s per node under normal Rails traffic
#   Noisy kube-system health-check and AWS VPC CNI logs are dropped before pushing
#   to avoid wasting Loki ingest quota on low-value entries.

alloy:
  configMap:
    content: |
      // Discover all Kubernetes pods
      discovery.kubernetes "pods" {
        role = "pod"
      }

      // Relabel pod metadata into Loki labels and resolve log file paths
      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          target_label  = "node"
        }
        // Resolve the on-disk log path for each container
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          target_label  = "__path__"
          replacement   = "/var/log/pods/*$1/*.log"
        }
      }

      // Collect log files discovered above
      loki.source.file "pod_logs" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.process.parse_cri.receiver]
      }

      // Parse CRI log format used by containerd / CRI-O, then drop high-volume
      // low-value lines before sending to Loki to reduce ingest load.
      loki.process "parse_cri" {
        // Decode the CRI envelope (timestamp, stream, flags, message)
        stage.cri {}

        // Drop Kubernetes liveness/readiness probe noise (GET /healthz, /livez, /readyz)
        stage.drop {
          expression  = "(?i)(GET|HEAD) /(health|healthz|livez|readyz|ping)"
          drop_counter_reason = "health_probe"
        }

        // Drop AWS VPC CNI and kube-proxy frequent debug lines that add little value
        stage.drop {
          expression  = "(?i)(aws-cni|ipamd|kube-proxy).*(Successfully|Skipping|already set|no change)"
          drop_counter_reason = "aws_cni_noise"
        }

        forward_to = [loki.write.loki.receiver]
      }

      // Push logs to Loki
      loki.write "loki" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

# Run as DaemonSet so every node's logs are collected
controller:
  type: daemonset
  # Resource limits per node agent — sized for a lightly loaded t3.large
  resources:
    requests:
      cpu: "20m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"

# Mount the pod log directory from the host
alloy:
  mounts:
    varlog: true
    dockercontainers: false
