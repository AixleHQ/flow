# Helm values for grafana/alloy (replaces the deprecated grafana/promtail)
# Install: make kube-observability-install
# Docs: https://github.com/grafana/alloy/tree/main/operations/helm/charts/alloy
# Migration guide: https://grafana.com/docs/alloy/latest/collect/kubernetes-logs/
#
# Resource estimate (palad-eks, t3.large nodes — 2 vCPU / 8 GiB each):
#   Alloy runs as a single Deployment and tails pod logs via the Kubernetes API.
#   Steady-state: ~50-150m CPU, ~128-256 MiB RAM for a small cluster.
#   Noisy kube-system health-check and AWS VPC CNI logs are dropped before pushing
#   to avoid wasting Loki ingest quota on low-value entries.

alloy:
  configMap:
    content: |
      logging {
        level  = "info"
        format = "logfmt"
      }

      // Discover all Kubernetes pods across the cluster.
      discovery.kubernetes "pods" {
        role = "pod"
      }

      // Relabel pod metadata into Loki labels.
      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          action        = "replace"
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          action        = "replace"
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          action        = "replace"
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          action        = "replace"
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          action        = "replace"
          target_label  = "node"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_id"]
          action        = "replace"
          target_label  = "container_runtime"
          regex         = `^(\S+):\/\/.+$`
          replacement   = "$1"
        }
      }

      // Tail pod logs using the Kubernetes API.
      loki.source.kubernetes "pod_logs" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.process.pod_logs.receiver]
      }

      // Drop high-volume low-value lines before sending to Loki.
      loki.process "pod_logs" {
        stage.static_labels {
          values = {
            cluster = "palad-eks",
          }
        }

        stage.drop {
          expression          = "(?i)(GET|HEAD) /(health|healthz|livez|readyz|ping)"
          drop_counter_reason = "health_probe"
        }

        stage.drop {
          expression          = "(?i)(aws-cni|ipamd|kube-proxy).*(Successfully|Skipping|already set|no change)"
          drop_counter_reason = "aws_cni_noise"
        }

        forward_to = [loki.write.loki.receiver]
      }

      // Push logs to Loki
      loki.write "loki" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }
# Run as a single Deployment because Kubernetes API log collection does not
# need node-local filesystem access.
controller:
  type: deployment
  replicas: 1
  # Resource limits for cluster-wide pod log collection.
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "300m"
      memory: "512Mi"
