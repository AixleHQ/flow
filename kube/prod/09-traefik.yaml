apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik
  namespace: palad
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::541894707537:role/palad-eks-traefik-dns-role
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: traefik
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "endpointslices", "secrets", "pods", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions", "networking.k8s.io"]
    resources: ["ingresses", "ingressclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["traefik.io"]
    resources:
      ["ingressroutes", "ingressroutetcps", "ingressrouteudps", "middlewares", "middlewaretcps", "traefikservices", "serverstransports", "serverstransporttcps", "tlsoptions", "tlsstores"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: traefik
subjects:
  - kind: ServiceAccount
    name: traefik
    namespace: palad
roleRef:
  kind: ClusterRole
  name: traefik
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: palad
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traefik
  template:
    metadata:
      labels:
        app: traefik
    spec:
      serviceAccountName: traefik
      initContainers:
        - name: init-acme
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              touch /data/acme.json
              chmod 600 /data/acme.json
          volumeMounts:
            - name: acme-storage
              mountPath: /data
      containers:
        - name: traefik
          image: traefik:v3.3
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1500m"
              memory: "1Gi"
          args:
            - "--api.dashboard=true"
            - "--api.insecure=true"
            - "--providers.kubernetescrd=true"
            - "--providers.kubernetesingress=true"
            - "--entrypoints.traefik.http.tls=true"
            - "--entrypoints.web.address=:80"
            - "--entrypoints.websecure.address=:443"
            - "--entrypoints.adminwebsecure.address=:8443"
            - "--certificatesresolvers.letsencrypt.acme.email=admin@palad.ai"
            - "--certificatesresolvers.letsencrypt.acme.storage=/data/acme.json"
            - "--certificatesresolvers.letsencrypt.acme.dnschallenge=true"
            - "--certificatesresolvers.letsencrypt.acme.dnschallenge.provider=route53"
            - "--log.level=DEBUG"
          env:
            # Keep region aligned with terraform/aws_region for Route53 DNS challenge.
            - name: AWS_REGION
              value: us-east-1
            - name: AWS_DEFAULT_REGION
              value: us-east-1
          ports:
            - name: web
              containerPort: 80
            - name: websecure
              containerPort: 443
            - name: adminwebsecure
              containerPort: 8443
            - name: traefik
              containerPort: 8090
          volumeMounts:
            - name: acme-storage
              mountPath: /data
      volumes:
        - name: acme-storage
          persistentVolumeClaim:
            claimName: traefik-acme
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: traefik-acme
  namespace: palad
spec:
  storageClassName: gp2
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: palad
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
spec:
  type: LoadBalancer
  selector:
    app: traefik
  ports:
    - name: web
      port: 80
      targetPort: 80
    - name: websecure
      port: 443
      targetPort: 443

---
apiVersion: v1
kind: Service
metadata:
  name: traefik-admin
  namespace: palad
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
spec:
  type: LoadBalancer
  selector:
    app: traefik
  loadBalancerSourceRanges:
    - 34.1.250.211/32
  ports:
    - name: adminwebsecure
      port: 443
      targetPort: 8443

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-dashboard
  namespace: palad
spec:
  entryPoints:
    - adminwebsecure
  routes:
    - match: Host(`traefik.palad.ai`)
      kind: Rule
      middlewares:
        - name: admin-basic-auth
        - name: traefik-dashboard-redirect
      services:
        - name: api@internal
          kind: TraefikService

  tls:
    certResolver: letsencrypt
    domains:
      - main: palad.ai
        sans:
          - www.palad.ai
          - traefik.palad.ai
          - temporal.palad.ai

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: traefik-dashboard-redirect
  namespace: palad
spec:
  redirectRegex:
    regex: "^(https?://[^/]+)/?$"
    replacement: "${1}/dashboard/"
