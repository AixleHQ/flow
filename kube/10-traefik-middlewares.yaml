apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: terminal-auth
  namespace: palad
spec:
  forwardAuth:
    address: http://web.palad.svc.cluster.local:4000/api/v1/internal/ws_auth
    trustForwardHeader: true
    authResponseHeadersRegex: ^X-
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: terminal-cors
  namespace: palad
spec:
  headers:
    accessControlAllowOriginList:
      - http://localhost:4000
      - http://localhost
    accessControlAllowMethods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    accessControlAllowHeaders:
      - Content-Type
      - Authorization
      - X-Requested-With
      - Cookie
    accessControlAllowCredentials: true
