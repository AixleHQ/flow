apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: palad
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      serviceAccountName: palad-web
      containers:
        - name: web
          image: web
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: palad-app-config
            - secretRef:
                name: palad-app-secrets
          ports:
            - containerPort: 4000
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: palad
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 4000
      targetPort: 4000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp
  namespace: palad
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp
  template:
    metadata:
      labels:
        app: mcp
    spec:
      serviceAccountName: palad-web
      containers:
        - name: mcp
          image: web
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: palad-app-config
            - secretRef:
                name: palad-app-secrets
          env:
            - name: MCP_PORT
              value: "4002"
          ports:
            - containerPort: 4002
          command: ["bundle", "exec", "puma", "-C", "config/puma_mcp.rb"]
---
apiVersion: v1
kind: Service
metadata:
  name: mcp
  namespace: palad
spec:
  selector:
    app: mcp
  ports:
    - name: http
      port: 4002
      targetPort: 4002
