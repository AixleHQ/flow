apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: palad-dev
spec:
  replicas: 1
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      serviceAccountName: palad-web
      containers:
        - name: web
          image: web
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          envFrom:
            - configMapRef:
                name: palad-app-config
            - secretRef:
                name: palad-app-secrets
          ports:
            - containerPort: 4000
          startupProbe:
            httpGet:
              path: /up
              port: 4000
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /up
              port: 4000
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /up
              port: 4000
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: palad-dev
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 4000
      targetPort: 4000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp
  namespace: palad-dev
spec:
  replicas: 1
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: mcp
  template:
    metadata:
      labels:
        app: mcp
    spec:
      serviceAccountName: palad-web
      containers:
        - name: mcp
          image: web
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "200m"
              memory: "384Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          envFrom:
            - configMapRef:
                name: palad-app-config
            - secretRef:
                name: palad-app-secrets
          env:
            - name: MCP_PORT
              value: "4002"
          ports:
            - containerPort: 4002
          startupProbe:
            httpGet:
              path: /up
              port: 4002
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /up
              port: 4002
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /up
              port: 4002
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          command: ["bundle", "exec", "puma", "-C", "config/puma_mcp.rb"]
---
apiVersion: v1
kind: Service
metadata:
  name: mcp
  namespace: palad-dev
spec:
  selector:
    app: mcp
  ports:
    - name: http
      port: 4002
      targetPort: 4002
