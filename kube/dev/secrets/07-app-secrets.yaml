apiVersion: v1
kind: Secret
metadata:
  name: palad-app-secrets
  namespace: palad-dev
type: Opaque
stringData:
  # Replace these values if you use kube-secrets-apply.
  RAILS_SECRET_KEY_BASE: "replace_me"
  # Local dev default matches kube/dev/02-postgres.yaml.
  DB_PASSWORD: "postgres"
  # Local dev default for Temporal DB connection.
  TEMPORAL_DB_PASSWORD: "postgres"
  GITHUB_PRIVATE_PEM: "replace_me"
  BITBUCKET_OAUTH_SECRET: "replace_me"
  GITLAB_APP_SECRET: "replace_me"
