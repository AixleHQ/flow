apiVersion: v1
kind: ServiceAccount
metadata:
  name: palad-web
  namespace: palad-dev
  # Add an IRSA role annotation when this workload needs AWS API access.
  # annotations:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::<account-id>:role/palad-web-irsa-role
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: palad-worker
  namespace: palad-dev
  # Add an IRSA role annotation when this workload needs AWS API access.
  # annotations:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::<account-id>:role/palad-worker-irsa-role
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: palad-otlp
  namespace: palad-dev
  # Add an IRSA role annotation when this workload needs AWS API access.
  # annotations:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::<account-id>:role/palad-otlp-irsa-role
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: palad-runtime
  namespace: palad-dev
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/exec", "services"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: ["traefik.io"]
    resources: ["ingressroutes", "middlewares"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: palad-runtime
  namespace: palad-dev
subjects:
  - kind: ServiceAccount
    name: palad-web
    namespace: palad-dev
  - kind: ServiceAccount
    name: palad-worker
    namespace: palad-dev
  - kind: ServiceAccount
    name: palad-otlp
    namespace: palad-dev
roleRef:
  kind: Role
  name: palad-runtime
  apiGroup: rbac.authorization.k8s.io
