# HorizontalPodAutoscaler resources for application deployments in the palad-dev namespace.
# Lower replica counts than prod — dev environment prioritizes resource efficiency over HA.
# Targets 70% average CPU utilization as the primary scaling metric.
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web
  namespace: palad-dev
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
