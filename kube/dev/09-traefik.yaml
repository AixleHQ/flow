apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik
  namespace: palad-dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: traefik
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "endpointslices", "secrets", "pods", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions", "networking.k8s.io"]
    resources: ["ingresses", "ingressclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["traefik.io"]
    resources:
      - ingressroutes
      - ingressroutetcps
      - ingressrouteudps
      - middlewares
      - middlewaretcps
      - traefikservices
      - serverstransports
      - serverstransporttcps
      - tlsoptions
      - tlsstores
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: traefik
subjects:
  - kind: ServiceAccount
    name: traefik
    namespace: palad-dev
roleRef:
  kind: ClusterRole
  name: traefik
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: palad-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traefik
  template:
    metadata:
      labels:
        app: traefik
    spec:
      serviceAccountName: traefik
      containers:
        - name: traefik
          image: traefik:v3.3
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1500m"
              memory: "1Gi"
          args:
            - "--api.dashboard=true"
            - "--api.insecure=true"
            - "--providers.kubernetescrd=true"
            - "--providers.kubernetesingress=true"
            - "--entrypoints.traefik.http.tls=true"
            - "--entrypoints.web.address=:80"
            - "--entrypoints.websecure.address=:443"
            - "--entrypoints.adminwebsecure.address=:8443"
            - "--log.level=DEBUG"
          ports:
            - name: web
              containerPort: 80
            - name: websecure
              containerPort: 443
            - name: adminwebsecure
              containerPort: 8443
            - name: traefik
              containerPort: 8090
---
apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: palad-dev
spec:
  type: NodePort
  selector:
    app: traefik
  ports:
    - name: web
      port: 80
      targetPort: 80
    - name: websecure
      port: 443
      targetPort: 443

---
apiVersion: v1
kind: Service
metadata:
  name: traefik-admin
  namespace: palad-dev
spec:
  type: NodePort
  selector:
    app: traefik
  ports:
    - name: adminwebsecure
      port: 443
      targetPort: 8443

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-dashboard
  namespace: palad-dev
spec:
  entryPoints:
    - adminwebsecure
  routes:
    - match: Host(`traefik.palad.ai`)
      kind: Rule
      services:
        - name: api@internal
          kind: TraefikService

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: traefik-dashboard-redirect
  namespace: palad-dev
spec:
  redirectRegex:
    regex: "^(https?://[^/]+)/?$"
    replacement: "${1}/dashboard/"
