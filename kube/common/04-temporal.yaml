apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  namespace: palad
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temporal
  template:
    metadata:
      labels:
        app: temporal
    spec:
      containers:
        - name: temporal
          image: temporalio/auto-setup:1.29.0
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "3Gi"
          env:
            - name: DB
              value: postgres12
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: palad-app-config
                  key: DB_PORT
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: palad-app-config
                  key: DB_USERNAME
            - name: POSTGRES_PWD
              valueFrom:
                secretKeyRef:
                  name: palad-app-secrets
                  key: DB_PASSWORD
            - name: POSTGRES_SEEDS
              valueFrom:
                configMapKeyRef:
                  name: palad-app-config
                  key: DB_HOST
            - name: LOG_LEVEL
              value: error
            - name: BIND_ON_IP
              value: "0.0.0.0"
            - name: TEMPORAL_BROADCAST_ADDRESS
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - containerPort: 7233
---
apiVersion: v1
kind: Service
metadata:
  name: temporal
  namespace: palad
spec:
  selector:
    app: temporal
  ports:
    - name: temporal
      port: 7233
      targetPort: 7233
