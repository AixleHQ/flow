apiVersion: v1
kind: Secret
metadata:
  name: arc-github-auth
  namespace: arc-runners
type: Opaque
stringData:
  # Prefer GitHub App auth for ARC.
  # Create App with repository administration access for this repo,
  # then fill values below.
  github_app_id: "3074205"
  github_app_installation_id: "115846355"
  github_app_private_key: |
    -----BEGIN RSA PRIVATE KEY-----
    replace_me
    -----END RSA PRIVATE KEY-----

  # Alternative (less preferred): set github_token and remove app fields.
  # github_token: "replace_me"
