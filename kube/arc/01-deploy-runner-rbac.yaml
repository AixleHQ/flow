apiVersion: v1
kind: Namespace
metadata:
  name: arc-runners
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gha-deploy-runner
  namespace: arc-runners
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gha-deploy-rollout
  namespace: palad
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["web", "worker-ruby", "mcp"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gha-deploy-rollout
  namespace: palad
subjects:
  - kind: ServiceAccount
    name: gha-deploy-runner
    namespace: arc-runners
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gha-deploy-rollout
