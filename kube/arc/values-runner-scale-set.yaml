# ARC runner scale set for deployment jobs only.
# Install with:
#   make kube-arc-install-runner-set
githubConfigUrl: "https://github.com/palad-ai/palad-app"
githubConfigSecret: arc-github-auth
runnerScaleSetName: "palad-deploy-runner"

# Keep one warm runner and allow short bursts during queued deploys.
minRunners: 1
maxRunners: 1

template:
  spec:
    serviceAccountName: gha-deploy-runner
