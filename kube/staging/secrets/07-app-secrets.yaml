apiVersion: v1
kind: Secret
metadata:
  name: palad-app-secrets
  namespace: palad-staging
type: Opaque
stringData:
  # Replace these values before applying to the cluster.
  RAILS_SECRET_KEY_BASE: "replace_me"
  # In-cluster PostgreSQL password — must match POSTGRES_PASSWORD in 02-postgres.yaml.
  DB_PASSWORD: "replace_me"
  # Temporal uses the same in-cluster PostgreSQL; set the same value as DB_PASSWORD.
  TEMPORAL_DB_PASSWORD: "replace_me"
  GITHUB_APP_PRIVATE_KEY: "replace_me"
  BITBUCKET_OAUTH_SECRET: "replace_me"
  GITLAB_APP_SECRET: "replace_me"
