apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: terminal-auth
  namespace: palad-staging
  labels:
    palad.ai/runtime-origin: palad-staging
spec:
  forwardAuth:
    address: http://web.palad-staging.svc.cluster.local:4000/api/v1/internal/ws_auth
    trustForwardHeader: true
    authResponseHeadersRegex: ^X-
---
# HTTP basic authentication for the staging environment.
# The secret traefik-basic-auth must exist in the palad-staging namespace
# (see kube/staging/secrets/09-traefik-basic-auth-secret.yaml).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: staging-basic-auth
  namespace: palad-staging
  labels:
    palad.ai/runtime-origin: palad-staging
spec:
  basicAuth:
    secret: traefik-basic-auth
    realm: "Palad Staging"
