apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-ruby
  namespace: palad-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-ruby
  template:
    metadata:
      labels:
        app: worker-ruby
    spec:
      serviceAccountName: palad-worker
      initContainers:
        - name: wait-for-temporal
          image: busybox:1.36.1
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          command:
            - sh
            - -c
            - |
              until nc -z temporal 7233; do
                echo "waiting for temporal";
                sleep 2;
              done
      containers:
        - name: worker-ruby
          image: ghcr.io/palad-ai/palad-app-web:staging
          imagePullPolicy: Always
          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          command: ["bin/temporal_worker"]
          envFrom:
            - configMapRef:
                name: palad-app-config
            - secretRef:
                name: palad-app-secrets
