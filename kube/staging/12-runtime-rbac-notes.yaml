apiVersion: v1
kind: ConfigMap
metadata:
  name: runtime-notes
  namespace: palad-staging
data:
  README: |
    This file exists to keep all kube resources under version control.
    It is safe to delete if not needed.

    Staging environment setup:

    Prerequisites:
    - Apply Terraform to provision the staging S3 bucket and IRSA role:
        terraform -chdir=terraform apply
    - Confirm the IRSA role ARN:
        terraform -chdir=terraform output eks_assets_staging_irsa_role_arn
    - Update kube/staging/06-rbac-runtime.yaml with the returned ARN for:
        - palad-web service account annotation eks.amazonaws.com/role-arn
        - palad-worker service account annotation eks.amazonaws.com/role-arn

    Secrets setup:
    1) Rotate the RAILS_SECRET_KEY_BASE, DB_PASSWORD, TEMPORAL_DB_PASSWORD, and
       GITHUB_APP_PRIVATE_KEY values in kube/staging/secrets/07-app-secrets.yaml.
    2) Rotate the traefik basic auth password in
       kube/staging/secrets/09-traefik-basic-auth-secret.yaml:
         htpasswd -nB admin
    3) Populate the GHCR pull secret in
       kube/staging/secrets/08-ghcr-pull-secret.yaml.
    4) Apply secrets:
         kubectl apply -f kube/staging/secrets/

    First-time deployment:
    1) Apply all staging manifests in order:
         kubectl apply -f kube/staging/
    2) Run DB setup (first deploy only):
         kubectl -n palad-staging run db-setup \
           --image=ghcr.io/palad-ai/palad-app-web:staging \
           --restart=Never \
           --env-from=configmap/palad-app-config \
           --env-from=secret/palad-app-secrets \
           -- bundle exec rails db:create db:migrate
    3) Verify rollout:
         kubectl -n palad-staging rollout status deployment/web
         kubectl -n palad-staging rollout status deployment/mcp
         kubectl -n palad-staging rollout status deployment/worker-ruby

    Subsequent deploys:
    - Push to the staging branch; GitHub Actions handles migration and rollout.

    DNS:
    - staging.palad.ai and *.staging.palad.ai must point to the staging Traefik NLB.
    - The wildcard record covers traefik.staging.palad.ai and temporal.staging.palad.ai.

    Access control:
    - External access is restricted to the current external prod-agent egress IP
      (3.217.219.60/32) and the owner IP (34.1.250.211/32) via
      loadBalancerSourceRanges on the Traefik Service.
    - HTTP basic auth (staging-basic-auth middleware) is applied to all IngressRoutes.
