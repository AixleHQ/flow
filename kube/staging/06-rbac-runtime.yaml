apiVersion: v1
kind: ServiceAccount
metadata:
  name: palad-web
  namespace: palad-staging
  annotations:
    # Reuse the existing IRSA role — it grants access to palad-assets-staging S3 bucket.
    # Set from Terraform output: eks_assets_irsa_role_arn (staging variant).
    eks.amazonaws.com/role-arn: "arn:aws:iam::541894707537:role/palad-eks-assets-staging-role"
imagePullSecrets:
  - name: ghcr-pull-secret
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: palad-worker
  namespace: palad-staging
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::541894707537:role/palad-eks-assets-staging-role"
imagePullSecrets:
  - name: ghcr-pull-secret
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: palad-otlp
  namespace: palad-staging
imagePullSecrets:
  - name: ghcr-pull-secret
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: palad-runtime-staging
subjects:
  - kind: ServiceAccount
    name: palad-web
    namespace: palad-staging
  - kind: ServiceAccount
    name: palad-worker
    namespace: palad-staging
  - kind: ServiceAccount
    name: palad-otlp
    namespace: palad-staging
roleRef:
  kind: ClusterRole
  name: palad-runtime
  apiGroup: rbac.authorization.k8s.io
