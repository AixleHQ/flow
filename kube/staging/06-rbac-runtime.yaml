apiVersion: v1
kind: ServiceAccount
metadata:
  name: palad-web
  namespace: palad-staging
  annotations:
    # IRSA role for staging S3 bucket access.
    # Provisioned by Terraform resource: aws_iam_role.eks_assets_staging (terraform/s3_assets_staging.tf).
    # ARN is the output of: terraform output eks_assets_staging_irsa_role_arn
    eks.amazonaws.com/role-arn: "arn:aws:iam::541894707537:role/palad-eks-assets-staging-role"
imagePullSecrets:
  - name: ghcr-pull-secret
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: palad-worker
  namespace: palad-staging
  annotations:
    # Same IRSA role as palad-web — see terraform/s3_assets_staging.tf (aws_iam_role.eks_assets_staging).
    eks.amazonaws.com/role-arn: "arn:aws:iam::541894707537:role/palad-eks-assets-staging-role"
imagePullSecrets:
  - name: ghcr-pull-secret
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: palad-otlp
  namespace: palad-staging
imagePullSecrets:
  - name: ghcr-pull-secret
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: palad-runtime-staging
subjects:
  - kind: ServiceAccount
    name: palad-web
    namespace: palad-staging
  - kind: ServiceAccount
    name: palad-worker
    namespace: palad-staging
  - kind: ServiceAccount
    name: palad-otlp
    namespace: palad-staging
roleRef:
  kind: ClusterRole
  name: palad-runtime
  apiGroup: rbac.authorization.k8s.io
