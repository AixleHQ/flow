[project]
name = "palad-temporal-worker"
version = "0.1.0"
description = "Temporal worker for Palad (Python side)"
requires-python = "==3.13.*"
dependencies = [
    # Temporal
    "temporalio>=1.7.0",
    # Config
    "dynaconf>=3.2.11",
    "pyyaml>=6.0.3",
    "jinja2>=3.1.6",
    # Database
    "sqlalchemy>=2.0.44",
    "psycopg2-binary>=2.9.11",
    "inflect>=7.0.0",
    # Data validation
    "pydantic>=2.12.3",
    # AI/ML stack (from legacy)
    "langgraph>=1.0.2",
    "langchain[anthropic,openai]>=1.0.3",
    "instructor>=1.7.0",
    # Vector DB
    "qdrant-client>=1.15.1",
    "langchain-qdrant>=0.2.1",
    # Telemetry
    "langfuse>=3.2.1",
    # Utilities
    "httpx<0.28.0",
    "redis>=5.0.0",
    "langchain-text-splitters>=1.0.0",
    "python-docx>=1.2.0",
    "PyPDF2>=3.0.0",
    "pdfplumber>=0.10.4",
    "pytesseract>=0.3.10",
    "pdf2image>=1.17.0",
    "striprtf>=0.0.26",
    "loguru>=0.7.0",
    "scikit-learn>=1.7.2",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]

[tool.uv]
index-url = "https://pypi.org/simple"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
extend-exclude = ["scripts/"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_return_any = true
strict_equality = true
disallow_untyped_calls = true
# Exclude directories from checking
exclude = []
mypy_path = "."

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "vcrpy>=7.0.0",
    "pytest-recording>=0.13.4",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.2",
    "factory-boy>=3.3.0",
    "fakeredis>=2.26.2",
    "mypy>=1.13.0",
    "debugpy>=1.8.11",
    "ruff>=0.12.2",
    "pytest-xdist>=3.8.0",
    "pytest-run-parallel>=0.7.1",
]


