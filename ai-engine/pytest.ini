[pytest]
# Pytest configuration for AI Engine tests

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
log_cli = 1

# Verbose output
addopts =
    # -v
    --tb=short
    # --disable-logging
    --log-disable='vcr.cassette'
    --log-disable='vcr.stubs.httpx_stubs'
    # -s
    --no-header
    # --no-summary
    # --show-capture=all
    --log-cli-level=INFO
    # --capture=fd
    --show-capture=no
    # -n 10
    --disable-warnings

# Async support
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Markers
markers =
    vcr: Tests that use VCR cassettes for HTTP recording
# unit: Unit tests (no external dependencies)
# integration: Integration tests (requires DB, Temporal, etc)
# slow: Slow tests (LLM calls, etc)
