- request:
    body: '{"messages": [{"content": "You are a document relevance analyst for task
      completion assessment.\n\nTask: Evaluate if the provided documents contain sufficient
      information to successfully complete the specified task.\n\nContext: Consider
      both the breadth and depth of information needed. The documents should provide
      enough context, examples, and domain knowledge to execute the task effectively.\n\nOutput:
      \"sufficient\" if documents provide adequate context for task completion, \"insufficient\"
      if more information is needed\n\nRule: Focus on task completion capability rather
      than general document relevance.", "role": "system"}, {"content": "\n## Task
      Information\nTask Prompt: # Domain-Specific Technical Use Case Reconstructor\n\n##
      Purpose\nTo systematically analyze source code and reconstruct comprehensive
      use cases that document actual implemented functionality, strictly tied to a
      provided user story AND validated against domain boundaries.\nTo systematically
      analyze source code and reconstruct comprehensive use cases that document actual
      implemented functionality, strictly derived from a single provided user story
      AND also validated to be within the responsibilities of the domain. \nEvery
      use case MUST simultaneously satisfy both the user story scope and the domain
      boundaries.\n\n## Core Objectives\n- Extract use cases explicitly derived from
      the provided user story (treat the user story as the primary scope)\n- Validate
      use cases belong PRIMARY to the specified domain\n- Reject any use case that
      is domain-specific but not clearly required to fulfill the provided user story\n-
      Focus on domain-specific business mechanics and behavior\n- Maintain strict
      domain boundaries to exclude cross-cutting concerns that are not part of the
      user story\n\n## Domain-Specific Use Case Identification\n\n### Primary Domain
      Validation Criteria\n1. Use case delivers PRIMARY value to {domain_name} domain\n2.
      Business mechanics are core to domain responsibilities\n3. User interactions
      are domain-specific, not generic\n4. Business outcomes align with domain objectives\n5.
      Implementation evidence shows domain ownership\n\n### Use Case Identification
      Criteria (Domain-Focused)\n1. Distinct user goals explicitly stated in the provided
      user story AND relevant to provided domain. Ignore any goals or workflows that
      are not stated or clearly implied by this user story, even if they are domain-specific.\n2.
      Each use case must implement exactly one primary user goal or variation of that
      goal from this user story.\n\n2. Domain-specific operation types (single vs
      batch) as defined in user story\n3. User roles with domain-specific responsibilities
      from user story\n4. Domain-relevant authorization requirements from user story\n5.
      API endpoints that primarily serve {domain_name} functionality\n6. Error handling
      paths requiring domain-specific user interaction\n7. Alternative flows with
      domain-specific business outcomes\n8. Data processing paths requiring domain-specific
      user decisions\n\n### Domain Boundary Rules\n- Group operations only if inseparable
      within domain''s business scope\n- Each use case must map to domain-specific
      user goal from user story\n- Exclude scenarios that span multiple domains\n-
      Maintain strict domain functionality boundaries\n- Validate against domain responsibilities
      to eliminate cross-cutting concerns\n\n## Enhanced Business Focus (Domain-Specific)\n1.
      Articulate business value specific to {domain_name} from user story\n2. Connect
      to domain-specific business objectives from user story\n3. Include measurable
      success criteria relevant to domain from user story\n4. Analyze domain-specific
      business process impact from user story\n5. Identify stakeholder benefits within
      domain context from user story\n\n## Output Requirements\n\n**CRITICAL**: Return
      response as a structured object with the following format:\n\n### Required Fields
      for Each Use Case:\n- **name**: Clear, domain-specific action name that reflects
      {domain_name} responsibilities\n- **description**: Detailed workflow covering
      domain-specific business logic including actors, preconditions, main flow, alternative
      flows, and postconditions\n- **data**: Structured object with the following
      markdown-formatted fields:\n  * **Acceptance Criteria**: Specific, testable
      conditions for completion (Markdown-formatted)\n  * **Business Notes**: Critical
      business context and domain-specific considerations (Markdown-formatted)\n  *
      **Success Metrics**: Measurable outcomes specific to {domain_name} (Markdown-formatted)\n  *
      **Stakeholder Impact**: How this use case benefits domain stakeholders (Markdown-formatted)\n-
      **justification**: \"Evidence from {domain_name} context: [specific source evidence
      tied to user story and domain]\"\n- **gherkin_syntax**: Domain-specific business
      mechanics using Gherkin format with domain context\n\n### Domain-Specific Gherkin
      Guidelines\n\n**Domain Business Context**: Frame all scenarios within {domain_name}
      business context\n**Domain-Specific Roles**: Use roles that are relevant to
      {domain_name} operations\n**Domain Business Rules**: Detail variations in domain-specific
      business logic\n**Domain Outcomes**: Every Then clause must state measurable
      domain-specific business results\n**Domain Terminology**: Use business terms
      specific to {domain_name}, avoid generic language\n\n### Required Domain-Specific
      Scenario Structure\n\n```gherkin\nBackground:\n  Given the {domain_name} system
      is operational\n  And [domain-specific business preconditions from user story]\n\nScenario:
      [domain-specific business scenario name from user story]\n  Given [domain business
      context from user story]\n  When [domain-specific business action by domain
      user]\n  Then [domain-specific business outcome achieved]\n  And [domain business
      verification or impact]\n\nScenario Template: [domain business variation from
      user story]\n  Given [domain business context from user story]\n  When [domain
      business action] with <domain business parameter>\n  Then [domain business outcome]
      should reflect <domain business result>\n\n  Examples:\n    | domain business
      parameter | domain business result |\n    | domain_value1            | domain_output1         |\n    |
      domain_value2            | domain_output2         |\n```\n\n## Domain Validation
      Checklist\n\u2705 Use cases are PRIMARY to {domain_name} domain\n\u2705 Business
      mechanics are domain-specific\n\u2705 User interactions serve domain objectives\n\u2705
      Implementation evidence supports domain ownership\n\u2705 No cross-domain concerns
      included\n\u2705 Gherkin scenarios use domain-specific terminology\n\n## Response
      Protocol\n- Deliver complete structure in valid structured format\n- Provide
      domain-specific \"data\" in markdown format\n- Include only use cases PRIMARY
      to {domain_name} tied to user story\n- Ensure all content validates against
      domain boundaries\n- Focus Gherkin syntax on domain-specific business mechanics\n\n##
      Evidence-Based Validation\n- Reference specific vector search evidence that
      supports the use case\n- Validate against actual implementation patterns found
      in the code\n- Ensure use case aligns with domain boundaries established in
      the evidence\n- Exclude use cases that lack supporting implementation evidence\n\nExtract
      only use cases that:\n1. Are explicitly supported by the provided user story\n2.
      Have PRIMARY ownership in {domain_name} domain\n3. Show clear implementation
      evidence in vector search results\n4. Represent complete domain-specific business
      workflows\n5. Maintain strict domain boundaries\nHuman Prompt: \n## Domain Context\nDomain
      Name: User Authentication \nUser Story Context: User Login: As a user, I want
      to log in with email and password, so that I can access my account\n\n## Task\nExtract
      only the PRIMARY, DIRECTLY RELATED use cases for this domain using the context
      above. \nUse the User Story as the primary source. \nVector Search Context is
      supplementary evidence to support extraction.\n\n\n## Documents to Evaluate\n[''\\n---
      Document 1 ---\\nUser Authentication Domain Overview:\\n\\nThe User Authentication
      domain handles all aspects of user identity management including registration,
      login, password management, multi-factor authentication, and session handling.
      This domain ensures secure access to the system and manages user credentials.\\n\\n\\n---
      Document 2 ---\\nAuthentication Technical Specifications:\\n\\n- OAuth 2.0 and
      OpenID Connect integration\\n- JWT token generation and validation\\n- Password
      hashing using bcrypt\\n- Session management with Redis\\n- Rate limiting for
      login attempts\\n- Account lockout mechanisms\\n- Password reset workflows\\n\\n\\n---
      Document 3 ---\\nAuthentication Features and Requirements:\\n\\n- User registration
      with email verification\\n- Login with username/password or social providers\\n-
      Password strength validation\\n- Two-factor authentication (2FA)\\n- Password
      reset via email\\n- Session timeout and refresh\\n- Role-based access control
      (RBAC)\\n- Account management (profile updates, deletion)'']\n\n## Assessment\nEvaluate
      if these documents provide sufficient information to complete the task effectively.\nConsider
      domain knowledge, examples, context, and completeness of information needed.\n\nRespond
      with exactly: \"sufficient\" or \"insufficient\"\n", "role": "user"}], "model":
