      practical situations, pictograms \\ncan be a helpful component to swiftly represent
      an idea visually. Iconography should never be the main component of brand collateral.
      \\nThe thick strokes, geometric \\nshapes, and sharp edges of our iconography
      are inspired by the light and airy qualities of our font. Simple, descriptive,
      and direct icons are preferred.\\nIf more pictograms are required, \\nthey can
      either be created from scratch to match the design or purchased from related
      collections.Guidance for use:\\n\u2022 Scale the pictogram to fit \\nthe thickness
