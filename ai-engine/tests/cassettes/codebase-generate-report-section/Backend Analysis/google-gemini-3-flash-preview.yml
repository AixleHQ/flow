      The Java `OrderService` effectively orchestrates multiple domains (Inventory,
      Payment, Shipping).\n- **Transaction Management:** Good use of `@Transactional`
      (Java) and `ActiveRecord::Base.transaction` (Ruby) to ensure atomicity.\n\n**Strengths:**\n-
