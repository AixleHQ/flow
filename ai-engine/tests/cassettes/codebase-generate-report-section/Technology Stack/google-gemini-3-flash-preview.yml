      Note version information if available in files\n"}, {"role": "user", "content":
      "\n\n=== example.js ===\nFile: example.js\nCategories: UI, Controllers, Logic\nLanguage:
      JavaScript\nFramework: React\n\n/**\n * React component for managing shopping
      cart functionality in an e-commerce application.\n * Handles item management,
      quantity updates, price calculations, and checkout initiation.\n */\n\nimport
      React, { useState, useEffect, useCallback } from ''react'';\nimport { useDispatch,
      useSelector } from ''react-redux'';\nimport { toast } from ''react-toastify'';\n\nimport
      {\n  addItemToCart,\n  removeItemFromCart,\n  updateItemQuantity,\n  clearCart,\n  fetchCartItems\n}
      from ''../store/slices/cartSlice'';\nimport { initiateCheckout } from ''../store/slices/checkoutSlice'';\nimport
      { formatCurrency } from ''../utils/currency'';\nimport { trackEvent } from ''../analytics/tracking'';\n\nimport
      CartItem from ''./CartItem'';\nimport PriceBreakdown from ''./PriceBreakdown'';\nimport
      CheckoutButton from ''./CheckoutButton'';\nimport EmptyCart from ''./EmptyCart'';\n\nconst
      ShoppingCart = ({ isOpen, onClose, className = '''' }) => {\n  const dispatch
      = useDispatch();\n  const { items, totalItems, subtotal, shipping, tax, total,
      loading, error } = useSelector(state => state.cart);\n  const { user } = useSelector(state
      => state.auth);\n\n  const [localLoading, setLocalLoading] = useState(false);\n  const
      [validationErrors, setValidationErrors] = useState({});\n\n  useEffect(() =>
      {\n    if (isOpen && user) {\n      dispatch(fetchCartItems(user.id));\n    }\n  },
      [isOpen, user, dispatch]);\n\n  const handleQuantityChange = useCallback(async
      (itemId, newQuantity) => {\n    if (newQuantity < 1) {\n      handleRemoveItem(itemId);\n      return;\n    }\n\n    if
      (newQuantity > 99) {\n      toast.error(''Maximum quantity is 99'');\n      return;\n    }\n\n    setLocalLoading(true);\n    try
      {\n      await dispatch(updateItemQuantity({ itemId, quantity: newQuantity })).unwrap();\n      trackEvent(''cart_item_quantity_updated'',
      { itemId, newQuantity });\n    } catch (error) {\n      toast.error(''Failed
      to update quantity'');\n      console.error(''Quantity update error:'', error);\n    }
      finally {\n      setLocalLoading(false);\n    }\n  }, [dispatch]);\n\n  const
      handleRemoveItem = useCallback(async (itemId) => {\n    setLocalLoading(true);\n    try
      {\n      await dispatch(removeItemFromCart(itemId)).unwrap();\n      toast.success(''Item
      removed from cart'');\n      trackEvent(''cart_item_removed'', { itemId });\n    }
      catch (error) {\n      toast.error(''Failed to remove item'');\n      console.error(''Remove
      item error:'', error);\n    } finally {\n      setLocalLoading(false);\n    }\n  },
      [dispatch]);\n\n  const handleClearCart = useCallback(async () => {\n    if
      (!window.confirm(''Are you sure you want to clear your cart?'')) {\n      return;\n    }\n\n    setLocalLoading(true);\n    try
      {\n      await dispatch(clearCart()).unwrap();\n      toast.success(''Cart cleared'');\n      trackEvent(''cart_cleared'');\n    }
      catch (error) {\n      toast.error(''Failed to clear cart'');\n      console.error(''Clear
      cart error:'', error);\n    } finally {\n      setLocalLoading(false);\n    }\n  },
      [dispatch]);\n\n  const handleCheckout = useCallback(async () => {\n    const
      errors = validateCartItems(items);\n    setValidationErrors(errors);\n\n    if
      (Object.keys(errors).length > 0) {\n      toast.error(''Please resolve cart
      issues before checkout'');\n      return;\n    }\n\n    if (!user) {\n      toast.error(''Please
      sign in to proceed with checkout'');\n      return;\n    }\n\n    setLocalLoading(true);\n    try
      {\n      const checkoutData = {\n        items: items.map(item => ({\n          productId:
