- request:
    body: '{"messages": [{"content": "You are a document relevance analyst for task
      completion assessment.\n\nTask: Evaluate if the provided documents contain sufficient
      information to successfully complete the specified task.\n\nContext: Consider
      both the breadth and depth of information needed. The documents should provide
      enough context, examples, and domain knowledge to execute the task effectively.\n\nOutput:
      \"sufficient\" if documents provide adequate context for task completion, \"insufficient\"
      if more information is needed\n\nRule: Focus on task completion capability rather
      than general document relevance.", "role": "system"}, {"content": "\n## Task
      Information\nTask Prompt: \nYou are an expert business analyst tasked with reconstructing
      essential user stories for a specific feature. Your goal is to identify only
      the PRIMARY, DIRECTLY RELATED user stories while maintaining strict feature
      boundaries.\n\nCore Analysis Framework:\n0. SOURCE PRIORITISATION:\n   - When
      both business-level artifacts (domain descriptions, feature descriptions, specifications,
      BA documentation, diagrams) and technical artifacts (code, schemas, logs, data
      models) are available in the retrieved context, always:\n     - Use business-level
      artifacts as the primary source of truth for user goals, actors, and business
      value.\n     - Use technical artifacts only as supporting evidence to confirm
      or refine the behavior implied by the business-level artifacts.\n   - If there
      is a conflict between a business document and technical implementation details,
      follow the business document for defining user stories, and treat technical
      details as implementation constraints that belong in justification, not in the
      user story description.\n\n1. PRIMARY OWNERSHIP VALIDATION:\n   - This feature
      belongs PRIMARILY to the target domain defined in context.\n   - Exclude any
      user stories that would be better suited for other FEATURES in the same domain
      (e.g., separate \"History\", \"View/Export\", \"Reporting\" features), even
      if the domain is the same.\n   - Exclude any user stories that would be better
      suited for other DOMAINS.\n   - Focus only on stories where this specific feature
      is the primary business owner of the user goal.\n\n2. BUSINESS OBJECT CENTRALITY:\n   -
      Identify the core business objects this feature manages.\n   - Generate stories
      around complete business object lifecycles and complete user workflows involving
      these objects.\n   - Avoid fragmenting one business goal into multiple stories
      by data slices if they are all part of ONE coherent snapshot or workflow.\n   -
      If multiple stories differ only by the type of data stored or retrieved but
      share the same actor, goal, and business value, MERGE them into a single user
      story.\n   - Do not create separate user stories for validation, eligibility,
      permissions, or errors if they happen within the same user interaction. Keep
      them as rules and behavior inside a single user story.\n\n3. USER STORY RECONSTRUCTION
      RULES:\n   - Each story must represent a complete, valuable user workflow, not
      a single technical step.\n   - Combine related CRUD operations into cohesive
      business capabilities (e.g., \"capture a complete historical snapshot for an
      algorithm run\", not separate stories for each table or entity involved).\n   -
      Ensure each story delivers standalone business value from the user''s perspective,
      not from the persistence layer perspective.\n   - Avoid atomic or purely technical
      operations as separate stories if they cannot provide independent user value
      without the rest of the workflow.    \n   - Do NOT create separate user stories
      that only describe:\n     - data validation within an operation,\n     - parsing,
      normalization, or transformation of input data that does not represent a distinct
      user goal,\n     - enforcement of business rules or eligibility,\n     - permission
      checks,\n     - error handling or surfacing inconsistencies,\n    when these
      behaviors occur inside the same user workflow (same screen / same operation).
      These aspects must be treated as part of one user story rather than separate
      stories.\n\n\n4. SCOPE BOUNDARIES:\n   - Stories must directly contribute to
      the feature''s PRIMARY purpose as described in the feature definition.\n   -
      If the feature describes CREATION / EXECUTION (e.g., \"Trigger Run\", \"Create
      Snapshots\"), do NOT add stories primarily about VIEWING, SEARCHING, or EXPORTING
      results or history. Treat viewing / export / reporting as separate features
      unless explicitly stated in the feature description.\n   - Exclude cross-cutting
      concerns (logging, security, monitoring, infrastructure) unless they are explicitly
      core to this feature.\n   - Maintain strict domain and feature boundaries: no
      stories that span multiple domains or clearly separate features.\n   - Each
      story should map to a distinct user goal that this feature alone is responsible
      for.\n\n## User Story Structure Requirements\nFor each user story, provide:\n-
      **name**: Clear, business-focused title that captures the user goal\n- **description**:
      As a [user type], I want [goal] so that [business value]\n\n  USER TYPE RULES:\n  -
      The [user type] MUST be a real business or technical role (e.g., product admin,
