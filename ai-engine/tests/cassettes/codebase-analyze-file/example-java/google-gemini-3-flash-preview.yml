      to return an instance of the JSON, not the schema itself\n"}, {"role": "user",
      "content": "File: example.java\nLanguage: Java\nFramework: Spring\n\npackage
      com.example.order;\n\nimport java.math.BigDecimal;\nimport java.time.LocalDateTime;\nimport
      java.util.ArrayList;\nimport java.util.List;\nimport java.util.UUID;\n\nimport
      org.springframework.beans.factory.annotation.Autowired;\nimport org.springframework.stereotype.Service;\nimport
      org.springframework.transaction.annotation.Transactional;\n\nimport com.example.inventory.InventoryService;\nimport
      com.example.payment.PaymentService;\nimport com.example.shipping.ShippingService;\n\n/**\n
      * Service for managing e-commerce orders including creation, validation, and
      fulfillment.\n */\n@Service\n@Transactional\npublic class OrderService {\n\n    @Autowired\n    private
      OrderRepository orderRepository;\n\n    @Autowired\n    private InventoryService
      inventoryService;\n\n    @Autowired\n    private PaymentService paymentService;\n\n    @Autowired\n    private
      ShippingService shippingService;\n\n    /**\n     * Creates a new order with
      validation and inventory checking.\n     */\n    public Order createOrder(CreateOrderRequest
      request) throws OrderException {\n        validateOrderRequest(request);\n\n        Order
      order = new Order();\n        order.setId(UUID.randomUUID().toString());\n        order.setCustomerId(request.getCustomerId());\n        order.setStatus(OrderStatus.PENDING);\n        order.setCreatedAt(LocalDateTime.now());\n        order.setItems(new
      ArrayList<>());\n\n        BigDecimal totalAmount = BigDecimal.ZERO;\n\n        for
      (OrderItemRequest itemRequest : request.getItems()) {\n            if (!inventoryService.isAvailable(itemRequest.getProductId(),
      itemRequest.getQuantity())) {\n                throw new OrderException(\"Insufficient
      inventory for product: \" + itemRequest.getProductId());\n            }\n\n            OrderItem
      item = new OrderItem();\n            item.setProductId(itemRequest.getProductId());\n            item.setQuantity(itemRequest.getQuantity());\n            item.setUnitPrice(itemRequest.getUnitPrice());\n            item.setTotalPrice(itemRequest.getUnitPrice().multiply(BigDecimal.valueOf(itemRequest.getQuantity())));\n\n            order.getItems().add(item);\n            totalAmount
      = totalAmount.add(item.getTotalPrice());\n        }\n\n        order.setTotalAmount(totalAmount);\n\n        Order
      savedOrder = orderRepository.save(order);\n\n        // Reserve inventory\n        for
      (OrderItem item : savedOrder.getItems()) {\n            inventoryService.reserveInventory(item.getProductId(),
      item.getQuantity());\n        }\n\n        return savedOrder;\n    }\n\n    /**\n     *
      Processes payment and updates order status.\n     */\n    public void processPayment(String
      orderId, PaymentRequest paymentRequest) throws OrderException {\n        Order
      order = findOrderById(orderId);\n\n        if (order.getStatus() != OrderStatus.PENDING)
      {\n            throw new OrderException(\"Order is not in pending status\");\n        }\n\n        try
      {\n            PaymentResult result = paymentService.processPayment(paymentRequest,
      order.getTotalAmount());\n\n            if (result.isSuccessful()) {\n                order.setStatus(OrderStatus.PAID);\n                order.setPaymentId(result.getPaymentId());\n                orderRepository.save(order);\n\n                initiateShipping(order);\n            }
      else {\n                order.setStatus(OrderStatus.PAYMENT_FAILED);\n                orderRepository.save(order);\n                releaseInventory(order);\n            }\n        }
      catch (Exception e) {\n            order.setStatus(OrderStatus.PAYMENT_FAILED);\n            orderRepository.save(order);\n            releaseInventory(order);\n            throw
      new OrderException(\"Payment processing failed\", e);\n        }\n    }\n\n    private
      void validateOrderRequest(CreateOrderRequest request) throws OrderException
      {\n        if (request.getCustomerId() == null || request.getCustomerId().trim().isEmpty())
      {\n            throw new OrderException(\"Customer ID is required\");\n        }\n\n        if
      (request.getItems() == null || request.getItems().isEmpty()) {\n            throw
      new OrderException(\"Order must contain at least one item\");\n        }\n    }\n\n    private
      Order findOrderById(String orderId) throws OrderException {\n        return
      orderRepository.findById(orderId)\n            .orElseThrow(() -> new OrderException(\"Order
      not found: \" + orderId));\n    }\n\n    private void initiateShipping(Order
      order) {\n        shippingService.createShippingLabel(order);\n        order.setStatus(OrderStatus.SHIPPED);\n        orderRepository.save(order);\n    }\n\n    private
      void releaseInventory(Order order) {\n        for (OrderItem item : order.getItems())
      {\n            inventoryService.releaseInventory(item.getProductId(), item.getQuantity());\n        }\n    }\n}\n\n\n===
      BUSINESS CONTEXT ===\nPrimary Responsibility: Manages the end-to-end e-commerce
      order lifecycle, including creation, inventory reservation, payment processing,
      and shipping initiation.\nBusiness Logic Factor: 0.9\n\n=== TECHNICAL CONTEXT
      ===\nCategories: Services, Workflows\nLanguage: Java\nFramework: Spring"}],
