      payment_method_id\n    )\n  end\n\n  def calculate_next_billing_date(plan)\n    case
      plan.billing_interval\n    when ''monthly''\n      1.month.from_now\n    when
      ''yearly''\n      1.year.from_now\n    when ''weekly''\n      1.week.from_now\n    else\n      raise
      ArgumentError, \"Unsupported billing interval: #{plan.billing_interval}\"\n    end\n  end\n\n  def
