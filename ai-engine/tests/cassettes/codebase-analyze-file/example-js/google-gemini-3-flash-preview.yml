      analyst analyzing code files. Your goal is to understand the business purpose
      and functional responsibilities of this file.\n\nAnalyze the provided file content
      and extract:\n\n1. **Primary Responsibility**: What is the main business function
      this file serves? (one sentence)\n\n2. **Business Logic Factor**: Rate how much
      business logic this file contains (0.0-1.0):\n   - **0.9-1.0**: Core business
      rules, domain logic, critical business processes\n     Examples: Order validation
      rules, pricing calculations, inventory management logic\n   - **0.7-0.8**: Business
      workflow orchestration, business features with user interaction\n     Examples:
      Checkout process, user registration flow, report generation orchestration\n   -
      **0.5-0.6**: Business data processing, business validation, business calculations\n     Examples:
      Data transformations for business metrics, notification triggers, business reporting\n   -
      **0.3-0.4**: Business data presentation, business configuration with business
      impact\n     Examples: Dashboard views, business email templates, feature flags
      affecting business flows\n   - **0.1-0.2**: Business utilities, business helpers,
      light business configuration\n     Examples: Business constants, formatting
      utilities for business data, business ID generators\n   - **0.0**: Pure technical
      infrastructure with no business value\n     Examples: Database connection pooling,
      logging configuration, build scripts, HTTP middleware\n\n3. **Functional Group
      Candidates**: What functional groups could this file belong to?\n\n   **Definition**:
      A Functional Group is the smallest cohesive unit of functionality serving a
      specific user goal.\n\n   **When to return empty list:**\n   - Infrastructure
      files (BL factor < 0.3): configs, middleware, utilities with no business logic\n   -
      Pure technical files: database connections, logging, build scripts, HTTP handlers\n   -
      No business entities or domain concepts present\n   - No business rules or constraints
      visible\n\n   **When to extract groups:**\n   - Business logic present (BL factor
      \u2265 0.3)\n   - Contains domain entities (Order, Customer, Product, Payment)\n   -
      Implements business rules or constraints\n   - Operations serve user goals (not
      just system maintenance like logging, caching, connection pooling)\n\n   **Validation
      Criteria** - Each group must:\n   - Serve a single user goal (describable in
      one sentence)\n   - Contain 2+ operations working toward the same user goal\n   -
      Have clear boundaries (functionality either belongs or doesn''t)\n   - Focus
      on business concepts (Order, Payment) not technical concepts (Connection, Thread)\n   -
      If removed, a specific user action becomes impossible\n\n   For each candidate
      provide:\n   - **name**: Descriptive name (e.g., \"Order Status Management\",
      \"Contact Information Entry\")\n   - **user_goal**: What user goal this serves
      (e.g., \"Update order status through workflow\", \"Capture customer contact
      details\")\n   - **operations**: Supported operations as list (e.g., [\"create\",
      \"validate\", \"save\"], [\"search\", \"filter\", \"sort\"])\n     Common: create,
      read, update, delete, search, filter, sort, validate, calculate, notify, approve,
      export, import\n   - **entities**: Key business entities as list (e.g., [\"Order\",
      \"Status\"], [\"Contact\", \"Email\", \"Phone\"])\n     Use business terminology
      visible in code - class names, model names, domain objects\n   - **business_rules**:
      Observable business rules as list (e.g., [\"Status transitions must be sequential\",
      \"Email validation required\"])\n     Only list rules visible in THIS file -
      no assumptions about external logic. Empty list is valid.\n   - **confidence**:
      Your confidence level (0.0 = unsure, 0.5 = moderate, 0.9 = very confident)\n   -
      **business_domain_hint**: Business domain (e.g., \"order_management\", \"contact_management\")
      or empty string if unclear\n\nFocus on observable functionality in this file.
      Extract semantic information (operations, entities, rules) to enable accurate
      cross-source clustering.\n\n**CRITICAL**: Output ONLY valid JSON in the exact
      schema format specified. No additional text, explanations, or excessive whitespace.\n\n\n        As
      a genius expert, your task is to understand the content and provide\n        the
      parsed objects in json that match the following json_schema:\n\n\n        {\n  \"$defs\":
      {\n    \"FunctionalGroupCandidate\": {\n      \"additionalProperties\": false,\n      \"description\":
      \"Per-file functional group candidate with semantic context for clustering.\",\n      \"properties\":
      {\n        \"name\": {\n          \"description\": \"Name of the functional
      group\",\n          \"title\": \"Name\",\n          \"type\": \"string\"\n        },\n        \"user_goal\":
      {\n          \"description\": \"User goal served by this group\",\n          \"title\":
      \"User Goal\",\n          \"type\": \"string\"\n        },\n        \"operations\":
      {\n          \"description\": \"Supported operations (e.g., create, read, update,
      delete, search, validate, calculate)\",\n          \"items\": {\n            \"type\":
      \"string\"\n          },\n          \"title\": \"Operations\",\n          \"type\":
      \"array\"\n        },\n        \"entities\": {\n          \"description\": \"Key
      business entities involved (e.g., Order, User, Payment, Contact)\",\n          \"items\":
      {\n            \"type\": \"string\"\n          },\n          \"title\": \"Entities\",\n          \"type\":
      \"array\"\n        },\n        \"business_rules\": {\n          \"description\":
      \"Observable business rules or constraints in THIS file only\",\n          \"items\":
      {\n            \"type\": \"string\"\n          },\n          \"title\": \"Business
      Rules\",\n          \"type\": \"array\"\n        },\n        \"confidence\":
      {\n          \"description\": \"Confidence score (0.0-1.0)\",\n          \"maximum\":
      1.0,\n          \"minimum\": 0.0,\n          \"title\": \"Confidence\",\n          \"type\":
      \"number\"\n        },\n        \"business_domain_hint\": {\n          \"description\":
      \"Hint for business domain (use empty string if unknown)\",\n          \"title\":
      \"Business Domain Hint\",\n          \"type\": \"string\"\n        }\n      },\n      \"required\":
      [\n        \"name\",\n        \"user_goal\",\n        \"operations\",\n        \"entities\",\n        \"business_rules\",\n        \"confidence\",\n        \"business_domain_hint\"\n      ],\n      \"title\":
      \"FunctionalGroupCandidate\",\n      \"type\": \"object\"\n    }\n  },\n  \"additionalProperties\":
      false,\n  \"description\": \"Result of business analysis for a code file.\",\n  \"properties\":
      {\n    \"business_logic_factor\": {\n      \"description\": \"Business logic
      factor (0.0-1.0)\",\n      \"maximum\": 1.0,\n      \"minimum\": 0.0,\n      \"title\":
      \"Business Logic Factor\",\n      \"type\": \"number\"\n    },\n    \"primary_responsibility\":
