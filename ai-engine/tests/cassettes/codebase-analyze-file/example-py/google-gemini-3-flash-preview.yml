      timedelta\n\nfrom models.session import UserSession\nfrom models.user import
      User\nfrom sqlalchemy.orm import Session\n\n\nclass AuthenticationService:\n    \"\"\"Handles
      user authentication and session management.\"\"\"\n\n    def __init__(self,
      db: Session):\n        self.db = db\n        self.session_timeout = timedelta(hours=24)\n\n    def
      authenticate_user(self, email: str, password: str) -> User | None:\n        \"\"\"Authenticate
      user with email and password.\"\"\"\n        user = self.db.query(User).filter(User.email
      == email).first()\n        if not user:\n            return None\n\n        if
      not self._verify_password(password, user.password_hash):\n            return
      None\n\n        # Update last login\n        user.last_login = datetime.utcnow()\n        self.db.commit()\n        return
      user\n\n    def create_session(self, user: User) -> str:\n        \"\"\"Create
      a new user session and return session token.\"\"\"\n        token = secrets.token_urlsafe(32)\n        session
      = UserSession(\n            token=token,\n            user_id=user.id,\n            expires_at=datetime.utcnow()
      + self.session_timeout,\n            created_at=datetime.utcnow(),\n        )\n\n        self.db.add(session)\n        self.db.commit()\n        return
      token\n\n    def validate_session(self, token: str) -> User | None:\n        \"\"\"Validate
