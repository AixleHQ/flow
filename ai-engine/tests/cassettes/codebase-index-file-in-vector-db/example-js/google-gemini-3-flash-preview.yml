      { itemId, newQuantity });\\n    } catch (error) {\\n      toast.error('Failed
      to update quantity');\\n      console.error('Quantity update error:', error);\\n
      \   } finally {\\n      setLocalLoading(false);\\n    }\\n  }, [dispatch]);\\n\\n
      \ const handleRemoveItem = useCallback(async (itemId) => {\\n    setLocalLoading(true);\\n
