      StandardError => e\n    Rails.logger.error \"Subscription creation failed: #{e.message}\"\n    error_result(\"Failed
      to create subscription: #{e.message}\")\n  end\n\n  # Cancels a subscription
      with optional immediate or end-of-period cancellation\n  def cancel_subscription(subscription,
      immediate: false)\n    return error_result(''Subscription not found'') unless
      subscription\n    return error_result(''Subscription already cancelled'') if
      subscription.cancelled?\n\n    ActiveRecord::Base.transaction do\n      if subscription.external_id.present?\n        cancellation_result
      = stripe_service.cancel_subscription(\n          subscription.external_id,\n          at_period_end:
      !immediate\n        )\n\n        return error_result(cancellation_result[:error])
      unless cancellation_result[:success]\n      end\n\n      cancellation_date =
      immediate ? Time.current : subscription.next_billing_date\n\n      subscription.update!(\n        status:
      ''cancelled'',\n        cancelled_at: cancellation_date,\n        cancellation_reason:
      ''user_requested''\n      )\n\n      revoke_plan_features(subscription.user,
      subscription.plan) if immediate\n\n      notification_service.send_cancellation_confirmation(subscription.user,
      subscription)\n    end\n\n    success_result(subscription)\n  rescue StandardError
      => e\n    Rails.logger.error \"Subscription cancellation failed: #{e.message}\"\n    error_result(\"Failed
      to cancel subscription: #{e.message}\")\n  end\n\n  # Processes subscription
      renewal and handles payment\n  def process_renewal(subscription)\n    return
      error_result(''Subscription not eligible for renewal'') unless subscription.renewable?\n\n    if
      subscription.plan.paid?\n      payment_result = stripe_service.process_subscription_payment(subscription.external_id)\n\n      unless
      payment_result[:success]\n        handle_payment_failure(subscription, payment_result[:error])\n        return
      error_result(\"Payment failed: #{payment_result[:error]}\")\n      end\n    end","workspace_id":1,"asset_id":1,"asset_type":"codebase","content_type":"code","vector_name":"semantic_description","token_count":489,"chunk_index":1,"total_chunks":4,"detected_language":"ruby"}},{"id":13194139533312,"vector":[0.03559826,0.019576704,-0.023821833,-0.032978676,-0.022465263,0.021237332,-0.0058385124,0.010624514,0.004704139,-0.017845908,0.07007384,-0.01913231,0.027669344,0.010355539,0.027108004,0.04394818,-0.027879847,0.035785373,-0.044345796,0.043269895,0.050754417,0.04750333,0.03704839,-0.054309566,-0.00458427,-0.014641597,0.010297066,0.027458843,0.016863564,-0.042123828,0.071290076,-0.0081686545,-0.03344646,-0.030359095,0.008794314,-0.03969136,-0.027856458,0.022441873,0.02199748,-0.014091953,-0.028675077,-0.04638065,0.05094153,0.03833479,0.022009173,0.05772438,-0.02940014,0.013437057,0.029283194,0.028721856,-0.02965742,-0.022336623,0.00837331,-0.018430637,0.021260722,0.006338455,0.016255448,-0.008659827,-0.02617244,0.018068105,0.03990186,-0.020009404,0.011706261,-0.020921579,-0.0001734085,0.0022219676,-0.025844991,0.034382027,0.014594818,-0.0077125668,0.015530384,0.029587254,0.035364367,-0.012290989,0.02565788,-0.014781932,0.024441645,0.039761525,-0.0041954257,0.03480303,0.014337539,0.0012608204,-0.04011236,0.0053473404,-0.049538184,-0.029119471,-0.09477276,-0.0139750065,-0.004250975,-0.03714194,0.004598888,0.022079341,-0.010595277,0.0061981203,0.0117822755,-0.015869526,-0.008917107,0.00035120244,0.0011738421,-0.020044487,0.013168082,-0.036487047,-0.01134373,-0.0447668,0.042685166,0.011109838,0.0050052744,0.05416923,-0.0067185285,0.0034732863,-0.07306765,0.07507911,0.012454714,-0.05613392,-0.017226096,-0.014629902,0.050380193,-0.00063662295,0.016395783,-0.020254988,-0.060905304,0.011489912,0.003458668,-0.021389361,0.03775006,-0.028698467,0.017097456,-0.030943822,-0.007893832,0.012372851,0.03346985,0.010150883,0.014396011,-0.0501463,0.01926095,-0.01401009,0.023365743,0