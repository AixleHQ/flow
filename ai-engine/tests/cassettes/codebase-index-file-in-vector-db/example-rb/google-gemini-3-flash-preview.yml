      subscription.plan.paid?\n      payment_result = stripe_service.process_subscription_payment(subscription.external_id)\n\n      unless
      payment_result[:success]\n        handle_payment_failure(subscription, payment_result[:error])\n        return
      error_result(\"Payment failed: #{payment_result[:error]}\")\n      end\n    end\n\n    subscription.update!(\n      next_billing_date:
      calculate_next_billing_date(subscription.plan),\n      last_billed_at: Time.current\n    )\n\n    create_subscription_usage_record(subscription)\n    notification_service.send_renewal_confirmation(subscription.user,
      subscription)\n\n    success_result(subscription)\n  end\n\n  private\n\n  def
      create_stripe_subscription(user, plan, payment_method_id)\n    stripe_service.create_subscription(\n      customer_id:
      user.stripe_customer_id,\n      price_id: plan.stripe_price_id,\n      payment_method_id:
      payment_method_id\n    )\n  end\n\n  def calculate_next_billing_date(plan)\n    case
      plan.billing_interval\n    when ''monthly''\n      1.month.from_now\n    when
      ''yearly''\n      1.year.from_now\n    when ''weekly''\n      1.week.from_now\n    else\n      raise
      ArgumentError, \"Unsupported billing interval: #{plan.billing_interval}\"\n    end\n  end\n\n  def
      grant_plan_features(user, plan)\n    plan.features.each do |feature|\n      user.feature_access.find_or_create_by(feature:
      feature) do |access|\n        access.granted_at = Time.current\n      end\n    end\n  end\n\n  def
      revoke_plan_features(user, plan)\n    plan.features.each do |feature|\n      user.feature_access.find_by(feature:
      feature)&.destroy\n    end\n  end\n\n  def create_subscription_usage_record(subscription)\n    SubscriptionUsage.create!(\n      subscription:
      subscription,\n      period_start: subscription.last_billed_at || subscription.started_at,\n      period_end:
      subscription.next_billing_date,\n      usage_data: {}\n    )\n  end\n\n  def
      handle_payment_failure(subscription, error_message)\n    subscription.update!(\n      status:
      ''past_due'',\n      last_payment_error: error_message\n    )","workspace_id":1,"asset_id":1,"asset_type":"codebase","content_type":"code","vector_name":"semantic_description","token_count":497,"chunk_index":2,"total_chunks":4,"detected_language":"ruby"}},{"id":6597069766656,"vector":[0.007926053,0.005116976,0.013674144,0.0024826925,-0.031209223,0.024291715,0.0068308846,0.010902191,0.047692444,-0.009943144,0.036629383,-0.043584015,-0.003356662,0.027125541,0.022621118,0.06271544,0.02040603,0.037000626,-0.024093717,0.08617804,0.028808514,0.04907842,0.059695993,0.00040295415,-0.0266553,-0.017720701,0.014688877,0.020480279,0.025145575,-0.035837393,0.070684806,-0.01106925,-0.02007191,-0.0066205133,-0.0044054254,0.015802609,-0.029699499,0.048360683,0.043732513,-0.02551682,-0.016792592,-0.059003003,0.044623498,0.025665317,-0.044796742,0.04915267,-0.007066006,0.0024625834,0.022188,-0.0015375678,-0.0106980065,0.0040898686,0.037470866,0.00077071745,-0.0018299222,-0.016470848,-0.008959348,-0.008192112,0.013030655,-0.008928412,-0.0005727208,-0.021099018,-0.008773726,-0.064942904,-0.0058501824,-0.042396035,-0.05039015,0.019737791,0.004891136,0.023536853,0.021631135,-0.006682387,0.059102003,-0.020084286,0.03135772,-0.009448153,0.04034182,0.03685213,0.03789161,-0.0024022562,0.028066026,0.009516214,-0.037718363,0.027917529,-0.062071953,-0.013562771,-0.12592587,0.02161876,0.0154437395,-0.031233972,-0.0037000626,0.044202752,-0.015171493,0.031827964,-0.012696535,-0.05207312,0.001648941,-0.027719531,0.01867356,-0.0034092548,-0.010487636,-0.03967358,0.031184474,-0.06939783,0.0090459725,0.03442667,-0.046454966,0.0097327735,-0.030689482,0.015641736,-0.07221928,0.05276611,-0.04375726,-0.048756678,-0.00753006,-0.020183284,0.051132638,-0.020084286,0.017114336,0.020034786,-0.06142846,0.03804011,0.007066006,-0.008940786,-0.0006110053,-0.014416631,0.02611081,0.00019345278,-0.004739545,-0.0031169006,0.0651904,0.020022413,0.006868009,-0.016309975,0.004968479,0.02598706,-0.010549509,-0.04098