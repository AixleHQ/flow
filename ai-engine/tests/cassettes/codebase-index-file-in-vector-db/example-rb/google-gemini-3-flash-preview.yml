      frozen_string_literal: true\n\n# Service for managing user subscriptions and
      billing in a SaaS application\nclass SubscriptionService\n  include Serviceable\n\n  attr_reader
      :stripe_service, :notification_service\n\n  def initialize(stripe_service: StripeService.new,
      notification_service: NotificationService.new)\n    @stripe_service = stripe_service\n    @notification_service
      = notification_service\n  end\n\n  # Creates a new subscription for a user with
      plan validation\n  def create_subscription(user, plan_id, payment_method_id
      = nil)\n    return error_result(''User already has active subscription'') if
      user.subscription&.active?\n\n    plan = SubscriptionPlan.find_by(id: plan_id)\n    return
      error_result(''Invalid subscription plan'') unless plan&.available?\n\n    subscription
      = nil\n\n    ActiveRecord::Base.transaction do\n      subscription = user.create_subscription!(\n        plan:
      plan,\n        status: ''pending'',\n        started_at: Time.current,\n        next_billing_date:
      calculate_next_billing_date(plan)\n      )\n\n      if plan.paid?\n        stripe_subscription
      = create_stripe_subscription(user, plan, payment_method_id)\n\n        if stripe_subscription[:success]\n          subscription.update!(\n            status:
      ''active'',\n            external_id: stripe_subscription[:subscription_id]\n          )\n\n          create_subscription_usage_record(subscription)\n          grant_plan_features(user,
      plan)\n\n          notification_service.send_subscription_confirmation(user,
      subscription)\n        else\n          raise ActiveRecord::Rollback, stripe_subscription[:error]\n        end\n      else\n        #
      Free plan\n        subscription.update!(status: ''active'')\n        grant_plan_features(user,
      plan)\n      end\n    end\n\n    success_result(subscription)\n  rescue StandardError
      => e\n    Rails.logger.error \"Subscription creation failed: #{e.message}\"\n    error_result(\"Failed
      to create subscription: #{e.message}\")\n  end","workspace_id":1,"asset_id":1,"asset_type":"codebase","content_type":"code","vector_name":"semantic_description","token_count":478,"chunk_index":0,"total_chunks":4,"detected_language":"ruby"}},{"id":26388279066624,"vector":[0.042595115,0.023597458,0.019807315,-0.005978571,-0.023339307,0.04559907,-0.026542742,0.023550523,0.031870063,-0.011370432,0.05153657,-0.0360005,-0.007609623,0.015336588,0.027528413,0.07908845,-0.03149457,0.045786817,-0.021942938,0.041867595,0.05576088,0.027974313,0.014221841,-0.02497036,-0.009041195,-0.029124264,0.015805956,0.0055414718,-0.014022359,-0.02773963,0.06604003,-0.016357463,-0.0702174,-0.029077327,0.024148967,-0.009228942,-0.031471103,0.008853448,0.015981968,-0.013459118,0.004335784,-0.04123395,0.042876735,0.035296448,0.0583424,0.04484808,-0.027246794,-0.020429228,0.029664036,0.004054163,-0.029194668,-0.022330167,0.017061515,-0.010026867,-0.029405884,-0.0112002855,0.0070053125,0.014914158,-0.025768286,-0.0028367408,0.006987711,-0.014562132,-0.00022331634,-0.01632226,0.004456059,0.009264144,-0.03719739,0.0034175834,0.0048374203,-0.01062531,-0.0017410606,0.03130682,0.0551507,0.009663107,0.028279401,-0.022869939,0.040342152,0.06481967,0.0001056994,0.0010084071,0.029288542,0.010308487,-0.016885502,0.02670702,-0.0044883285,0.0057908236,-0.10260377,0.0051865126,-0.00337358,-0.03923914,-0.012297433,0.029640568,0.004963563,0.034334246,0.03020381,-0.057732224,-0.016615616,-0.008178731,-0.01056664,0.0038312136,-0.0038722833,-0.030813986,-0.024618333,-0.04268899,0.032597583,-0.022447508,-0.016885502,0.053930346,-0.005397728,-0.005708684,-0.036023967,0.06866849,-0.014257043,-0.04280633,-0.0101266075,-0.026824363,0.032245558,-0.01785944,-0.006318862,-0.018645631,-0.06599309,0.020229746,0.003024488,-0.047805097,0.03468627,-0.010109006,0.013412181,-0.00080892583,0.0039749574,0.007040515,0.07082758,0.04834487,-0.010419962,-0.045481727,-0.009228942,0.0059140325,0.0021781593,-0.034005687,-0.03226902