- request:
    body: '{"messages": [{"content": "You are a Domain-Specific Feature Reconstructor.\nYour
      task is to rebuild business-level features that are PRIMARY and UNIQUE to the
      specified domain based on the provided context (code, descriptions, rules).\nYour
      output must describe what the domain does from a business perspective, not how
      it is implemented.\n\n## 0. Domain Scope and Ownership (CRITICAL)\nThe domain
      name and domain description are the PRIMARY source of truth and define the scope
      for all features.\n- Treat domain name + description as the boundary for what
      this domain can own.\n- Retrieved context (code, queries, models, etc.) is only
      supplemental: it may add details and evidence but MUST NOT expand or change
      the domain\u2019s purpose.\n- A capability can be a feature only if a stakeholder
      would reasonably expect it to belong to this domain based solely on its name
      and description.\n- Include only capabilities where this domain has primary
      ownership. If this domain merely calls or triggers functionality that conceptually
      belongs to another domain, do NOT treat that as a feature here.\n- Do NOT create
      features that clearly belong to another business area, extend the domain beyond
      its description, or introduce a new top-level business concept (the main noun)
      that is not present or clearly implied in the domain name/description.\n- When
      in doubt, exclude the capability.\n\n## 1. Feature Naming Convention\nUse natural,
      human-readable names as a business analyst would:\n- Verb + object, 2\u20134
      words (e.g., \"Create Booking\", \"Update User Profile\").\n- Avoid technical
      or engine-like names (e.g., \u274c \"BookingEngine\", \u2705 \"Manage Bookings\").\n-
      No camelCase, no underscores, no internal class or method names.\n- Names must
      sound natural when spoken to business stakeholders.\n- Main business nouns must
      align with the domain name/description (or obvious synonyms), not with incidental
      code-level terms.\n\n## 2. What Counts as a Feature\nA capability is a Feature
      ONLY if ALL of the following are true:\n1. **Business-recognizable**  \n   Stakeholders
      would mention it when describing what this domain does.\n2. **Domain-owned**  \n   This
      domain has primary responsibility for it, within the scope of its name and description.\n3.
      **Independently valuable**  \n   It can be delivered on its own and still provide
      business value.\n4. **Outcome-focused**  \n   It changes business outcomes (coverage,
      throughput, quality, compliance, prioritization, user experience), not just
      intermediate state.\nIf any of these conditions fail, do NOT return it as a
      feature.\nFeature definitions MUST be expressed in terms of business capabilities
      and business entities, not technical mechanisms. If a candidate capability primarily
      describes data preparation, metadata enrichment, job scheduling, orchestration,
      or similar implementation mechanics, treat it as an internal detail inside other
      features, not as a separate feature.\nIf the proposed feature name or description
      centers on verbs such as \"attach\", \"enrich\", \"map\", \"join\", \"merge\",
      \"transform\", \"convert\", \"link\", \"lookup\", or other verbs that primarily
      describe data or metadata handling, you MUST treat it as implementation detail
      and MUST NOT return it as a feature.\n\n\n## 3. What is NOT a Feature (Anti-Features)\nYou
      MUST NOT create features for:\n- Low-level operations (sorting, filtering, loops,
      numeric calculations).\n- Technical constraints or numeric thresholds.\n- Helper
      or utility logic (parsing, cleaning data, generic validation).\n- Data preparation
      and model-internal processing (feature engineering, data transformations, joins/merges,
      mapping IDs or abbreviations to names, format or schema conversions).\n- Configuration
      flags, toggles, switches.\n- Step-by-step algorithm logic.\n- Internal state
      bookkeeping (e.g., protected/excluded sets, slot counters, availability matrices,
      free-slot counts).\n- Internal data structures (indexes, maps/dicts, lookup
      tables, registries, caches, similar storage constructs).\n- \u201cAlready assigned\u201d
      / \u201cskip if used\u201d / \u201cmark as consumed\u201d style logic.\n- User
      stories, scenarios, or detailed workflows.\nAll of the above, including data
      preparation and model-internal processing, are implementation details inside
      a feature, never separate features.\n\n## 4. Constraints and Rule Systems\n-
      Constraints and individual rules are NOT standalone features; they belong inside
      features that use them.\n- Do NOT create separate features for isolated constraints.\nException:
      if multiple constraints clearly form a cohesive, configurable ruleset that stakeholders
      perceive as a single capability, you may create ONE feature representing that
      ruleset (e.g., \"Enforce Provider Qualification Rules\"). \nDo not split such
      a ruleset into multiple micro-features.\n\n\n## 5. Analysis Process\nFollow
      this process internally before producing the final JSON:\n1. **Understand domain
      scope** from the domain name and description.\n2. **Identify candidate capabilities**
      from the context (domain-specific operations, decisions, rule systems, workflows).\n3.
      **Filter out Anti-Features** using Section 3, including isolated constraints
      or rules that do not form a cohesive ruleset.\n4. **Apply domain scope and ownership**:
      remove any candidate that does not clearly belong to this domain or is not primarily
      owned by it.\n5. **Validate against the Feature criteria** from Section 2 and
      keep only capabilities that satisfy all of them.\n\n## 6. Output Requirements\nReturn
      the structured response strictly as a valid JSON object with exactly the following
      field:\n- **features**: a list of FeatureItem objects.  \n  Each FeatureItem
      must have:\n  - **name**: short, descriptive business name (2\u20134 words).\n  -
      **description**: business-level explanation of what the feature does.\n  - **justification**:
      evidence-based justification tied to the domain context (why this capability
      exists, what value it provides, why it is domain-owned).\n  - **technical_description**:
      brief note listing the key technical artifacts (models, classes, functions,
      tables, endpoints, events) that implement this feature, using their exact names
      from the retrieved context only.\n\nDO NOT include:\n- Code, classes, dataclasses,
      Markdown, or any other formatting.\n- Any extra top-level fields.\n- Any explanation
      outside the JSON object.\n- Triple backticks ``` or quoting around the JSON.\n\nThe
      output must be directly parseable by json.loads() with no cleanup.\n", "role":
      "system"}, {"content": "\n## Human Instructions\n\nAnalyze the following domain
      context and extract features strictly following ALL instructions in the System
      message.\n\nDomain Name: User Authentication\nDomain Description: Manages user
      accounts, authentication, authorization, and session management\nDomain Justification:
      Justification for User Authentication\n\n\n## Retrieved Context\n\n--- Document
      1 ---\nUser Authentication Domain Overview:\n\nThe User Authentication domain
      handles all aspects of user identity management including registration, login,
      password management, multi-factor authentication, and session handling. This
      domain ensures secure access to the system and manages user credentials.\n\n\n---
      Document 2 ---\nAuthentication Technical Specifications:\n\n- OAuth 2.0 and
      OpenID Connect integration\n- JWT token generation and validation\n- Password
      hashing using bcrypt\n- Session management with Redis\n- Rate limiting for login
      attempts\n- Account lockout mechanisms\n- Password reset workflows\n\n\n---
      Document 3 ---\nAuthentication Features and Requirements:\n\n- User registration
      with email verification\n- Login with username/password or social providers\n-
      Password strength validation\n- Two-factor authentication (2FA)\n- Password
      reset via email\n- Session timeout and refresh\n- Role-based access control
      (RBAC)\n- Account management (profile updates, deletion)\n\n## Execute Task\nReturn
      ONLY the JSON response exactly as specified in the Output Requirements. \nDo
      not include explanations or extra text.\n", "role": "user"}], "model": "google/gemini-3-flash-preview",
      "reasoning_effort": "low", "response_format": {"type": "json_schema", "json_schema":
      {"schema": {"$defs": {"FeatureItem": {"additionalProperties": false, "properties":
      {"name": {"description": "A short, descriptive name for the feature.", "title":
      "Name", "type": "string"}, "description": {"description": "A detailed explanation
      of what the feature does.", "title": "Description", "type": "string"}, "justification":
      {"description": "Evidence-based justification for this feature tied to domain
      context.", "title": "Justification", "type": "string"}, "technical_description":
      {"description": "A detailed technical description of the feature.", "title":
      "Technical Description", "type": "string"}}, "required": ["name", "description",
      "justification", "technical_description"], "title": "FeatureItem", "type": "object"}},
      "additionalProperties": false, "properties": {"features": {"description": "A
      list of features extracted from the context.", "items": {"$ref": "#/$defs/FeatureItem"},
      "title": "Features", "type": "array"}}, "required": ["features"], "title": "FeatureExtractionResult",
      "type": "object"}, "name": "FeatureExtractionResult", "strict": true}}, "stream":
