- request:
    body: '{"messages": [{"content": [{"type": "text", "text": "You are a **UI Functional
      Groups Quality Reviewer** evaluating whether the analysis correctly follows
      our two-level approach for UI documentation.\n\n**VALIDATION CRITERIA:**\n\n**Level
      1: Layout Zones Coverage**\n- Are all major structural areas identified?\n-
      Does each zone description match what''s actually visible?\n- Are zone purposes
      accurately described based on observable elements?\n\n**Level 2: Functional
      Groups Structure**\n- Are functional groups properly identified?\n- Do groups
      follow observable UI patterns?\n- Are elements grouped by actual visual organization,
      not assumptions?\n\n**Accuracy Validation:**\n- Do all quoted text and labels
      match the screenshot exactly?\n- Are described elements actually visible in
      the image?\n- No fabricated or assumed elements?\n\n**Completeness Check:**\n-
      All visible interactive elements documented individually?\n- No vague descriptions
      like \"various buttons\"?\n- All UI regions covered?\n\n**Response Format:**\n\n**If
      the analysis is accurate and complete, respond with exactly:** \"APPROVED\"\n\n**If
      significant issues are found, respond with:** \"NEEDS IMPROVEMENT:\" followed
      by specific corrections:\n- MISSING ZONES: [Layout zones not identified]\n-
      MISSING GROUPS: [Functional groups not identified]\n- MISSING ELEMENTS: [Specific
      overlooked elements with exact visible text]\n- HALLUCINATED: [Fabricated elements
      not visible]\n\n**CRITICAL DECISION RULE:**\n- If ALL categories would be empty
      or \"None\" \u2192 respond \"APPROVED\"\n- Only use \"NEEDS IMPROVEMENT\" if
      you have specific, actionable corrections\n- Do NOT use \"NEEDS IMPROVEMENT\"
      format when there are no actual issues\n\n**EXAMPLES:**\n\n*Good analysis (accurate
      and complete):*\n```\nAPPROVED\n```\n\n*Analysis with actual issues:*\n```\nNEEDS
      IMPROVEMENT:\n- MISSING ZONES: None\n- MISSING GROUPS: None\n- MISSING ELEMENTS:
      \"Save Changes\" button in action area, \"Cancel\" button next to Save\n- HALLUCINATED:
      None\n```\n\n**IMPORTANT**: Only flag MAJOR issues. Minor text variations or
      descriptive differences are acceptable. Focus on structural completeness and
      preventing fabricated content.\n\nAnalysis to evaluate:\n```markdown\n# UI Functional
      Groups Analysis\n\n## Screenshot Context\n- **Screen/Page**: Projects / Test
      project / List\n- **Domain Context**: Project management and issue tracking
      (Jira Software)\n\n---\n\n## Level 1: Layout Zones\n\n### Global Navigation
      Bar\n- **Visible Elements**: Jira logo, \"Your work\" dropdown, \"Projects\"
      dropdown, \"Filters\" dropdown, \"Dashboards\" dropdown, \"Plans\" dropdown,
      \"Apps\" dropdown, \"Create\" button, Search input, \"Premium trial\" button,
      \"Ask Rovo\" button, Notification icon, Help icon, Settings icon, User Profile
      icon.\n- **Observable Function**: Provides global access to system-wide entities,
      search, and administrative settings.\n- **Location**: Top horizontal bar spanning
      the width of the browser.\n\n### Sidebar Navigation\n- **Visible Elements**:
      \"For you\", \"Recent\", \"Starred\", \"Projects\" (with \"Test project\" and
      \"My Kanban Project\"), \"Filters\" (with \"My open work items\", \"Reported
      by me\", etc.), \"Dashboards\", \"Confluence\".\n- **Observable Function**:
      Enables switching between different views, projects, and filtered lists of work
      items.\n- **Location**: Left-hand vertical panel.\n\n### Project Header & View
      Selector\n- **Visible Elements**: Project icon (yellow emoji), \"Test project\"
      title, Breadcrumbs (\"Projects\"), Share icon, Star icon, Fullscreen icon, View
      tabs (\"Summary\", \"Timeline\", \"Board\", \"Calendar\", \"List\", \"Forms\",
      \"Goals\", \"All work\", \"Code\", \"Archived work items\", \"Pages\", \"Shortcuts\").\n-
      **Observable Function**: Identifies the current project context and allows the
      user to toggle between different data visualizations/modules.\n- **Location**:
      Top of the main content area, below the global navigation.\n\n### Main Content
      Area (Data Grid)\n- **Visible Elements**: Search list input, \"Filter\" dropdown,
      \"Group\" dropdown, View settings icons, and a multi-column table containing
      issue data.\n- **Observable Function**: Displays the primary dataset (issues/tasks)
      in a structured list format for viewing and editing.\n- **Location**: Center-right,
      occupying the majority of the screen real estate.\n\n---\n\n## Level 2: Functional
      Groups\n\n### List Control Toolbar\n- **UI Elements**: \"Search list\" text
      input with magnifying glass, \"Filter\" dropdown button, \"Group\" dropdown
      button, \"View settings\" (horizontal lines icon), \"Bulk change\" (three dots
      icon).\n- **Observable Pattern**: A horizontal row of interactive controls located
      directly above the data table.\n- **User Interaction**: Allows users to narrow
      down, organize, or modify the display parameters of the list below.\n- **Context**:
      Acts as the interface between the raw data and the user''s specific viewing
      requirements.\n\n### Issue Data Grid (Table)\n- **UI Elements**: \n    - **Headers**:
      Checkbox (select all), \"Type\", \"Key\", \"Summary\", \"Status\", \"Comments\",
      \"Assignee\", \"Due date\", \"Labels\", \"Created\", \"+\" (add column).\n    -
      **Row Data**: Issue icons (lightning bolts, checkboxes), Keys (e.g., \"PTP-3623\"),
      Summaries (e.g., \"Time Tracking\"), Status badges (\"TO DO\"), \"Add comment\"
      buttons, Date pickers (\"13 Oct 2025\").\n- **Observable Pattern**: A structured
      grid with fixed headers and repeating rows of data fields.\n- **User Interaction**:
      Enables reading issue details, clicking \"Key\" links for drill-down, and inline
      editing (e.g., clicking \"Add comment\" or the date field).\n- **Context**:
      The primary workspace for managing individual tasks within the \"Test project\".\n\n###
      Inline Creation Row\n- **UI Elements**: \"+ Create\" text with a plus icon.\n-
      **Observable Pattern**: A single interactive row located at the very bottom
      of the data grid.\n- **User Interaction**: Provides a quick-entry point to add
      a new record directly to the bottom of the current list.\n- **Context**: Simplifies
      the data entry workflow by keeping the \"Create\" action in line with the data
      being viewed.\n\n### Filter Sidebar Group\n- **UI Elements**: \"Default filters\"
      header, list items including \"My open work items\", \"Reported by me\", \"All
      work items\", \"Open work items\", \"Done work items\", \"Viewed recently\",
      \"Created recently\", \"Resolved recently\", \"Updated recently\", and \"View
      all filters\" link.\n- **Observable Pattern**: A vertically stacked list of
      text links under a common category header.\n- **User Interaction**: Allows for
      one-click execution of complex queries to update the Main Content Area.\n- **Context**:
      Provides quick access to common segments of the project''s data.\n```"}, {"type":
