- request:
    body: '{"messages": [{"content": [{"type": "text", "text": "You are a **Business
      Systems Analyst** specializing in precise UI documentation for legacy system
      analysis. Your expertise lies in accurately describing visible UI elements and
      organizing them into logical functional groups based on observable patterns
      and user workflows.\n\n## Your Task\nAnalyze the screenshot to extract **UI
      Functional Groups** using a **two-level hierarchical approach**: first identify
      structural layout zones, then identify functional groups based on observable
      UI patterns.\n\n**CRITICAL**: Only describe elements you can actually see in
      the screenshot. Do not infer or assume elements based on typical application
      patterns or speculate about underlying code structure.\n\n## Screenshot Context\n**Screenshot
      Name**: \"example-image.png\"\n\nUse screenshot name for general domain context
      only. Do not assume specific UI elements exist based on the filename.\n\n##
      Analysis Process\n\n### Step 1: Layout Zone Identification (Level 1)\nIdentify
      major structural areas that are actually present and visible:\n- **Status/Info
      Bars**: Read-only context display (plan IDs, user info, database name)\n- **Menu/Tab
      Bars**: Navigation elements (File, Edit, Plan Info-1, Fees...)\n- **Sidebar
      Navigation**: Page/section switching controls\n- **Main Content Area**: Primary
      form and data display area\n- **Action Areas**: Command controls (Save/Cancel
      buttons, toolbars)\n\n### Step 2: Functional Groups (Level 2)\nWithin Main Content
      Area, identify clusters based on **observable UI patterns**:\n\n1. **Form Sections**:
      Fields grouped under visible section headers or containers\n2. **Related Controls**:
      Interactive elements that work together for one task\n3. **Data Display Patterns**:
      Information grouped by visual organization or labels\n4. **Navigation Groups**:
      Lists or trees that control what is displayed\n5. **Action Sets**: Buttons or
      controls that perform related operations\n\n### Step 3: Accuracy Validation\nFor
      each group verify: Are all described elements clearly visible and accurately
      labeled from the screenshot?\n\n## Examplesnterprise Applications\n\n**Layout
      Zones:**\n- **Application Menu**: \"File\", \"Edit\", \"View\" menu bar items\n-
      **Status Display**: \"Plan: 819963 REG PRT FULL\" + \"Current User: RPTST01\"\n-
      **Section Navigation**: \"1 \u2014 Contract Details\", \"2 \u2014 Plan Details\",
      \"3 \u2014 Vesting\"\n- **Form Content**: Address fields, contact information,
      configuration options\n- **Action Controls**: \"Next\", \"Save\", \"Cancel\"
      buttons\n\n**Functional Groups:**\n- **Address Information Section**: Standard
      address collection fields\n  - *Visible Elements*: \"Address Line 1\", \"City\",
      \"State\", \"Zip Code\" fields with labels\n  - *Observable Pattern*: Geographic
      data entry grouped in sequence\n\n- **Contact Details Group**: Communication
      information cluster\n  - *Visible Elements*: \"Phone\", \"Fax\", \"Email\" fields
      with consistent labeling\n  - *Observable Pattern*: Contact methods grouped
      together with similar formatting\n\n## Core Principles\n1. **Accuracy First**:
      Describe only what is clearly visible and readable\n2. **Observable Patterns**:
      Group by visible UI organization, not assumed function\n3. **Precise Documentation**:
      Quote exact labels and text as they appear\n4. **Functional Relevance**: Organize
      groups that users would recognize as related\n\n## Priority When Conflicts Arise\n1.
      Visual accuracy over assumed functionality\n2. Observable patterns over inferred
      relationships\n3. Precise description over comprehensive coverage\n\n## Output
      Format\n\n```markdown\n# UI Functional Groups Analysis\n\n## Screenshot Context\n-
      **Screen/Page**: [Only if clearly visible in headings/breadcrumbs, otherwise
      state \"Not explicitly visible\"]\n- **Domain Context**: [Based on visible terminology
      and UI patterns]\n\n---\n\n## Level 1: Layout Zones\n\n### [Zone Name]\n- **Visible
      Elements**: [Key UI components with exact text/labels as shown]\n- **Observable
      Function**: [What this zone appears to accomplish based on visible elements]\n-
      **Location**: [Where this zone appears in the interface]\n\n*(Repeat for each
      layout zone)*\n\n---\n\n## Level 2: Functional Groups\n*(Within Main Content
      Area)*\n\n### [Group Name]\n- **UI Elements**: [All visible components with
      exact labels and current values]\n- **Observable Pattern**: [How these elements
      are visually organized or function together]\n- **User Interaction**: [What
      actions these elements enable based on their type and arrangement]\n- **Context**:
      [How this group relates to the overall screen purpose]\n\n*(Repeat for each
      functional group)*\n```\n\n---\n\n**CRITICAL**: Base analysis entirely on what
      is visually present in the screenshot. Describe elements precisely as they appear,
      then organize by observable UI patterns."}, {"type": "image_url", "image_url":
      {"url": "data:image/png;base64,"}}],
      "role": "user"}], "model": "google/gemini-3-flash-preview", "stream": false,
      "temperature": 0.1, "usage": {"include": true}, "max_tokens": 4000}'
