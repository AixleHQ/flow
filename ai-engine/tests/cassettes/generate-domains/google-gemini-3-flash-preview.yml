- request:
    body: '{"messages": [{"role": "system", "content": "\nYou are an expert business
      analyst and software architect.\n\nFor the description write as if you are explaining
      this domain to a non-technical executive in a business slide deck: only what
      it does for the business and why it matters, \nwith zero implementation, data,
      or algorithm details.\n\nYou are given a multiple clusters of closely related
      functional groups from an existing codebase.\nEach functional group describes:\n-
      `name`,\n- `business_domain_hint`,\n- involved `entities`,\n- `user_goal`,\n-
      `business_rules`.\n\nYour task is to describe exactly one BUSINESS DOMAIN that
      corresponds to this cluster.\n\nSTRICT RULES:\n0. Multi-cluster consistency\n   -
      Treat each cluster as a separate candidate domain, but assume all clusters belong
      to the same system.\n   - You MUST ensure that the domain names and descriptions
      across clusters are:\n     - mutually consistent,\n     - non-overlapping (no
      two domains should describe the same primary responsibility),\n     - and clearly
      differentiated when they are neighboring concerns.\n   - If two clusters relate
      to the same area, reflect the difference in their domain names and descriptions,
      so it is clear which domain owns which part of the business process.\n\n1. Scope
      and non-invention\n   - You MUST NOT invent new domains or features outside
      this clusters.\n   - For each cluster, you must output exactly one domain.\n   -
      You MUST describe only business capabilities that are explicitly present or
      clearly implied:\n     - Use ONLY `user_goal`, `entities`, `operations`, and
      `business_rules` as evidence.\n     - You may paraphrase and generalize them
      into higher-level business outcomes,\n       but do NOT introduce completely
      new actors or processes that are not implied by the data.\n     - Do NOT mention
      responsibilities like \"master data management\", \"credentialing\", etc., unless
      they clearly appear in the input.\n\n2. Domain name (business-friendly)\n   -
      MUST be 2\u20133 words.\n   - MUST be understandable to business stakeholders
      (e.g., operations managers, scheduling leads).\n   - MUST reflect the common
      meaning of the `business_domain_hint` values and `user_goal` texts.\n   - MUST
      AVOID technical/implementation terms such as:\n     - \"Engine\", \"Processor\",
      \"Service Layer\", \"API\", \"Database\", \"Module\", \"Pipeline\", \"Adapter\",
      \"Microservice\".\n   - MUST NOT include code-like tokens (snake_case, CamelCase,
      namespaces, file paths).\n   - The name MUST reflect the primary business responsibility
      and level of decision-making of this domain\n     (e.g., planning, orchestration,
      execution, configuration), not just a vague phase label.\n\n3. Domain description
      (business-facing ONLY)\n   - 2\u20134 sentences.\n   - You MUST Use plain business
      language.\n   - Focus on:\n     - what this domain is responsible for,\n     -
      what business goals it supports,\n     - what decisions or workflows it enables,\n     -
      what business outcomes it protects or optimizes (e.g., compliance, fairness,
      timeliness).\n   - When several domains touch related topics (e.g., demand planning
      vs capacity planning vs scheduling),\n     clearly describe each domain\u2019s
      main responsibility and avoid duplicating responsibilities already owned by
      another domain. \n\n   - You MUST NOT:\n     - Mention frameworks, storage,
      queues, file paths, or infrastructure.\n     - Mention internal function/class/method
      names, table names, or field names.\n     - Use algorithmic jargon (\u201coptimization
      algorithm\u201d, \u201cscoring model\u201d, \u201cfeature engineering\u201d,
      etc.).\n     - You MUST NOT use data-engineering or ML jargon in the description,
      such as:\n       - \"features\", \"feature engineering\", \"aggregations\",
      \"metadata\",\n       - \"downstream consumers\", \"entities\", \"cleansed data\",
      \"pipelines\". \n       Instead, describe these aspects in plain business terms
      like \"historical data\", \"prepared information\", \"usable reports\".\n     -
      Refer to low-level configuration details:\n       - specific numeric thresholds,\n       -
      internal flag/field names,\n       - exact attribute names that only make sense
      in the code.\n     - Refer to \u201cclusters\u201d, \u201cfunctional groups\u201d,
      or \u201ccodebase\u201d in the description.\n\n    - If you are tempted to mention
      how data is transformed (e.g. merged, aggregated, cleaned, engineered),\n      move
      that detail to the justification and only describe the business effect in the
      description.\n\n\n4. Justification (evidence-focused, technical details allowed)\n   -
      1\u20133 sentences.\n   - MUST:\n     - reference at least 2\u20133 concrete
      functional group `name` values from the cluster, and\n     - explain why they
      belong to the same business domain.\n   - SHOULD:\n     - highlight the common
      business purpose that unifies these groups,\n     - optionally contrast this
      domain with neighboring concerns (e.g., \u201coperational execution vs long-term
      planning\u201d) if this is clearly implied.\n   - Here you ARE allowed to:\n     -
      mention more specific rules or behaviours from `business_rules` as evidence,\n     -
      mention internal terminology like function names, entity names, or field names,\n       but
      ONLY as supporting evidence for the business-level boundary.\n   - You still
      MUST NOT invent capabilities that are not supported by the input.\n\n## Output
      Requirements:\n\nFor each identified domain, provide:\n- \"name\": Clear, business-focused
      domain name (2\u20133 words max).\n- \"description\": Business-oriented description
      of the domain\u2019s responsibilities (no technical jargon).\n- \"justification\":
      Explanation of why these functional groups form a logical business boundary,
      with explicit references to input evidence.\n\n\n\n        As a genius expert,
      your task is to understand the content and provide\n        the parsed objects
      in json that match the following json_schema:\n\n\n        {\n  \"$defs\": {\n    \"Domain\":
      {\n      \"additionalProperties\": false,\n      \"properties\": {\n        \"name\":
      {\n          \"description\": \"Clear, business-focused domain name\",\n          \"title\":
      \"Name\",\n          \"type\": \"string\"\n        },\n        \"description\":
      {\n          \"description\": \"Specific business capabilities and responsibilities\",\n          \"title\":
      \"Description\",\n          \"type\": \"string\"\n        },\n        \"justification\":
      {\n          \"description\": \"Why this forms a logical business boundary\",\n          \"title\":
      \"Justification\",\n          \"type\": \"string\"\n        }\n      },\n      \"required\":
      [\n        \"name\",\n        \"description\",\n        \"justification\"\n      ],\n      \"title\":
      \"Domain\",\n      \"type\": \"object\"\n    }\n  },\n  \"additionalProperties\":
      false,\n  \"properties\": {\n    \"domains\": {\n      \"description\": \"List
      of identified business domains\",\n      \"items\": {\n        \"$ref\": \"#/$defs/Domain\"\n      },\n      \"title\":
      \"Domains\",\n      \"type\": \"array\"\n    }\n  },\n  \"required\": [\n    \"domains\"\n  ],\n  \"title\":
      \"DomainExtractionResult\",\n  \"type\": \"object\"\n}\n\n        Make sure
      to return an instance of the JSON, not the schema itself\n"}, {"role": "user",
      "content": "\nHere are the clusters you need to describe.\n\nEach item in the
      list is ONE cluster. For each cluster, you must produce ONE domain object in
      the same order:\n\n[[{''name'': ''Authentication'', ''business_domain_hint'':
      ''User authentication and management'', ''entities'': [''User'', ''Session'',
      ''Token''], ''user_goal'': ''Authenticate users and manage sessions'', ''business_rules'':
      [''Password must be hashed'', ''Session expires after 30 minutes'']}], [{''name'':
      ''Billing'', ''business_domain_hint'': ''Payment processing and billing'', ''entities'':
      [''Payment'', ''Invoice'', ''Transaction''], ''user_goal'': ''Process payments
      and generate invoices'', ''business_rules'': [''Payment must be verified'',
      ''Refunds processed within 7 days'']}]]\n\n"}], "model": "google/gemini-3-flash-preview",
      "parallel_tool_calls": false, "response_format": {"type": "json_object"}, "temperature":
      0.1, "usage": {"include": true}, "max_tokens": 8000, "reasoning": {"effort":
      "low", "exclude": true}}'
