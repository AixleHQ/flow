- request:
    body: '{"input": ["# UI Functional Groups Analysis ## Screenshot Context - **Screen/Page**:
      Projects / Test project / List - **Domain Context**: Project management and
      issue tracking (Jira Software) ---", "## Level 1: Layout Zones ### Global Navigation
      Bar - **Visible Elements**: Jira logo, \"Your work\" dropdown, \"Projects\"
      dropdown, \"Filters\" dropdown, \"Dashboards\" dropdown, \"Plans\" dropdown,
      \"Apps\" dropdown, \"Create\" button, Search input, \"Premium trial\" button,
      \"Ask Rovo\" button, Notification icon, Help icon, Settings icon, User Profile
      icon. - **Observable Function**: Provides global access to system-wide entities,
      search, and administrative settings. - **Location**: Top horizontal bar spanning
      the width of the browser.", "### Sidebar Navigation - **Visible Elements**:
      \"For you\", \"Recent\", \"Starred\", \"Projects\" (with \"Test project\" and
      \"My Kanban Project\"), \"Filters\" (with \"My open work items\", \"Reported
      by me\", etc.), \"Dashboards\", \"Confluence\". - **Observable Function**: Enables
      switching between different views, projects, and filtered lists of work items.
      - **Location**: Left-hand vertical panel.", "### Project Header & View Selector
      - **Visible Elements**: Project icon (yellow emoji), \"Test project\" title,
      Breadcrumbs (\"Projects\"), Share icon, Star icon, Fullscreen icon, View tabs
      (\"Summary\", \"Timeline\", \"Board\", \"Calendar\", \"List\", \"Forms\", \"Goals\",
      \"All work\", \"Code\", \"Archived work items\", \"Pages\", \"Shortcuts\").
      - **Observable Function**: Identifies the current project context and allows
      the user to toggle between different data visualizations/modules. - **Location**:
      Top of the main content area, below the global navigation.", "### Main Content
      Area (Data Grid) - **Visible Elements**: Search list input, \"Filter\" dropdown,
      \"Group\" dropdown, View settings icons, and a multi-column table containing
      issue data. - **Observable Function**: Displays the primary dataset (issues/tasks)
      in a structured list format for viewing and editing. - **Location**: Center-right,
      occupying the majority of the screen real estate. ---", "## Level 2: Functional
      Groups ### List Control Toolbar - **UI Elements**: \"Search list\" text input
      with magnifying glass, \"Filter\" dropdown button, \"Group\" dropdown button,
      \"View settings\" (horizontal lines icon), \"Bulk change\" (three dots icon).
      - **Observable Pattern**: A horizontal row of interactive controls located directly
      above the data table. - **User Interaction**: Allows users to narrow down, organize,
      or modify the display parameters of the list below. - **Context**: Acts as the
      interface between the raw data and the user''s specific viewing requirements.",
      "### Issue Data Grid (Table) - **UI Elements**: - **Headers**: Checkbox (select
      all), \"Type\", \"Key\", \"Summary\", \"Status\", \"Comments\", \"Assignee\",
      \"Due date\", \"Labels\", \"Created\", \"+\" (add column). - **Row Data**: Issue
      icons (lightning bolts, checkboxes), Keys (e.g., \"PTP-3623\"), Summaries (e.g.,
      \"Time Tracking\"), Status badges (\"TO DO\"), \"Add comment\" buttons, Date
      pickers (\"13 Oct 2025\"). - **Observable Pattern**: A structured grid with
      fixed headers and repeating rows of data fields. - **User Interaction**: Enables
      reading issue details, clicking \"Key\" links for drill-down, and inline editing
      (e.g., clicking \"Add comment\" or the date field). - **Context**: The primary
      workspace for managing individual tasks within the \"Test project\".", "###
      Inline Creation Row - **UI Elements**: \"+ Create\" text with a plus icon. -
      **Observable Pattern**: A single interactive row located at the very bottom
      of the data grid. - **User Interaction**: Provides a quick-entry point to add
      a new record directly to the bottom of the current list. - **Context**: Simplifies
      the data entry workflow by keeping the \"Create\" action in line with the data
      being viewed.", "### Filter Sidebar Group - **UI Elements**: \"Default filters\"
      header, list items including \"My open work items\", \"Reported by me\", \"All
      work items\", \"Open work items\", \"Done work items\", \"Viewed recently\",
      \"Created recently\", \"Resolved recently\", \"Updated recently\", and \"View
      all filters\" link. - **Observable Pattern**: A vertically stacked list of text
      links under a common category header. - **User Interaction**: Allows for one-click
      execution of complex queries to update the Main Content Area. - **Context**:
      Provides quick access to common segments of the project''s data."], "model":
      "text-embedding-3-small", "encoding_format": "float"}'
