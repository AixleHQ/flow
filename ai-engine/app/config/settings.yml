default: &default
  env: "@jinja {{env.ENVIRONMENT or 'development'}}"
  log_level: "@jinja {{env.LOG_LEVEL or 'INFO'}}"
  temporal:
    host: "@jinja {{env.TEMPORAL_HOST or 'temporal'}}"
    port: "@jinja {{env.TEMPORAL_PORT or '7233'}}"
    namespace: "@jinja {{env.TEMPORAL_NAMESPACE or 'default'}}"
    task_queues:
      python: "@jinja {{env.TEMPORAL_TASK_QUEUE_PYTHON or 'palad_python'}}"
      ruby: "@jinja {{env.TEMPORAL_TASK_QUEUE_RUBY or 'palad_ruby'}}"
    max_workers: "@int @jinja {{env.TEMPORAL_MAX_WORKERS or '30'}}"

  redis:
    url: "@jinja {{env.REDIS_URL or 'redis://redis:6379/1'}}"

  db:
    host: "@jinja {{env.DB_HOST or 'db'}}"
    port: "@jinja {{env.DB_PORT or '5432'}}"
    username: "@jinja {{env.DB_USERNAME or 'postgres'}}"
    password: "@jinja {{env.DB_PASSWORD or ''}}"
    database: "@jinja {{env.DB_NAME or 'palad_development'}}"
    pool_size: "@int @jinja {{env.DB_POOL_SIZE or '30'}}"
    max_overflow: "@int @jinja {{env.DB_MAX_OVERFLOW or '10'}}"

  langfuse:
    enabled: "@bool @jinja {{env.LANGFUSE_ENABLED or 'false'}}"
    public_key: "@jinja {{env.LANGFUSE_PUBLIC_KEY or ''}}"
    secret_key: "@jinja {{env.LANGFUSE_SECRET_KEY or ''}}"
    host: "@jinja {{env.LANGFUSE_HOST or 'https://lf.palad.com'}}"
    tracing_environment: "@jinja {{env.LANGFUSE_TRACING_ENVIRONMENT or 'development'}}"

  openrouter:
    api_key: "@jinja {{env.OPENROUTER_API_KEY or ''}}"
    base_url: "@jinja {{env.OPENROUTER_BASE_URL or 'https://openrouter.ai/api/v1'}}"
    max_retries: "@int @jinja {{env.OPENROUTER_MAX_RETRIES or '2'}}"

  openai:
    api_key: "@jinja {{env.OPENAI_API_KEY or ''}}"

  qdrant:
    host: "@jinja {{env.QDRANT_HOST or 'qdrant'}}"
    port: "@jinja {{env.QDRANT_PORT or '6333'}}"
    url: "@jinja {{env.QDRANT_URL or 'http://qdrant:6333'}}"

  rollbar:
    access_token: "@jinja {{env.ROLLBAR_ACCESS_TOKEN or ''}}"

  aws:
    access_key_id: "@jinja {{env.AWS_ACCESS_KEY_ID or ''}}"
    secret_access_key: "@jinja {{env.AWS_SECRET_ACCESS_KEY or ''}}"
    default_region: "@jinja {{env.AWS_DEFAULT_REGION or 'us-east-1'}}"
    profile: "@jinja {{env.AWS_PROFILE or 'default'}}"

  concurrency:
    mixture_of_experts: "@int @jinja {{env.CONCURRENCY_MIXTURE_OF_EXPERTS_ or '3'}}"
    file_analysis: "@int @jinja {{env.CONCURRENCY_FILE_ANALYSIS or '2'}}"
    embedding_generation: "@int @jinja {{env.CONCURRENCY_EMBEDDING_GENERATION or '7'}}"
    code_report_section_chunks: "@int @jinja {{env.CONCURRENCY_CODE_REPORT_SECTION_CHUNKS or '10'}}"
    vector_content_search: "@int @jinja {{env.CONCURRENCY_VECTOR_CONTENT_SEARCH or '5'}}"

  dump:
    enabled: "@bool @jinja {{env.DUMP_ENABLED or 'false'}}"

test:
  concurrency:
    mixture_of_experts: 1
    file_analysis: 1
    embedding_generation: 1
    code_report_section_chunks: 1
    vector_content_search: 1
  openrouter:
    api_key: "@jinja {{env.OPENROUTER_API_KEY or '...'}}"
    base_url: "@jinja {{env.OPENROUTER_BASE_URL or 'https://openrouter.ai/api/v1'}}"
    max_retries: "@int @jinja {{env.OPENROUTER_MAX_RETRIES or '1'}}"
  openai:
    api_key: "@jinja {{env.OPENAI_API_KEY or '...'}}"
  dump:
    enabled: true

