http:
  middlewares:
    terminal-auth:
      forwardAuth:
        # Traefik renders this file as a Go template; PORT comes from the
        # traefik service's environment, so a worktree stack on another port
        # authenticates against its own web.
        address: 'http://web:{{ env "PORT" | default "4000" }}/api/v1/internal/ws_auth'
        # Cookie/Authorization are replaced by what ws_auth answers, so the
        # agent container never receives the viewer's Rails session cookie.
        authResponseHeadersRegex: "^(X-.*|Cookie|Authorization)$"
        # The sandbox host's pass (ContainerTicket), when containers are served
        # from a host of their own.
        addAuthCookiesToResponse:
          - aixle_container
    terminal-cors:
      headers:
        accessControlAllowOriginList:
          - 'http://localhost:{{ env "PORT" | default "4000" }}'
          - "http://localhost"
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        accessControlAllowHeaders:
          - Content-Type
          - Authorization
          - X-Requested-With
          - Cookie
        accessControlAllowCredentials: true
