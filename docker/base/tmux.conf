set -g history-limit 50000
set -g remain-on-exit on
set -g status off
set -g set-clipboard on
# allow-passthrough lets the running program (Claude Code) forward OSC 52
# "copy to clipboard" through tmux to the outer terminal (ttyd's xterm.js,
# which writes it to the browser clipboard). tmux 3.3+ blocks DCS passthrough
# by default; Claude wraps its OSC 52 in a DCS envelope, so this MUST be on
# for `c to copy` of the long OAuth login URL to reach the browser clipboard.
set -g allow-passthrough on
# Mirror tmux's OWN clipboard (copy-mode mouse/keyboard selections) out to the
# browser. tmux only forwards a copy via OSC 52 if it believes the outer terminal
# supports it; ttyd reports xterm-256color which doesn't advertise the capability.
# tmux 3.2+ idiom: declare the `clipboard` terminal-feature (tmux then emits the
# correct OSC 52). Without this, copy-mode highlights yellow but never reaches the
# browser clipboard.
set -as terminal-features ',xterm-256color:clipboard'

# tmux's built-in set-clipboard OSC 52 forwarding does NOT reach ttyd's xterm in
# this stack, but DCS-passthrough does. So route copy-mode copies through a helper
# that emits the selection as passthrough-wrapped OSC 52 into the pane tty. This
# makes mouse selection AND keyboard copy land in the browser clipboard. (Pair with
# a wide pane for auth sessions so a long URL is one line, not wrapped.)
bind -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'tmux-osc52 #{pane_tty}'
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'tmux-osc52 #{pane_tty}'
bind -T copy-mode    Enter             send-keys -X copy-pipe-and-cancel 'tmux-osc52 #{pane_tty}'
bind -T copy-mode-vi Enter             send-keys -X copy-pipe-and-cancel 'tmux-osc52 #{pane_tty}'
bind -T copy-mode    y                 send-keys -X copy-pipe-and-cancel 'tmux-osc52 #{pane_tty}'
bind -T copy-mode-vi y                 send-keys -X copy-pipe-and-cancel 'tmux-osc52 #{pane_tty}'

# Enable mouse support so trackpad/wheel scrolling works in the web terminal.
# Without this, ttyd's xterm.js falls back to "alternate scroll mode" and
# translates wheel events into arrow keys inside full-screen TUIs (e.g. Claude
# Code), which makes session output unreachable on MacBooks without PgUp/PgDn.
# With mouse on, tmux advertises mouse reporting to xterm.js, so real mouse
# events are sent and forwarded to the running TUI (or handled by copy-mode).
set -g mouse on
