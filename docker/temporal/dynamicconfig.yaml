limit.numPendingActivities.error:
  - value: 20000

limit.numPendingChildExecutions.error:
  - value: 1000

limit.numPendingSignals.error:
  - value: 1000

limit.numPendingCancelRequests.error:
  - value: 1000

# Workflow history limits
# Default: historySize.error = 50MB, historyCount.error = 50000 events
# Increased to allow processing more batches before continue-as-new
limit.historySize.warn:
  - value: 104857600  # 100 MB (warning threshold)
limit.historySize.error:
  - value: 209715200  # 200 MB (error threshold, default is 50MB)

limit.historyCount.warn:
  - value: 500000  # 500k events (warning threshold)
limit.historyCount.error:
  - value: 1000000  # 1M events (error threshold, default is 50000)
