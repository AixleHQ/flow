x-web-volumes: &web-volumes
  - ./web:/app:cached
  - ./config/workflows.yml:/app/app/temporal/workflows.yml:cached
  - ~/.bash_history:/root/.bash_history
  - bundle_cache:/bundle_cache
  - ./docker/remote/db_dumps:/db_dumps:cached
  - /var/run/docker.sock:/var/run/docker.sock

x-ai-engine-volumes: &ai-engine-volumes
  - ~/.bash_history:/root/.bash_history
  - ./ai-engine:/app:cached
  - ./config/workflows.yml:/app/app/workflows/workflows.yml:cached
  - uv_cache:/root/.cache/uv
  - py_venv:/app/.venv

x-db-environment: &db-environment
  DB_HOST: db
  DB_PORT: 5432
  DB_USERNAME: postgres
  DB_NAME: palad_development

x-web-environment: &web-environment
  <<: *db-environment
  APP_VERSION: dev
  AUTHOR_NAME: author
  AUTHOR_EMAIL: email
  BUNDLE_PATH: /bundle_cache
  GEM_HOME: /bundle_cache
  GEM_PATH: /bundle_cache
  RAILS_LOG_TO_STDOUT: 'true'
  PORT: 4000
  REDIS_URL: redis://redis:6379/1

x-ai-engine-environment: &ai-engine-environment
  <<: *db-environment
  ENVIRONMENT: development

x-toolbox-environment: &toolbox-environment
  - PROJECT=palad
  - APPLICATION=app-web
  - AWS_REGION
  - AWS_DEFAULT_REGION
  - AWS_ACCESS_KEY_ID
  - AWS_SECRET_ACCESS_KEY
  - AWS_SESSION_TOKEN
  - AWS_SECURITY_TOKEN
  - AWS_SESSION_EXPIRATION
  - AWS_SESSION_TOKEN_TTL=24h
  - AWS_CHAINED_SESSION_TOKEN_TTL=24h
  - AWS_ASSUME_ROLE_TTL=24h

services:
  temporal:
    image: temporalio/auto-setup:1.29.0
    ports:
      - "7233:7233"
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=postgres
      - POSTGRES_SEEDS=db
      - LOG_LEVEL=error
    volumes:
      - ./docker/temporal/dynamicconfig.yaml:/etc/temporal/config/dynamicconfig/docker.yaml
    depends_on:
      - db
    attach: false

  temporal-ui:
    image: temporalio/ui:2.43.3
    ports:
      - 8080:8080
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_UI_PORT=8080
    restart: on-failure:5
    attach: false

  web:
    build:
      dockerfile: ./web/Dockerfile
    image: web
    volumes: *web-volumes
    ports:
      - '4000:4000'
      - '4001:4001'
    depends_on:
      - db
      - redis
    environment:
      <<: *web-environment
    command: dev

  worker-ruby:
    profiles: [worker]
    image: web
    volumes: *web-volumes
    environment:
      <<: *web-environment
      TEMPORAL_ENABLED: 'true'
      TEMPORAL_DEBUG: 'true'
    command: bin/temporal_worker
    depends_on:
      - temporal
      - db
    restart: on-failure:5

  worker-python:
    profiles: [worker]
    build:
      dockerfile: ./ai-engine/Dockerfile
    volumes: *ai-engine-volumes
    environment:
      <<: *ai-engine-environment
      TEMPORAL_DEBUG: 'true'
    command: python app/temporal/worker.py
    depends_on:
      - temporal
      - qdrant
      - db
    restart: on-failure:5

  db:
    image: postgres:15.3-alpine
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
    attach: false

  redis:
    image: redis:7.2-alpine
    volumes:
      - redis_data:/data

    attach: false


  # Base image for all AI agents
  agent-base:
    profiles: [build]
    build:
      context: ./docker/base
      dockerfile: Dockerfile
    image: palad/agent-base:latest

  # Claude Code interactive session with ttyd + file watcher
  claude-code:
    profiles: [agents]
    build:
      context: ./docker/claude-code
      dockerfile: Dockerfile
    image: palad/claude-code:latest
    ports:
      - '7681:7681'   # ttyd web terminal
      - '4040:4040'   # file watcher WebSocket + HTTP
    environment:
      - TTYD_PORT=7681
      - WATCHER_PORT=4040
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - claude_workspace:/workspace
    stdin_open: true
    tty: true

  # Cursor CLI interactive session
  cursor-cli:
    profiles: [agents]
    build:
      context: ./docker/cursor-cli
      dockerfile: Dockerfile
    image: palad/cursor-cli:latest
    ports:
      - '7682:7681'   # ttyd web terminal
      - '4041:4040'   # file watcher WebSocket + HTTP
    environment:
      - TTYD_PORT=7681
      - WATCHER_PORT=4040
      - CURSOR_API_KEY=${CURSOR_API_KEY:-}
    volumes:
      - cursor_workspace:/workspace
    stdin_open: true
    tty: true

  # OpenAI Codex CLI interactive session
  codex:
    profiles: [agents]
    build:
      context: ./docker/codex
      dockerfile: Dockerfile
    image: palad/codex:latest
    ports:
      - '7683:7681'   # ttyd web terminal
      - '4042:4040'   # file watcher WebSocket + HTTP
    environment:
      - TTYD_PORT=7681
      - WATCHER_PORT=4040
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - codex_workspace:/workspace
    stdin_open: true
    tty: true

  # Gemini CLI interactive session
  gemini-cli:
    profiles: [agents]
    build:
      context: ./docker/gemini-cli
      dockerfile: Dockerfile
    image: palad/gemini-cli:latest
    ports:
      - '7684:7681'   # ttyd web terminal
      - '4043:4040'   # file watcher WebSocket + HTTP
    environment:
      - TTYD_PORT=7681
      - WATCHER_PORT=4040
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
    volumes:
      - gemini_workspace:/workspace
    stdin_open: true
    tty: true

  remote:
    profiles: [infra]
    build:
      context: ./docker/remote
      args:
        platform: '${PLATFORM:-linux_arm64}'
    entrypoint: ''
    environment: *toolbox-environment
    volumes:
      - ./docker/remote:/app:cached
      - .aws:/root/.aws

  toolbox:
    profiles: [infra]
    image: ghcr.io/artempartos/ecs_toolbox:latest
    environment: *toolbox-environment
    volumes:
      - .:/app:cached
      - /var/run/docker.sock:/var/run/docker.sock



volumes:
  bundle_cache:
  redis_data:
  qdrant_data:
  py_venv:
  uv_cache:
  claude_workspace:
  cursor_workspace:
  codex_workspace:
  gemini_workspace: