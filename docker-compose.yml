x-web-volumes: &web-volumes
  - .:/app:cached
  - ~/.bash_history:/home/app/.bash_history
  - bundle_cache:/bundle_cache
  # Non-root app user's $HOME (L-22). Without this, corepack/yarn's global
  # cache lives in the container's writable layer, which `docker compose run`
  # throws away every invocation — yarn re-fetches every package each time
  # a one-off container starts (e.g. `dcr web bash`).
  - app_home:/home/app
  - ./docker/remote/db_dumps:/db_dumps:cached

# Worker needs Docker socket access for container lifecycle management (docker-api gem).
# Web does not — it uses kubeclient for k8s in production.
x-worker-volumes: &worker-volumes
  - .:/app:cached
  - ~/.bash_history:/home/app/.bash_history
  - bundle_cache:/bundle_cache
  - app_home:/home/app
  - ./docker/remote/db_dumps:/db_dumps:cached
  - /var/run/docker.sock:/var/run/docker.sock

x-db-environment: &db-environment
  DB_HOST: db
  DB_PORT: 5432
  DB_USERNAME: postgres
  DB_NAME: aixle_development

x-web-environment: &web-environment
  <<: *db-environment
  APP_VERSION: dev
  BUNDLE_PATH: /bundle_cache
  GEM_HOME: /bundle_cache
  GEM_PATH: /bundle_cache
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  RAILS_LOG_TO_STDOUT: 'true'
  # Puma's thread budget and the value config/settings.yml sizes the Active
  # Record pool from — matches the Puma default so dev doesn't run 10 request
  # threads against a 5-connection pool. The worker overrides it.
  RAILS_MAX_THREADS: '10'
  # The three ports the stack listens on, overridable so a second stack can run
  # beside the first on one machine (a worktree under review, say) instead of
  # colliding on 4000/4001/4002. Everything derived from them follows:
  # config/puma.rb and config/puma_mcp.rb bind them, and config/settings.yml
  # builds domain, asset_host, container_asset_host and the internal base URL
  # from the same two values.
  PORT: ${PORT:-4000}
  MCP_PORT: ${MCP_PORT:-4002}
  VITE_RUBY_PORT: ${VITE_RUBY_PORT:-4001}
  REDIS_URL: redis://redis:6379/1
  DOCKER_NETWORK: ${DOCKER_NETWORK:-app_default}

x-toolbox-environment: &toolbox-environment
  - PROJECT=aixle
  - APPLICATION=app-web
  - AWS_REGION
  - AWS_DEFAULT_REGION
  - AWS_ACCESS_KEY_ID
  - AWS_SECRET_ACCESS_KEY
  - AWS_SESSION_TOKEN
  - AWS_SECURITY_TOKEN
  - AWS_SESSION_EXPIRATION
  - AWS_SESSION_TOKEN_TTL=24h
  - AWS_CHAINED_SESSION_TOKEN_TTL=24h
  - AWS_ASSUME_ROLE_TTL=24h

services:
  temporal:
    image: temporalio/auto-setup:1.29.7
    restart: on-failure
    ports:
      - "${TEMPORAL_HOST_PORT:-7233}:7233"
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=postgres
      - POSTGRES_SEEDS=db
      - LOG_LEVEL=error
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health --address $(hostname -i):7233"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s
    attach: false

  temporal-ui:
    image: temporalio/ui:2.43.3
    ports:
      - "${TEMPORAL_UI_HOST_PORT:-8080}:8080"
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_UI_PORT=8080
    restart: on-failure:5
    attach: false

  web:
    build:
      dockerfile: ./Dockerfile
    image: ${WEB_IMAGE:-web}
    volumes: *web-volumes
    ports:
      - '${PORT:-4000}:${PORT:-4000}'
      - '${VITE_RUBY_PORT:-4001}:${VITE_RUBY_PORT:-4001}'
      - '${MCP_PORT:-4002}:${MCP_PORT:-4002}'  # MCP server (separate Puma via Procfile.dev)
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      otlp-ingest:
        condition: service_started
    environment:
      <<: *web-environment
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${DOCKER_NETWORK:-app_default}-api.rule=PathPrefix(`/api`)"
      - "traefik.http.services.${DOCKER_NETWORK:-app_default}-api.loadbalancer.server.port=${PORT:-4000}"
    entrypoint: bin/docker-entrypoint
    command: dev
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${PORT:-4000}/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  worker:
    image: ${WEB_IMAGE:-web}
    volumes: *worker-volumes
    environment:
      <<: *web-environment
      TEMPORAL_ENABLED: 'true'
      TEMPORAL_DEBUG: 'true'
      TEMPORAL_WORKER_GRACEFUL_SHUTDOWN_PERIOD: '900'
      RAILS_MAX_THREADS: '20'
    command: bin/temporal_worker
    depends_on:
      web:
        condition: service_healthy
      temporal:
        condition: service_healthy
    stop_grace_period: 20m
    restart: on-failure:5

  db:
    image: postgres:15.3-alpine
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    attach: false

  redis:
    image: redis:7.2-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    attach: false

  traefik:
    image: traefik:v3.6.6
    ports:
      - "${HTTP_HOST_PORT:-80}:80"
      - "${HTTPS_HOST_PORT:-443}:443"
      - "${TRAEFIK_DASHBOARD_HOST_PORT:-8090}:8080"
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=${DOCKER_NETWORK:-app_default}"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--log.level=DEBUG"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    attach: false

  otlp-ingest:
    build:
      context: ./docker/otlp-ingest
      dockerfile: Dockerfile
    image: aixle/otlp-ingest:latest
    ports:
      - '${OTLP_HOST_PORT:-4318}:4318'
    attach: false

  remote:
    profiles: [infra]
    build:
      context: ./docker/remote
      args:
        platform: '${PLATFORM:-linux_arm64}'
    entrypoint: ''
    environment: *toolbox-environment
    volumes:
      - ./docker/remote:/app:cached
      - .aws:/root/.aws

  toolbox:
    profiles: [infra]
    image: ghcr.io/artempartos/ecs_toolbox:latest
    environment: *toolbox-environment
    volumes:
      - .:/app:cached
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  bundle_cache:
  app_home:
  pg_data:
  redis_data:

networks:
  # Fixed, not Compose-derived: agent containers join it by name
  # (docs/project/worktree-stack.md).
  default:
    name: ${DOCKER_NETWORK:-app_default}
