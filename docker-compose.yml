x-web-volumes: &web-volumes
  - .:/app:cached
  - ~/.bash_history:/root/.bash_history
  - bundle_cache:/bundle_cache
  - ./docker/remote/db_dumps:/db_dumps:cached
  - /var/run/docker.sock:/var/run/docker.sock

x-db-environment: &db-environment
  DB_HOST: db
  DB_PORT: 5432
  DB_USERNAME: postgres
  DB_NAME: aixle_development

x-web-environment: &web-environment
  <<: *db-environment
  APP_VERSION: dev
  AUTHOR_NAME: author
  AUTHOR_EMAIL: email
  BUNDLE_PATH: /bundle_cache
  GEM_HOME: /bundle_cache
  GEM_PATH: /bundle_cache
  RAILS_LOG_TO_STDOUT: 'true'
  PORT: 4000
  REDIS_URL: redis://redis:6379/1

x-toolbox-environment: &toolbox-environment
  - PROJECT=aixle
  - APPLICATION=app-web
  - AWS_REGION
  - AWS_DEFAULT_REGION
  - AWS_ACCESS_KEY_ID
  - AWS_SECRET_ACCESS_KEY
  - AWS_SESSION_TOKEN
  - AWS_SECURITY_TOKEN
  - AWS_SESSION_EXPIRATION
  - AWS_SESSION_TOKEN_TTL=24h
  - AWS_CHAINED_SESSION_TOKEN_TTL=24h
  - AWS_ASSUME_ROLE_TTL=24h

services:
  temporal:
    image: temporalio/auto-setup:1.29.0
    ports:
      - "7233:7233"
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=postgres
      - POSTGRES_SEEDS=db
      - LOG_LEVEL=error
    depends_on:
      - db
    attach: false

  temporal-ui:
    image: temporalio/ui:2.43.3
    ports:
      - 8080:8080
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_UI_PORT=8080
    restart: on-failure:5
    attach: false

  web:
    build:
      dockerfile: ./Dockerfile
    image: web
    volumes: *web-volumes
    ports:
      - '4000:4000'
      - '4001:4001'
      - '4002:4002'  # MCP server (separate Puma via Procfile.dev)
    depends_on:
      - db
      - redis
      - otlp-ingest
    environment:
      <<: *web-environment
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=PathPrefix(`/api`)"
      - "traefik.http.services.web.loadbalancer.server.port=4000"
    command: dev

  worker:
    profiles: [worker]
    image: web
    volumes: *web-volumes
    environment:
      <<: *web-environment
      TEMPORAL_ENABLED: 'true'
      TEMPORAL_DEBUG: 'true'
      TEMPORAL_WORKER_GRACEFUL_SHUTDOWN_PERIOD: '900'
      RAILS_MAX_THREADS: '20'
    command: bin/temporal_worker
    depends_on:
      - temporal
      - db
    stop_grace_period: 20m
    restart: on-failure:5

  db:
    image: postgres:15.3-alpine
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - pg_data:/var/lib/postgresql/data
    attach: false

  redis:
    image: redis:7.2-alpine
    volumes:
      - redis_data:/data
    attach: false

  traefik:
    image: traefik:v3.6.6
    ports:
      - "80:80"
      - "443:443"
      - "8090:8080"
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=app_default"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--log.level=DEBUG"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TRAEFIK_CORS_ORIGINS=${TRAEFIK_CORS_ORIGINS:-http://localhost:4000,http://localhost}
    labels:
      - "traefik.enable=true"
      # ForwardAuth middleware for terminal sessions
      - "traefik.http.middlewares.terminal-auth.forwardauth.address=http://web:4000/api/v1/internal/ws_auth"
      - "traefik.http.middlewares.terminal-auth.forwardauth.authResponseHeadersRegex=^X-"
      # CORS middleware for terminal APIs
      - "traefik.http.middlewares.terminal-cors.headers.accessControlAllowOriginList=${TRAEFIK_CORS_ORIGINS:-http://localhost:4000,http://localhost}"
      - "traefik.http.middlewares.terminal-cors.headers.accessControlAllowMethods=GET,POST,PUT,DELETE,OPTIONS"
      - "traefik.http.middlewares.terminal-cors.headers.accessControlAllowHeaders=Content-Type,Authorization,X-Requested-With,Cookie"
      - "traefik.http.middlewares.terminal-cors.headers.accessControlAllowCredentials=true"
    attach: false

  otlp-ingest:
    build:
      context: ./docker/otlp-ingest
      dockerfile: Dockerfile
    image: aixle/otlp-ingest:latest
    ports:
      - '4318:4318'
    attach: false

  remote:
    profiles: [infra]
    build:
      context: ./docker/remote
      args:
        platform: '${PLATFORM:-linux_arm64}'
    entrypoint: ''
    environment: *toolbox-environment
    volumes:
      - ./docker/remote:/app:cached
      - .aws:/root/.aws

  toolbox:
    profiles: [infra]
    image: ghcr.io/artempartos/ecs_toolbox:latest
    environment: *toolbox-environment
    volumes:
      - .:/app:cached
      - /var/run/docker.sock:/var/run/docker.sock



volumes:
  bundle_cache:
  pg_data:
  redis_data:

networks:
  default:
    name: app_default
