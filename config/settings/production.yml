temporal:
  enabled: true

agents:
  # The whole built-in set lives in one registry, so one prefix replaces the
  # seven per-runtime image entries this file used to carry. Tag stays blank:
  # these are published as moving tags, which is the registry default.
  image_prefix: <%= ENV['AGENT_IMAGE_PREFIX'] || 'ghcr.io/aixle/aixle-app-' %>
  image_tag: <%= ENV['AGENT_IMAGE_TAG'] || '' %>
