temporal:
  enabled: true

agents:
  # The whole built-in set lives in one registry, so one prefix names all seven
  # runtime images. The default is where
  # .github/workflows/images.yml publishes them (ghcr.io/aixlehq/flow-<runtime>).
  # A release image sets AGENT_IMAGE_TAG to its own version (Dockerfile), so web
  # X.Y.Z launches the agent images X.Y.Z. Blank — an image built without it — is a
  # moving tag, so the Kubernetes runtime then pulls on every start
  # (KubernetesRuntime#image_pull_policy_for) rather than trusting a node's cache.
  image_prefix: <%= ENV['AGENT_IMAGE_PREFIX'] || 'ghcr.io/aixlehq/flow-' %>
  image_tag: <%= ENV['AGENT_IMAGE_TAG'] || '' %>
