# The platform's runner pins (docs/design/agent-runtimes/DESIGN.md §14.2), read as
# Settings.runners.release through Runners::Release. Committed, not derived from a
# release: publishing `runner-vX.Y.Z` changes nothing until an application PR edits
# this file, and the application changelog mentions every such edit
# (docs/operations/releasing.md, "Runner compatibility"). An invalid file fails boot.
#
# - protocol_supported: the runner protocol versions the gateway accepts in
#   X-Aixle-Runner-Protocol. Only versions the gateway implements may be listed;
#   after the first bump it is [N-1, N].
# - min_version: `register` (and with task 8c `check-in`) refuses a runner below it
#   with `runner_version_unsupported`. null: no minimum.
# - recommended_version: an idle machine below it is offered an update in the
#   empty answer of its long-poll, unless it opted out. Its binaries must be pinned
#   below. null: nothing is recommended.
# - download_url: where `GET /runner/v1/releases/:version/:os-:arch` redirects,
#   with %{version} and %{platform} (`linux-amd64`) filled in: the `runner-v*`
#   release's asset (.github/workflows/runner-release.yml).
# - binaries: the SHA-256 of each binary, by version and `<os>-<arch>`, copied from
#   the release's checksums.txt. A version or platform not listed here is never
#   served: the digest a runner verifies comes from this file, not from the asset
#   host.
#
#   binaries:
#     "0.1.0":
#       linux-amd64: { sha256: "…" }
#       linux-arm64: { sha256: "…" }
#
# runner-v0.1.0 is not tagged yet. The PR after it sets recommended_version and
# its digests.
protocol_supported: [1]
min_version: null
recommended_version: null
download_url: "https://github.com/AixleHQ/flow/releases/download/runner-v%{version}/aixle-runner-%{platform}"
binaries: {}
