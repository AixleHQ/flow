# Estimates only. LlmCalls::Pricing uses this table to put a rough cost on a call whose
# runtime reports tokens but no cost (Codex, Gemini CLI, Antigravity; Grok when the xAI
# catalogue is unreachable). It is the vendor's public list price at the standard tier —
# not what any account was billed: subscriptions, committed-use discounts, batch or
# priority tiers and regional endpoints all differ. Calls priced from it carry
# cost_basis "priced", never "reported" (docs/design/insights-usage-export.md §3).
#
# USD per million tokens. A key matches the canonical model id itself or the id followed
# by "-…" (a dated snapshot, an effort or variant suffix): "gpt-5.1" prices
# "gpt-5.1-codex-max" but not "gpt-5.4"; the longest matching key wins. A model with no
# key stays unpriced — its cost is unknown, never zero.
#
# cache_read / cache_write default to the input rate (cache_write is the shortest
# cache duration the vendor sells). long_context applies to a single request whose
# prompt exceeds `above` tokens. `changes` are later rates, by the date they take effect.
#
# Upkeep: .github/workflows/llm-prices.yml runs bin/llm-prices-report every week and
# keeps one issue open while a rate differs from LiteLLM's public list or the last
# review is over 90 days old. `source` names the LiteLLM entry where its key differs.
# Confirm a change on the vendor's page, then bump `reviewed_on`:
#   OpenAI     https://developers.openai.com/api/docs/pricing
#   Google     https://aistudio.google.com/docs/pricing
#   Anthropic  https://platform.claude.com/docs/en/about-claude/pricing
