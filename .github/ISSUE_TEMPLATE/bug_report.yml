name: 🐛 Bug report
description: Report a problem so we can fix it
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug! Please search
        [existing issues](https://github.com/AixleHQ/flow/issues) first to
        avoid duplicates.

        ⚠️ **Do not report security vulnerabilities here.** See
        [SECURITY.md](https://github.com/AixleHQ/flow/blob/develop/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we reproduce it?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Help us reproduce it.
      value: |
        - Aixle Flow version / commit:
        - Runtime: Docker / Kubernetes
        - OS:
        - Browser (if UI):
        - Agent(s) involved (Claude Code / Cursor CLI / Codex / Gemini CLI):
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Paste any relevant log output. This will be rendered as code, so no need for backticks.
      render: shell
    validations:
      required: false
