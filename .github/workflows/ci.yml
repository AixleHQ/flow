name: CI

# Replaces the deployment pipeline that used to carry these checks. Deployment
# lives outside this repository: images are published to GHCR by images.yml and
# rolled out from a separate operations repository.

on:
  push:
    branches:
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-image:
    name: Build Test Image
    # Builds the test image once per run to populate the buildx layer cache, which
    # the two check jobs then read instead of each compiling gems and assets from
    # scratch. Measured on 31041703132, before this job existed: the same image was
    # built twice in parallel, 638s in the backend job and 473s in the frontend one
    # — 18 of the run's 24 machine-minutes. Two concurrent builds writing one
    # `type=gha` scope cannot warm each other, and `mode=max` on an 18-layer,
    # 1.45 GB image also churns against the repository's 10 GB cache limit.
    #
    # Deliberately not sharing the image itself. Pushing it to GHCR under a
    # run-scoped tag would be faster, but pull requests from forks get a read-only
    # token and no package write, so external contributions — the point of a public
    # repository — would need a second, untested code path. A `docker save`
    # artifact moves 1.45 GB twice and gives most of the saving back.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Warm the layer cache
        uses: docker/build-push-action@v7
        with:
          context: .
          # cacheonly: this job exists for its cache write, so skip materialising
          # a local image that nothing here will run.
          outputs: type=cacheonly
          build-args: |
            APP_VERSION=ci
            AUTHOR_NAME=github-actions
            AUTHOR_EMAIL=github-actions@users.noreply.github.com
          cache-from: type=gha
          cache-to: type=gha,mode=max

  be-checks:
    name: Backend Checks
    needs: build-image
    uses: ./.github/workflows/code-check.yml
    with:
      # rails-test + rubocop + brakeman (Ruby). Needs the DB for the Rails test suite.
      command: be_check_all
      needs-db: true
      # Coverage instrumentation is a large runtime multiplier, so it runs on the
      # integration branches and is skipped on ordinary pull requests.
      run-coverage: ${{ github.event_name == 'push' && '1' || '0' }}
      timeout: 35

  fe-checks:
    name: Frontend Checks
    needs: build-image
    uses: ./.github/workflows/code-check.yml
    with:
      # eslint + tsc, then Vitest on its own (backendless, no DB needed).
      command: fe_check_all
      needs-db: false
      run-coverage: ${{ github.event_name == 'push' && '1' || '0' }}
      timeout: 30

  coverage-badges:
    name: Coverage Badges
    needs: [ be-checks, fe-checks ]
    # Only develop pushes measure coverage (see run-coverage above), and develop
    # is the branch the README advertises.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Writes the rendered endpoints to the orphan `badges` branch.
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Publish shields.io endpoints
        env:
          BACKEND: ${{ needs.be-checks.outputs.line-coverage }}
          FRONTEND: ${{ needs.fe-checks.outputs.line-coverage }}
        run: |
          set -euo pipefail

          if [ -z "$BACKEND" ] && [ -z "$FRONTEND" ]; then
            echo "::warning::no coverage numbers were produced, nothing to publish"
            exit 0
          fi

          # The badges live on an orphan branch: the README's badge URLs then
          # point at a ref that CI rewrites on every develop push, without a
          # bot commit landing in develop's history on each run. A worktree
          # keeps that branch out of the checked-out tree entirely.
          if git ls-remote --exit-code --heads origin badges >/dev/null 2>&1; then
            # Fetched in full, unlike the shallow checkout above: the branch is
            # two JSON files deep, and a complete history keeps the push simple.
            git fetch origin badges:badges
            git worktree add ../badges badges
          else
            git worktree add --detach ../badges
            git -C ../badges switch --orphan badges
          fi

          render() {
            percent="$1"
            label="$2"
            file="$3"

            [ -n "$percent" ] || return 0

            color=$(awk -v p="$percent" 'BEGIN {
              if      (p >= 90) print "brightgreen"
              else if (p >= 80) print "green"
              else if (p >= 70) print "yellowgreen"
              else if (p >= 60) print "yellow"
              else if (p >= 50) print "orange"
              else              print "red"
            }')

            jq -n \
              --arg label "$label" \
              --arg message "${percent}%" \
              --arg color "$color" \
              '{schemaVersion: 1, label: $label, message: $message, color: $color}' \
              > "../badges/$file"
          }

          render "$BACKEND"  "backend coverage"  backend-coverage.json
          render "$FRONTEND" "frontend coverage" frontend-coverage.json

          cd ../badges
          git add --all
          if git diff --cached --quiet; then
            echo "Coverage unchanged, nothing to commit"
            exit 0
          fi

          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore(ci): coverage badges for ${GITHUB_SHA:0:7}"
          git push origin badges

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks scans commit history, which needs more than the default
          # single-commit checkout.
          fetch-depth: 0

      - name: Run gitleaks
        # The gitleaks CLI, not gitleaks-action: the action requires a paid
        # licence key for organisation-owned repositories, while the scanner
        # itself is free. Pinned by tag so a new release cannot change the
        # verdict without a commit here.
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner --verbose
