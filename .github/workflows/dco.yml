name: DCO

# Verifies every commit in the pull request carries a Developer Certificate of Origin
# sign-off (`git commit -s`). Self-contained on purpose: no third-party action, so this
# check cannot be influenced by an upstream release.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need both sides of the range to enumerate the PR's commits.
          fetch-depth: 0

      - name: Check Signed-off-by on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail

          missing=0
          # %H then the raw body, NUL-delimited per commit so multi-line bodies survive.
          while IFS= read -r -d '' commit; do
            sha="${commit%%$'\n'*}"
            body="${commit#*$'\n'}"

            # Merge commits are generated by GitHub, not authored by the contributor.
            parents=$(git rev-list --parents -n 1 "$sha" | wc -w)
            if [ "$parents" -gt 2 ]; then
              echo "skip   $sha (merge commit)"
              continue
            fi

            if printf '%s' "$body" | grep -qiE '^[[:space:]]*Signed-off-by:[[:space:]]*.+<.+@.+>'; then
              echo "ok     $sha"
            else
              echo "MISSING $sha  $(git log -1 --format=%s "$sha")"
              missing=1
            fi
          done < <(git log --reverse -z --format='%H%n%B' "$BASE_SHA..$HEAD_SHA")

          if [ "$missing" -ne 0 ]; then
            cat <<'EOF'

          ─────────────────────────────────────────────────────────────────
          One or more commits are missing a DCO sign-off.

          Every commit needs a `Signed-off-by:` trailer certifying you have
          the right to submit the code under the project's license. See
          CONTRIBUTING.md and https://developercertificate.org/

          To fix the most recent commit:
              git commit --amend -s --no-edit && git push --force-with-lease

          To fix every commit on this branch:
              git rebase --signoff origin/develop && git push --force-with-lease
          ─────────────────────────────────────────────────────────────────
          EOF
            exit 1
          fi

          echo "All commits are signed off."
