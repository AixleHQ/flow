name: DCO

# Verifies every commit in the pull request carries a Developer Certificate of Origin
# sign-off (`git commit -s`) whose email matches the commit author. Self-contained on
# purpose: no third-party action, so this check cannot be influenced by an upstream
# release. Merge commits and bot authors are exempt, matching the behaviour of the
# reference implementation (https://github.com/dcoapp/app).

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need both sides of the range to enumerate the PR's commits.
          fetch-depth: 0

      - name: Check Signed-off-by on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail

          failed=0
          # %H, author email, author name, then the raw body — NUL-delimited per commit
          # so multi-line bodies survive.
          while IFS= read -r -d '' commit; do
            sha="${commit%%$'\n'*}"
            rest="${commit#*$'\n'}"
            author_email="${rest%%$'\n'*}"
            rest="${rest#*$'\n'}"
            author_name="${rest%%$'\n'*}"
            body="${rest#*$'\n'}"

            # Merge commits are generated by GitHub, not authored by the contributor.
            parents=$(git rev-list --parents -n 1 "$sha" | wc -w)
            if [ "$parents" -gt 2 ]; then
              echo "skip     $sha (merge commit)"
              continue
            fi

            # Bots cannot agree to the DCO; their commits are covered by the allowlist
            # in the CLA workflow instead. Our own platform agents commit through the
            # aixle-com GitHub App, but not every one of their identities carries the
            # `[bot]` suffix — match our service-account domains too, since those
            # commits are the company's own output.
            case "$author_name" in
              *'[bot]')
                echo "skip     $sha (bot author: $author_name)"
                continue
                ;;
            esac
            author_email=$(printf '%s' "$author_email" | tr '[:upper:]' '[:lower:]')
            case "$author_email" in
              *'@aixle.com' | *'@aixle.local' | *'@aixle.bot' | *'@palad.ai')
                echo "skip     $sha (service account: $author_email)"
                continue
                ;;
            esac
            # Every Signed-off-by email in the body, one per line, lowercased.
            signoffs=$(printf '%s\n' "$body" \
              | grep -iE '^[[:space:]]*Signed-off-by:[[:space:]]*.+<.+@.+>' \
              | sed -E 's/.*<([^>]+)>.*/\1/' \
              | tr '[:upper:]' '[:lower:]')

            if [ -z "$signoffs" ]; then
              echo "MISSING  $sha  $(git log -1 --format=%s "$sha")"
              failed=1
            elif printf '%s\n' "$signoffs" | grep -qxF "$author_email"; then
              echo "ok       $sha"
            else
              echo "MISMATCH $sha  author <$author_email> signed off by $(printf '%s' "$signoffs" | tr '\n' ' ')"
              failed=1
            fi
          done < <(git log --reverse -z --format='%H%n%ae%n%an%n%B' "$BASE_SHA..$HEAD_SHA")

          if [ "$failed" -ne 0 ]; then
            cat <<'EOF'

          ─────────────────────────────────────────────────────────────────
          One or more commits are missing a DCO sign-off, or are signed off
          by an email address other than the commit author's.

          Every commit needs a `Signed-off-by:` trailer whose email matches
          the commit author, certifying you have the right to submit the
          code under the project's license. See CONTRIBUTING.md and
          https://developercertificate.org/

          To fix the most recent commit:
              git commit --amend -s --no-edit && git push --force-with-lease

          To fix every commit on this branch:
              git rebase --signoff origin/develop && git push --force-with-lease

          If the sign-off email is right but the author's is not, set
          `git config user.email` and re-run the rebase above.
          ─────────────────────────────────────────────────────────────────
          EOF
            exit 1
          fi

          echo "All commits are signed off by their authors."
