name: CLA

# Blocks merge until the contributor has signed the Individual CLA (CLA.md), or is
# covered by a Corporate CLA (CLA-CORPORATE.md) recorded in the allowlist below.
#
# Signatures are stored as JSON in a separate branch of this repository, so the record
# lives with the project rather than in a third-party service. A contributor signs once
# by commenting the sentence in `custom-pr-sign-comment`; the check then passes for all
# their future PRs.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    # Only run on the signing comment or on PR events — not on every issue comment.
    if: >
      (github.event.issue.pull_request
        && contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA'))
      || github.event_name == 'pull_request_target'
    steps:
      - name: Check CLA signature
        # TODO (engineering): pin to a commit SHA rather than a moving tag before this
        # repository goes public — a mutable third-party tag in a workflow with write
        # permissions is a supply-chain risk.
        uses: contributor-assistant/github-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A PAT is required because the signature file is written to a different
          # branch than the one under test.
          # TODO (engineering): create the CLA_SIGNATURES_TOKEN secret (a fine-grained
          # PAT with contents:write on this repository only) before enabling.
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          branch: cla-signatures
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/palad-ai/palad-app/blob/develop/CLA.md
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-notsigned-prcomment: >
            Thanks for your pull request! Before we can merge it, we need you to sign our
            [Contributor License Agreement](https://github.com/palad-ai/palad-app/blob/develop/CLA.md).
            It is a one-time step and covers all your future contributions.


            To sign, reply to this pull request with exactly:
          custom-allsigned-prcomment: >
            All contributors have signed the CLA. Thank you!
          # Bots and accounts covered by a Corporate CLA on file.
          # TODO (maintainers): as organizations execute the cCLA, add their designated
          # contributors here (cCLA § 6 makes Schedule A administrative, not a condition
          # of the grant — this list is only what tells the bot to stop asking).
          allowlist: dependabot[bot],renovate[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false
