name: Build Extra Images

on:
  push:
    branches:
      - main-images

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 541894707537.dkr.ecr.us-east-1.amazonaws.com
  ECR_ROLE_ARN: arn:aws:iam::541894707537:role/aixle-staging-gha-runner-image-push-role

jobs:
  build-otlp:
    name: Build OTLP Ingest
    runs-on: ${{ vars.CI_RUNNER || 'aixle-staging-ci-runner' }}
    env:
      IMAGE_NAME: aixle-app-otlp-ingest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ECR_ROLE_ARN }}
          role-session-name: aixle-app-otlp-ingest-build
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login_ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=

      - name: Build And Push OTLP Ingest Image
        uses: docker/build-push-action@v6
        with:
          context: ./docker/otlp-ingest
          file: ./docker/otlp-ingest/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

  build-agent-base:
    name: Build Agent Base
    runs-on: ${{ vars.CI_RUNNER || 'aixle-staging-ci-runner' }}
    env:
      IMAGE_NAME: aixle-app-agent-base-core

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ECR_ROLE_ARN }}
          role-session-name: aixle-app-agent-base-build
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login_ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=

      - name: Build And Push Agent Base Core Image
        uses: docker/build-push-action@v6
        with:
          context: ./docker/base
          file: ./docker/base/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

  build-agent-images:
    name: Build ${{ matrix.image_name }}
    runs-on: ${{ vars.CI_RUNNER || 'aixle-staging-ci-runner' }}
    needs: build-agent-base
    strategy:
      matrix:
        include:
          - image_name: Claude Code
            image_suffix: claude-code
            dockerfile: ./docker/claude-code/Dockerfile
          - image_name: Cursor CLI
            image_suffix: cursor-cli
            dockerfile: ./docker/cursor-cli/Dockerfile
          - image_name: Codex
            image_suffix: codex
            dockerfile: ./docker/codex/Dockerfile
          - image_name: Gemini CLI
            image_suffix: gemini-cli
            dockerfile: ./docker/gemini-cli/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute Short SHA
        id: vars
        run: echo "short_sha=$(echo ${GITHUB_SHA} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ECR_ROLE_ARN }}
          role-session-name: aixle-app-${{ matrix.image_suffix }}-build
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login_ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ECR_REGISTRY }}/aixle-app-${{ matrix.image_suffix }}
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=

      - name: Build And Push Image
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ env.ECR_REGISTRY }}/aixle-app-agent-base-core:${{ steps.vars.outputs.short_sha }}
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/aixle-app-${{ matrix.image_suffix }}:buildcache
          cache-to: type=registry,ref=${{ env.ECR_REGISTRY }}/aixle-app-${{ matrix.image_suffix }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
