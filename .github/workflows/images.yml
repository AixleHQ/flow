name: Build Images

# Publishes every runtime image to GHCR, which is free and unmetered for public
# repositories. Deployments consume these published tags; nothing here touches a
# cloud account, so forks and external contributors can read the whole pipeline.

on:
  push:
    # Only the image-release branch publishes. develop is the integration branch
    # and deliberately does not build images: every merge would otherwise
    # republish seven images that nothing is ready to deploy.
    branches:
      - main-images
    tags:
      - "v*"
  # Weekly canary. Three agent CLIs are installed from a vendor script with no version
  # to pin (claude, cursor, kiro), so an image built today and the same Dockerfile built
  # last month are different software — including the parts that do authentication. A
  # scheduled build finds a vendor-side break here, on a Monday morning, rather than in a
  # user's session. It deliberately does NOT move `latest`: it runs off the default
  # branch, publishes only its own dated tags, and promoting a canary stays a human act
  # (push to main-images, or run this workflow by hand from that branch).
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Serialise per ref rather than cancelling: a cancelled publish can leave a tag
# pointing at a half-pushed manifest, so let an in-flight build finish.
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

env:
  # GHCR rejects uppercase path segments, so the owner is written out in
  # lowercase rather than interpolated from github.repository.
  REGISTRY_PREFIX: ghcr.io/aixlehq

jobs:
  web:
    name: Build Web
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_PREFIX }}/flow-web
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main-images' }}
            type=ref,event=branch
            type=sha,format=short,prefix=
            type=semver,pattern={{version}}

      - name: Build And Push Web Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  otlp-ingest:
    name: Build OTLP Ingest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_PREFIX }}/flow-otlp-ingest
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main-images' }}
            type=ref,event=branch
            type=sha,format=short,prefix=
            type=semver,pattern={{version}}

      - name: Build And Push OTLP Ingest Image
        uses: docker/build-push-action@v7
        with:
          context: ./docker/otlp-ingest
          file: ./docker/otlp-ingest/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  agent-base:
    name: Build Agent Base
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Compute Short SHA
        id: vars
        run: echo "short_sha=$(echo ${GITHUB_SHA} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_PREFIX }}/flow-agent-base-core
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main-images' }}
            type=ref,event=branch
            type=sha,format=short,prefix=
            type=semver,pattern={{version}}

      - name: Build And Push Agent Base Core Image
        uses: docker/build-push-action@v7
        with:
          context: ./docker/base
          file: ./docker/base/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  agent-images:
    name: Build ${{ matrix.image_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: agent-base
    strategy:
      matrix:
        include:
          - image_name: Claude Code
            image_suffix: claude-code
            dockerfile: ./docker/claude-code/Dockerfile
          - image_name: Cursor CLI
            image_suffix: cursor-cli
            dockerfile: ./docker/cursor-cli/Dockerfile
          - image_name: Codex
            image_suffix: codex
            dockerfile: ./docker/codex/Dockerfile
          - image_name: Gemini CLI
            image_suffix: gemini-cli
            dockerfile: ./docker/gemini-cli/Dockerfile
          - image_name: Grok CLI
            image_suffix: grok
            dockerfile: ./docker/grok/Dockerfile
          - image_name: Kiro CLI
            image_suffix: kiro-cli
            dockerfile: ./docker/kiro-cli/Dockerfile
          # Was missing entirely until 2026-09-17: the Makefile built it locally and CI
          # never published it, so `AGENT_IMAGE_ANTIGRAVITY_CLI` had no image to point at.
          - image_name: Antigravity CLI
            image_suffix: antigravity-cli
            dockerfile: ./docker/antigravity-cli/Dockerfile

    steps:
      - uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_PREFIX }}/flow-${{ matrix.image_suffix }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main-images' }}
            type=ref,event=branch
            type=sha,format=short,prefix=
            type=semver,pattern={{version}}

      - name: Build And Push Image
        uses: docker/build-push-action@v7
        with:
          context: ./docker
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY_PREFIX }}/flow-agent-base-core:${{ needs.agent-base.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # What this build actually shipped. For the CLIs installed from a vendor script there
      # is no version to pin and therefore nothing else that records which one a published
      # tag contains; comparing two canary runs is how a vendor bump gets noticed, because
      # the image digest changes for a dozen reasons and the CLI version for one.
      #
      # Only on the canary: reading the file means pulling the image back (buildx pushes
      # straight to the registry without keeping it locally), which is a minute per image
      # and not worth paying on every release build.
      - name: Report Shipped CLI Version
        if: github.event_name == 'schedule'
        run: |
          image="${{ env.REGISTRY_PREFIX }}/flow-${{ matrix.image_suffix }}:${{ steps.meta.outputs.version }}"
          version="$(docker run --rm --entrypoint cat "$image" /etc/aixle-cli-version)"
          echo "**${{ matrix.image_name }}** ships CLI version \`${version}\`" >> "$GITHUB_STEP_SUMMARY"
