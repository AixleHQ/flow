name: Build Images

# Publishes every runtime image to GHCR, which is free and unmetered for public
# repositories. Deployments consume these published tags; nothing here touches a
# cloud account, so forks and external contributors can read the whole pipeline.

on:
  push:
    # Only the image-release branch publishes. develop is the integration branch
    # and deliberately does not build images: every merge would otherwise
    # republish seven images that nothing is ready to deploy.
    branches:
      - main-images
    tags:
      - "v*"
  # Weekly canary. It builds the vendors' newest CLI releases — Cursor and Kiro always
  # install their latest, and for the pinned CLIs the canary passes the newest version
  # instead of the pin — so a vendor-side break is found here, on a Monday morning,
  # rather than in a user's session, and a green run says a pin can be raised. It
  # publishes only `canary-YYYYMMDD` — not `latest`, and not the `develop` or commit
  # tags a deployment could pick up — so promoting a canary stays a human act (push to
  # main-images, or run this workflow by hand from that branch).
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Serialise per ref rather than cancelling: a cancelled publish can leave a tag
# pointing at a half-pushed manifest, so let an in-flight build finish.
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

env:
  # GHCR rejects uppercase path segments, so the owner is written out in
  # lowercase rather than interpolated from github.repository.
  REGISTRY_PREFIX: ghcr.io/aixlehq

jobs:
  web:
    name: Build Web
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY_PREFIX }}/flow-web
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main-images' }}
            type=ref,event=branch,enable=${{ github.event_name != 'schedule' }}
            type=sha,format=short,prefix=,enable=${{ github.event_name != 'schedule' }}
            type=semver,pattern={{version}}
            type=schedule,pattern=canary-{{date 'YYYYMMDD'}}

      - name: Build And Push Web Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          # The deployable image; the default (last) stage is the development one.
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  otlp-ingest:
    name: Build OTLP Ingest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY_PREFIX }}/flow-otlp-ingest
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main-images' }}
            type=ref,event=branch,enable=${{ github.event_name != 'schedule' }}
            type=sha,format=short,prefix=,enable=${{ github.event_name != 'schedule' }}
            type=semver,pattern={{version}}
            type=schedule,pattern=canary-{{date 'YYYYMMDD'}}

      - name: Build And Push OTLP Ingest Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./docker/otlp-ingest
          file: ./docker/otlp-ingest/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  agent-base:
    name: Build Agent Base
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute Short SHA
        id: vars
        run: echo "short_sha=$(echo ${GITHUB_SHA} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY_PREFIX }}/flow-agent-base-core
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main-images' }}
            type=ref,event=branch,enable=${{ github.event_name != 'schedule' }}
            type=sha,format=short,prefix=,enable=${{ github.event_name != 'schedule' }}
            type=semver,pattern={{version}}
            type=schedule,pattern=canary-{{date 'YYYYMMDD'}}

      - name: Build And Push Agent Base Core Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./docker/base
          file: ./docker/base/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The build matrix is config/agent_runtimes.json, the same list the app launches
  # runtimes from, so an image can be neither forgotten nor published for a runtime
  # the app does not know.
  runtimes:
    name: Read Runtime Registry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.registry.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: config/agent_runtimes.json
          sparse-checkout-cone-mode: false

      - name: Build Matrix
        id: registry
        run: |
          matrix="$(jq -c '{include: [.runtimes[] | {
            label, image, dockerfile,
            cli_version: (.cli_version // ""),
            latest_npm: (.cli_latest.npm // ""),
            latest_url: (.cli_latest.url // "")
          }]}' config/agent_runtimes.json)"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  agent-images:
    name: Build ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [agent-base, runtimes]
    strategy:
      # Each image stands alone: one vendor's broken release must not cancel the others'
      # builds, or the canary reports every runtime as failed.
      fail-fast: false
      matrix: ${{ fromJSON(needs.runtimes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY_PREFIX }}/flow-${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main-images' }}
            type=ref,event=branch,enable=${{ github.event_name != 'schedule' }}
            type=sha,format=short,prefix=,enable=${{ github.event_name != 'schedule' }}
            type=semver,pattern={{version}}
            type=schedule,pattern=canary-{{date 'YYYYMMDD'}}

      # A release build installs the registry's pin; the canary swaps in the vendor's
      # newest release where the registry names a source for it. Runtimes without a pin
      # (Cursor, Kiro) install the vendor's newest either way.
      - name: Resolve CLI Version
        id: cli
        env:
          PINNED: ${{ matrix.cli_version }}
          LATEST_NPM: ${{ matrix.latest_npm }}
          LATEST_URL: ${{ matrix.latest_url }}
          CANARY: ${{ github.event_name == 'schedule' }}
        run: |
          set -euo pipefail
          version="$PINNED"
          if [ "$CANARY" = "true" ] && [ -n "$LATEST_NPM" ]; then
            version="$(curl -fsSL "https://registry.npmjs.org/${LATEST_NPM}/latest" | jq -r .version)"
          elif [ "$CANARY" = "true" ] && [ -n "$LATEST_URL" ]; then
            version="$(curl -fsSL "$LATEST_URL")"
          fi
          if [ -n "$version" ]; then echo "build_arg=CLI_VERSION=${version}" >> "$GITHUB_OUTPUT"; fi

      - name: Build And Push Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./docker
          file: ./${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY_PREFIX }}/flow-agent-base-core:${{ needs.agent-base.outputs.short_sha }}
            ${{ steps.cli.outputs.build_arg }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # What this build actually shipped. The canary installs the newest releases, so this
      # line — not the registry — says which one a published canary tag contains, and
      # comparing it with the pin is how a vendor bump gets noticed.
      #
      # Only on the canary: reading the file means pulling the image back (buildx pushes
      # straight to the registry without keeping it locally), which is a minute per image
      # and not worth paying on every release build.
      - name: Report Shipped CLI Version
        if: github.event_name == 'schedule'
        run: |
          image="${{ env.REGISTRY_PREFIX }}/flow-${{ matrix.image }}:${{ steps.meta.outputs.version }}"
          version="$(docker run --rm --entrypoint cat "$image" /etc/aixle-cli-version)"
          echo "**${{ matrix.label }}** ships CLI version \`${version}\`" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p shipped && printf '%s\n' "$version" > "shipped/${{ matrix.image }}"

      - name: Hand The Version To The Report
        if: github.event_name == 'schedule'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shipped-${{ matrix.image }}
          path: shipped/${{ matrix.image }}
          retention-days: 7

  # What the canary found, as one issue kept up to date: every pin against the vendor's
  # newest release, what the canary built and whether it built, and the vendor's release
  # notes in between (bin/agent-cli-report; run it locally for the same view). Closed
  # once every pin is current.
  cli-report:
    name: Report CLI Updates
    if: ${{ always() && github.event_name == 'schedule' }}
    needs: agent-images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            config/agent_runtimes.json
            bin/agent-cli-report
          sparse-checkout-cone-mode: false

      - name: Collect Shipped Versions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: shipped-*
          path: shipped
          merge-multiple: true

      - name: Write Report
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          SHIPPED_DIR: shipped
        run: |
          TITLE_TAG="canary-$(date -u +%Y%m%d)" bin/agent-cli-report > "$RUNNER_TEMP/report.md"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Post Report
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: agent-cli-updates
        run: |
          set -euo pipefail
          gh label create "$LABEL" --color 0e8a16 --description "Weekly canary: agent CLI pins behind the vendors" --force >/dev/null
          number="$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number // empty')"
          outdated="$(sed -n 's/^<!-- outdated: \([0-9]*\) -->$/\1/p' "$RUNNER_TEMP/report.md")"
          if [ "${outdated:-0}" -eq 0 ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --comment "Every pinned CLI is on the vendor's newest release."
            fi
          elif [ -n "$number" ]; then
            gh issue edit "$number" --body-file "$RUNNER_TEMP/report.md"
          else
            gh issue create --title "Agent CLI updates available" --label "$LABEL" --body-file "$RUNNER_TEMP/report.md"
          fi
