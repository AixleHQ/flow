name: Retry failed CI

# Auto-retry CI runs that died because a self-hosted runner was lost.
#
# The ARC CI runners live on a Spot-only EKS node group; AWS reclaims or
# rebalances those instances regularly, the node is drained mid-job, and the
# run surfaces as 'failure' OR 'cancelled' with a job-log line
# "The runner has received a shutdown signal" (graceful drain) or
# "... lost communication with the server" (hard reclaim). Infra background:
# aixle-infra doc/cicd/selfhosted-runners.md.
#
# Retry policy:
#   - runner-loss failures/cancellations: up to 2 automatic re-runs.
#     Evictions cluster: on 2026-07-07 a retry was itself killed by the next
#     eviction 25 minutes later (run 28870705458), so one retry is not
#     always enough.
#   - any other 'failure': exactly one re-run (previous behaviour).
#   - 'cancelled' WITHOUT a runner-loss annotation is never retried:
#     concurrency-superseded runs and manual cancellations look like that.
#
# How it works: when a watched workflow finishes, re-run ONLY its failed jobs
# (and their dependents) via `gh run rerun --failed`. This reuses the same run
# id and bumps run_attempt, so a successful retry lets downstream jobs
# (db-migrate / deploy) proceed normally and never double-deploys.
#
# Why a separate watcher workflow at all: GitHub Actions has no native
# job-level retry, and a run cannot re-run itself while it is still in
# progress, so a completed run can only be re-run from the outside.
# workflow_run is the least noisy built-in trigger for that: non-matching
# completions produce a silent 'skipped' run and send no notifications.
#
# NOTE: this file must live on the DEFAULT branch (develop) — workflow_run only
# triggers from the default branch's copy. It will not fire from feature/PR
# branches, but it watches runs from every branch.

on:
  workflow_run:
    workflows:
      - Deploy aixle domains
      - Build Extra Images
    types:
      - completed

permissions:
  actions: write # `gh run rerun` needs write; job-log reads are covered by it
  contents: read

# One retry job per source run; never cancel an in-flight retry.
concurrency:
  group: retry-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  rerun-failed:
    name: Re-run failed jobs
    # Pure gh-CLI job: pin a GitHub-hosted runner so the retry path does NOT
    # depend on the (possibly unhealthy) self-hosted runner pool whose failures
    # it is meant to absorb. Do not use vars.CI_RUNNER here.
    runs-on: ubuntu-latest
    # Widest gate any retry could need (runner loss gets up to attempt 3).
    # The exact per-conclusion policy is decided in the steps below, where job
    # annotations can be inspected; everything else stays 'skipped' and silent.
    if: >-
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'cancelled') &&
      github.event.workflow_run.run_attempt < 3
    steps:
      - name: Decide whether to re-run
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          # A job whose runner pod was evicted (Spot drain/reclaim) has one of
          # the messages below in its log. Detection must use full job logs:
          # check-run annotations only carry the generic "The operation was
          # canceled." line, which manual cancellations produce too (verified
          # against runs 28870529546 / 28870705458 on 2026-07-07).
          runner_lost=false
          for job_id in $(gh api "repos/${GH_REPO}/actions/runs/${RUN_ID}/attempts/${ATTEMPT}/jobs" \
              --paginate -q '.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled") | .id'); do
            if gh api "repos/${GH_REPO}/actions/jobs/${job_id}/logs" 2>/dev/null \
                | grep -Eq 'runner has received a shutdown signal|lost communication with the server'; then
              runner_lost=true
              break
            fi
          done

          rerun=false
          if [ "$runner_lost" = true ]; then
            # attempt < 3 is already guaranteed by the job-level `if`
            rerun=true
          elif [ "$CONCLUSION" = "failure" ] && [ "$ATTEMPT" -lt 2 ]; then
            # non-runner-loss failures keep the original single retry
            rerun=true
          fi

          echo "runner_lost=${runner_lost}"
          echo "runner_lost=${runner_lost}" >> "$GITHUB_OUTPUT"
          echo "rerun=${rerun}" >> "$GITHUB_OUTPUT"

      - name: Re-run failed jobs
        if: steps.decide.outputs.rerun == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          echo "Re-running failed jobs for run ${RUN_ID} (attempt ${ATTEMPT}, runner_lost=${{ steps.decide.outputs.runner_lost }})"
          echo "Source: ${SOURCE_URL}"
          # Don't fail this workflow if the rerun is rejected (run older than
          # 30 days, or the 50-rerun-per-run cap reached).
          gh run rerun "$RUN_ID" --failed \
            || echo "::warning::gh run rerun was rejected (run too old or rerun cap reached)"
