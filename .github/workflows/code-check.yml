name: Code Check

on:
  workflow_call:
    inputs:
      command:
        required: true
        type: string
      needs-db:
        required: false
        type: boolean
        default: false
      run-coverage:
        # Coverage gate: "1" = run coverage, "0" = skip. Empty (the default)
        # leaves it to the Makefile, which defaults to on.
        required: false
        type: string
        default: ""
      timeout:
        required: false
        type: number
        default: 30
      shard-artifact:
        # Name to upload this shard's raw coverage (coverage/shards/) under, for a later
        # job with merge-coverage. Empty uploads nothing.
        required: false
        type: string
        default: ""
      merge-coverage:
        # Downloads every coverage-shard-* artifact of the run into coverage/shards/
        # before the check.
        required: false
        type: boolean
        default: false
      coverage-report:
        # Name to upload the coverage reports under (coverage/ without the shards).
        # Empty uploads nothing.
        required: false
        type: string
        default: ""
      coverage-summary:
        # The line-coverage summaries this job must produce: backend, frontend or both.
        # A requested summary that is missing fails the job. Empty reads none.
        required: false
        type: string
        default: ""
    outputs:
      backend-line-coverage:
        description: >-
          Backend line coverage this run measured, as a bare number ("93.7").
          Empty unless coverage-summary asked for it.
        value: ${{ jobs.check.outputs.backend-line-coverage }}
      frontend-line-coverage:
        description: >-
          Frontend line coverage this run measured, as a bare number ("85.1").
          Empty unless coverage-summary asked for it.
        value: ${{ jobs.check.outputs.frontend-line-coverage }}

permissions:
  contents: read

env:
  COMPOSE_FILE: docker-compose.ci.yml
  # Written by ci.yml's build-cache job on develop pushes; read here, read-only,
  # by every run including forks'. Kept in step with the ref in that workflow.
  BUILD_CACHE: ghcr.io/aixlehq/flow-buildcache:web

jobs:
  check:
    name: Run
    # Deliberately pinned to GitHub-hosted runners. This repository is public,
    # so a self-hosted runner would execute arbitrary fork-PR code inside our
    # network. Public repositories also get unmetered standard-runner minutes.
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout }}
    env:
      RAILS_ENV: test
    outputs:
      backend-line-coverage: ${{ steps.line-coverage.outputs.backend }}
      frontend-line-coverage: ${{ steps.line-coverage.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable the containerd image store
        # `load: true` below is the single most expensive thing in this job, and
        # none of it is compilation. With the runner's stock daemon every layer
        # resolves from cache in seconds, and then handing the 1.45 GB image to
        # the daemon costs ~100s (31254450213: 97.8s backend, 102.8s frontend) —
        # a tarball serialised out of buildkit and unpacked layer by layer back
        # in. Writing OCI mediatypes into the containerd store drops the unpack
        # stage entirely and halves what remains: 69.6s and 60.4s on 31258372193.
        #
        # Patching the daemon rather than reinstalling it with
        # docker/setup-docker-action: the runner image already ships Docker with
        # the Compose plugin that the steps below rely on, and reinstalling from
        # a release channel would put both back in play to save nothing.
        # Ordered before the buildx setup, which starts a builder container on
        # this daemon.
        run: |
          set -euo pipefail

          config=$(sudo cat /etc/docker/daemon.json 2>/dev/null || echo '{}')
          jq '.features["containerd-snapshotter"] = true' <<<"$config" > /tmp/daemon.json
          sudo mv /tmp/daemon.json /etc/docker/daemon.json
          sudo systemctl restart docker

          # The store swap hides images pulled beforehand. Nothing in this job
          # pulls before this point, so the assertion is just a tripwire for a
          # future step being added above it.
          docker info --format '{{.DriverStatus}}'

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Pull docker.io base images through Google's mirror to avoid Docker
          # Hub's anonymous pull rate limit on CI runners (shared egress IPs).
          # FROM lines stay on docker.io, so Dependabot keeps tracking them.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Build test image
        # Materialised here rather than pulled whole from a registry: the image
        # has to be available to fork pull requests, which get a read-only token
        # and so cannot be handed a run-scoped tag someone pushed for them. Its
        # layers do come from a registry — everything up to `COPY . /app` is
        # imported from the cache the last develop push wrote, leaving this job
        # to build only the handful of layers that changed with the commit.
        #
        # Read-only on purpose, no cache-to. Two check jobs writing one cache in
        # parallel cannot warm each other, and ci.yml's build-cache job already
        # owns the write.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: web
          build-args: |
            APP_VERSION=ci
          # No login step: the package is public, so this reads anonymously and
          # a fork's run gets the same cache. Until the package is made public
          # after its first push, or if it is ever unreachable, buildx warns and
          # builds from scratch — a cache miss here is slow, never fatal.
          cache-from: type=registry,ref=${{ env.BUILD_CACHE }}

      - name: Start database
        if: ${{ inputs.needs-db }}
        run: docker compose -f "$COMPOSE_FILE" up -d db

      - name: Wait for database
        if: ${{ inputs.needs-db }}
        run: |
          until docker compose -f "$COMPOSE_FILE" exec -T db pg_isready -U postgres; do sleep 1; done

      - name: Prepare database
        if: ${{ inputs.needs-db }}
        run: docker compose -f "$COMPOSE_FILE" run --rm --no-deps web bundle exec rails db:create db:migrate

      - name: Download shard coverage
        if: ${{ inputs.merge-coverage }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-shard-*
          path: coverage/shards
          merge-multiple: true

      - name: Run check
        env:
          # Forwarded into the container by docker-compose.ci.yml (RUN_COVERAGE).
          RUN_COVERAGE: ${{ inputs.run-coverage }}
        run: |
          mounts=()

          # SimpleCov and Vitest write their results inside the container, and
          # `docker compose run` leaves nothing behind. Mount the directory out
          # so the steps below can read and upload them.
          if [ "$RUN_COVERAGE" = "1" ]; then
            mkdir -p coverage
            chmod 777 coverage
            mounts+=(-v "$GITHUB_WORKSPACE/coverage:/app/coverage")
          fi

          docker compose -f "$COMPOSE_FILE" run --rm --no-deps \
            "${mounts[@]}" web make ${{ inputs.command }}

      - name: Read line coverage
        id: line-coverage
        # Runs even when the check failed: a red suite still measured coverage,
        # and the badge job only publishes on green develop pushes anyway.
        if: ${{ always() && inputs.coverage-summary != '' }}
        env:
          WANTED: ${{ inputs.coverage-summary }}
        run: |
          missing=0

          if [ "$WANTED" = "backend" ] || [ "$WANTED" = "both" ]; then
            if [ -f coverage/.last_run.json ]; then
              backend=$(jq -r '.result.line' coverage/.last_run.json)
              echo "Backend line coverage: $backend%"
              echo "backend=$backend" >> "$GITHUB_OUTPUT"
            else
              # No summary means no coverage floor was checked either: Rails 8.1.4
              # with simplecov 1.3.1 skipped both and still exited 0 (simplecov#1308).
              echo "::error::backend coverage was requested but no summary file was produced"
              missing=1
            fi
          fi

          if [ "$WANTED" = "frontend" ] || [ "$WANTED" = "both" ]; then
            if [ -f coverage/frontend/coverage-summary.json ]; then
              frontend=$(jq -r '.total.lines.pct' coverage/frontend/coverage-summary.json)
              echo "Frontend line coverage: $frontend%"
              echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
            else
              echo "::error::frontend coverage was requested but no summary file was produced"
              missing=1
            fi
          fi

          exit "$missing"

      - name: Upload shard coverage
        # A failed shard still measured coverage; the merge needs every shard's part.
        if: ${{ always() && inputs.shard-artifact != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.shard-artifact }}
          path: coverage/shards
          retention-days: 1
          if-no-files-found: error

      - name: Upload coverage report
        if: ${{ always() && inputs.coverage-report != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.coverage-report }}
          path: |
            coverage
            !coverage/shards
          include-hidden-files: true
          retention-days: 14

      - name: Tear down
        if: ${{ always() && inputs.needs-db }}
        run: docker compose -f "$COMPOSE_FILE" down --volumes --remove-orphans
