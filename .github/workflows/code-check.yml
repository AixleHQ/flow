name: Code Check

on:
  workflow_call:
    inputs:
      command:
        required: true
        type: string
      needs-db:
        required: false
        type: boolean
        default: false
      run-coverage:
        # Coverage gate: "1" = run coverage, "0" = skip. Empty (the default)
        # leaves it to the Makefile, which defaults to on.
        required: false
        type: string
        default: ""
      timeout:
        required: false
        type: number
        default: 30
      artifact-path:
        required: false
        type: string
        default: ""
      artifact-name:
        required: false
        type: string
        default: "check-artifacts"

permissions:
  contents: read

env:
  COMPOSE_FILE: docker-compose.ci.yml

jobs:
  check:
    name: Run
    # Deliberately pinned to GitHub-hosted runners. This repository is public,
    # so a self-hosted runner would execute arbitrary fork-PR code inside our
    # network. Public repositories also get unmetered standard-runner minutes.
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout }}
    env:
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # Pull docker.io base images through Google's mirror to avoid Docker
          # Hub's anonymous pull rate limit on CI runners (shared egress IPs).
          # FROM lines stay on docker.io, so Dependabot keeps tracking them.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Build test image
        # Built here rather than pulled from a registry: the image must be
        # available to fork pull requests, which get no registry credentials.
        # The layer cache is shared with the other check job through type=gha.
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: web
          build-args: |
            APP_VERSION=ci
            AUTHOR_NAME=github-actions
            AUTHOR_EMAIL=github-actions@users.noreply.github.com
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start database
        if: ${{ inputs.needs-db }}
        run: docker compose -f "$COMPOSE_FILE" up -d db

      - name: Wait for database
        if: ${{ inputs.needs-db }}
        run: |
          until docker compose -f "$COMPOSE_FILE" exec -T db pg_isready -U postgres; do sleep 1; done

      - name: Prepare database
        if: ${{ inputs.needs-db }}
        run: docker compose -f "$COMPOSE_FILE" run --rm --no-deps web bundle exec rails db:create db:migrate

      - name: Run check
        env:
          # Forwarded into the container by docker-compose.ci.yml (RUN_COVERAGE).
          RUN_COVERAGE: ${{ inputs.run-coverage }}
        run: |
          ARTIFACT_PATH="${{ inputs.artifact-path }}"
          if [ -n "$ARTIFACT_PATH" ]; then
            mkdir -p "$ARTIFACT_PATH"
            # web runs as the non-root `app` user (L-22), whose uid won't match
            # the runner's uid that owns this freshly-created host directory.
            # Ephemeral, single-job runner — world-writable is fine here.
            chmod 777 "$ARTIFACT_PATH"
            docker compose -f "$COMPOSE_FILE" run --rm --no-deps \
              -v "$GITHUB_WORKSPACE/$ARTIFACT_PATH:/app/$ARTIFACT_PATH" \
              web make ${{ inputs.command }}
          else
            docker compose -f "$COMPOSE_FILE" run --rm --no-deps web make ${{ inputs.command }}
          fi

      - name: Upload artifacts
        if: ${{ inputs.artifact-path != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}
          retention-days: 30

      - name: Tear down
        if: ${{ always() && inputs.needs-db }}
        run: docker compose -f "$COMPOSE_FILE" down --volumes --remove-orphans
