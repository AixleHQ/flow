name: Code Check

on:
  workflow_call:
    inputs:
      command:
        required: true
        type: string
      needs-db:
        required: false
        type: boolean
        default: false
      run-coverage:
        # Coverage gate: "1" = run coverage, "0" = skip. Empty (the default)
        # leaves it to the Makefile, which defaults to on.
        required: false
        type: string
        default: ""
      timeout:
        required: false
        type: number
        default: 30
      artifact-path:
        required: false
        type: string
        default: ""
      artifact-name:
        required: false
        type: string
        default: "check-artifacts"
    outputs:
      line-coverage:
        description: >-
          Line coverage percentage this run measured, as a bare number
          ("90.6"). Empty unless run-coverage was "1".
        value: ${{ jobs.check.outputs.line-coverage }}

permissions:
  contents: read

env:
  COMPOSE_FILE: docker-compose.ci.yml

jobs:
  check:
    name: Run
    # Deliberately pinned to GitHub-hosted runners. This repository is public,
    # so a self-hosted runner would execute arbitrary fork-PR code inside our
    # network. Public repositories also get unmetered standard-runner minutes.
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout }}
    env:
      RAILS_ENV: test
    outputs:
      line-coverage: ${{ steps.line-coverage.outputs.percent }}
    steps:
      - uses: actions/checkout@v7

      - name: Enable the containerd image store
        # `load: true` below is the single most expensive thing in this job, and
        # none of it is compilation. With the runner's stock daemon every layer
        # resolves from cache in seconds, and then handing the 1.45 GB image to
        # the daemon costs ~100s (31254450213: 97.8s backend, 102.8s frontend) —
        # a tarball serialised out of buildkit and unpacked layer by layer back
        # in. Writing OCI mediatypes into the containerd store drops the unpack
        # stage entirely and halves what remains: 69.6s and 60.4s on 31258372193.
        #
        # Patching the daemon rather than reinstalling it with
        # docker/setup-docker-action: the runner image already ships Docker with
        # the Compose plugin that the steps below rely on, and reinstalling from
        # a release channel would put both back in play to save nothing.
        # Ordered before the buildx setup, which starts a builder container on
        # this daemon.
        run: |
          set -euo pipefail

          config=$(sudo cat /etc/docker/daemon.json 2>/dev/null || echo '{}')
          jq '.features["containerd-snapshotter"] = true' <<<"$config" > /tmp/daemon.json
          sudo mv /tmp/daemon.json /etc/docker/daemon.json
          sudo systemctl restart docker

          # The store swap hides images pulled beforehand. Nothing in this job
          # pulls before this point, so the assertion is just a tripwire for a
          # future step being added above it.
          docker info --format '{{.DriverStatus}}'

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # Pull docker.io base images through Google's mirror to avoid Docker
          # Hub's anonymous pull rate limit on CI runners (shared egress IPs).
          # FROM lines stay on docker.io, so Dependabot keeps tracking them.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Build test image
        # Materialised here rather than pulled from a registry: the image must be
        # available to fork pull requests, which get no registry credentials. The
        # layers themselves come from the cache that ci.yml's build-image job wrote
        # earlier in this run, so this is a load rather than a real build.
        #
        # Read-only on purpose — no cache-to. Two check jobs writing the same
        # `type=gha` scope in parallel is what made the cache useless before, and it
        # churns the repository's 10 GB cache budget for no gain.
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: web
          build-args: |
            APP_VERSION=ci
            AUTHOR_NAME=github-actions
            AUTHOR_EMAIL=github-actions@users.noreply.github.com
          cache-from: type=gha

      - name: Start database
        if: ${{ inputs.needs-db }}
        run: docker compose -f "$COMPOSE_FILE" up -d db

      - name: Wait for database
        if: ${{ inputs.needs-db }}
        run: |
          until docker compose -f "$COMPOSE_FILE" exec -T db pg_isready -U postgres; do sleep 1; done

      - name: Prepare database
        if: ${{ inputs.needs-db }}
        run: docker compose -f "$COMPOSE_FILE" run --rm --no-deps web bundle exec rails db:create db:migrate

      - name: Run check
        env:
          # Forwarded into the container by docker-compose.ci.yml (RUN_COVERAGE).
          RUN_COVERAGE: ${{ inputs.run-coverage }}
        run: |
          mounts=()

          ARTIFACT_PATH="${{ inputs.artifact-path }}"
          if [ -n "$ARTIFACT_PATH" ]; then
            mkdir -p "$ARTIFACT_PATH"
            # web runs as the non-root `app` user (L-22), whose uid won't match
            # the runner's uid that owns this freshly-created host directory.
            # Ephemeral, single-job runner — world-writable is fine here.
            chmod 777 "$ARTIFACT_PATH"
            mounts+=(-v "$GITHUB_WORKSPACE/$ARTIFACT_PATH:/app/$ARTIFACT_PATH")
          fi

          # SimpleCov and Vitest write their summaries inside the container, and
          # `docker compose run` leaves nothing behind. Mount the directory out
          # so the next step can read the percentage for the coverage badges.
          if [ "$RUN_COVERAGE" = "1" ]; then
            mkdir -p coverage
            chmod 777 coverage
            mounts+=(-v "$GITHUB_WORKSPACE/coverage:/app/coverage")
          fi

          docker compose -f "$COMPOSE_FILE" run --rm --no-deps \
            "${mounts[@]}" web make ${{ inputs.command }}

      - name: Read line coverage
        id: line-coverage
        # Runs even when the check failed: a red suite still measured coverage,
        # and the badge job only publishes on green develop pushes anyway.
        if: ${{ always() && inputs.run-coverage == '1' }}
        run: |
          # A job runs either the backend suite or the frontend one, never both,
          # so exactly one of these summaries exists.
          if [ -f coverage/.last_run.json ]; then
            percent=$(jq -r '.result.line' coverage/.last_run.json)
          elif [ -f coverage/frontend/coverage-summary.json ]; then
            percent=$(jq -r '.total.lines.pct' coverage/frontend/coverage-summary.json)
          else
            echo "::warning::coverage was requested but no summary file was produced"
            exit 0
          fi

          echo "Line coverage: $percent%"
          echo "percent=$percent" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        if: ${{ inputs.artifact-path != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}
          retention-days: 30

      - name: Tear down
        if: ${{ always() && inputs.needs-db }}
        run: docker compose -f "$COMPOSE_FILE" down --volumes --remove-orphans
