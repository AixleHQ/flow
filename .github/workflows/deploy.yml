name: Deploy palad.ai

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ${{ github.repository }}-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login To GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=

      - name: Build And Push Web Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.sha }}
            AUTHOR_NAME=${{ github.actor }}
            AUTHOR_EMAIL=${{ github.actor }}@users.noreply.github.com
            ASSET_HOST=https://static.palad.ai
          cache-from: type=gha,scope=web-image
          cache-to: type=gha,mode=max,scope=web-image

  # ---------------------------------------------------------------------------
  # Checks (parallel, via reusable workflow)
  # ---------------------------------------------------------------------------
  be-test:
    name: Backend Tests
    needs: build-web
    uses: ./.github/workflows/code-check.yml
    with:
      command: rails-test
      needs-db: true
      timeout: 20
    secrets: inherit

  be-lint:
    name: Backend Lint
    needs: build-web
    uses: ./.github/workflows/code-check.yml
    with:
      command: rubocop
    secrets: inherit

  be-security:
    name: Backend Security
    needs: build-web
    uses: ./.github/workflows/code-check.yml
    with:
      command: brakeman
    secrets: inherit

  fe-lint:
    name: Frontend Lint
    needs: build-web
    uses: ./.github/workflows/code-check.yml
    with:
      command: eslint
    secrets: inherit

  fe-typecheck:
    name: Frontend Typecheck
    needs: build-web
    uses: ./.github/workflows/code-check.yml
    with:
      command: typescript
    secrets: inherit

  fe-fsd:
    name: Frontend FSD
    needs: build-web
    uses: ./.github/workflows/code-check.yml
    with:
      command: fsd
    secrets: inherit

  # ---------------------------------------------------------------------------
  # Build supporting images (after all checks pass)
  # ---------------------------------------------------------------------------
  build-otlp:
    name: Build OTLP Ingest
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [be-test, be-lint, be-security, fe-lint, fe-typecheck, fe-fsd]
    env:
      IMAGE_NAME: ${{ github.repository }}-otlp-ingest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login To GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=

      - name: Build And Push OTLP Ingest Image
        uses: docker/build-push-action@v6
        with:
          context: ./docker/otlp-ingest
          file: ./docker/otlp-ingest/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=otlp-ingest-image
          cache-to: type=gha,mode=max,scope=otlp-ingest-image

  build-agent-base:
    name: Build Agent Base
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [be-test, be-lint, be-security, fe-lint, fe-typecheck, fe-fsd]
    env:
      BASE_IMAGE_NAME: ${{ github.repository }}-agent-base-core

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login To GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Base Docker Metadata
        id: meta_base
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=

      - name: Build And Push Agent Base Core Image
        uses: docker/build-push-action@v6
        with:
          context: ./docker/base
          file: ./docker/base/Dockerfile.core
          push: true
          tags: ${{ steps.meta_base.outputs.tags }}
          labels: ${{ steps.meta_base.outputs.labels }}
          cache-from: type=gha,scope=agent-base-core-image
          cache-to: type=gha,mode=max,scope=agent-base-core-image

  build-agent-images:
    name: Build ${{ matrix.image_name }}
    runs-on: ubuntu-latest
    needs: build-agent-base
    strategy:
      matrix:
        include:
          - image_name: Claude Code
            image_suffix: claude-code
            dockerfile: ./docker/claude-code/Dockerfile
            cache_scope: claude-code-image
          - image_name: Cursor CLI
            image_suffix: cursor-cli
            dockerfile: ./docker/cursor-cli/Dockerfile
            cache_scope: cursor-cli-image
          - image_name: Codex
            image_suffix: codex
            dockerfile: ./docker/codex/Dockerfile
            cache_scope: codex-image
          - image_name: Gemini CLI
            image_suffix: gemini-cli
            dockerfile: ./docker/gemini-cli/Dockerfile
            cache_scope: gemini-cli-image
    env:
      BASE_IMAGE_NAME: ${{ github.repository }}-agent-base-core

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute Short SHA
        id: vars
        run: echo "short_sha=$(echo ${GITHUB_SHA} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login To GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.image_suffix }}
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=

      - name: Build And Push Image
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}:${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}

  # ---------------------------------------------------------------------------
  # Deploy
  # ---------------------------------------------------------------------------
  db-migrate:
    name: DB Migrate
    if: github.ref == 'refs/heads/main'
    runs-on: palad-deploy-runner
    environment: production
    needs:
      - build-web
      - build-otlp
      - build-agent-images
    env:
      KUBE_NAMESPACE: palad

    steps:
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Create migration job
        id: migrate_job
        run: |
          SHORT_SHA="$(echo "$GITHUB_SHA" | cut -c1-7)"
          JOB_NAME="db-migrate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          WEB_IMAGE="${REGISTRY}/${GITHUB_REPOSITORY}-web:${SHORT_SHA}"

          cat <<EOF | kubectl -n "$KUBE_NAMESPACE" apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ${JOB_NAME}
          spec:
            ttlSecondsAfterFinished: 3600
            backoffLimit: 0
            template:
              spec:
                serviceAccountName: palad-web
                restartPolicy: Never
                containers:
                  - name: migrate
                    image: ${WEB_IMAGE}
                    imagePullPolicy: Always
                    command: ["bundle", "exec", "rails", "db:migrate"]
                    envFrom:
                      - configMapRef:
                          name: palad-app-config
                      - secretRef:
                          name: palad-app-secrets
          EOF

          echo "job_name=${JOB_NAME}" >> "$GITHUB_OUTPUT"

      - name: Wait for migration completion
        run: |
          kubectl -n "$KUBE_NAMESPACE" wait --for=condition=complete --timeout=20m "job/${{ steps.migrate_job.outputs.job_name }}"

      - name: Migration logs
        if: always()
        run: |
          kubectl -n "$KUBE_NAMESPACE" logs "job/${{ steps.migrate_job.outputs.job_name }}" --all-containers=true --tail=-1 || true

      - name: Cleanup migration job
        if: always()
        run: |
          kubectl -n "$KUBE_NAMESPACE" delete "job/${{ steps.migrate_job.outputs.job_name }}" --ignore-not-found=true

  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/main'
    runs-on: palad-deploy-runner
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    needs:
      - db-migrate
    env:
      KUBE_NAMESPACE: palad

    steps:
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Restart deployments
        run: |
          kubectl -n "$KUBE_NAMESPACE" rollout restart deployment/web deployment/worker-ruby deployment/mcp

      - name: Wait for rollout
        run: |
          kubectl -n "$KUBE_NAMESPACE" rollout status deployment/web --timeout=10m
          kubectl -n "$KUBE_NAMESPACE" rollout status deployment/worker-ruby --timeout=10m
          kubectl -n "$KUBE_NAMESPACE" rollout status deployment/mcp --timeout=10m

  # ---------------------------------------------------------------------------
  # Post-deploy: upload source maps to Sentry
  # ---------------------------------------------------------------------------
  sentry-sourcemaps:
    name: Sentry Source Maps
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref_name == 'main'
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract source maps from image
        run: |
          SHORT_SHA="$(echo "$GITHUB_SHA" | cut -c1-7)"
          docker pull "${REGISTRY}/${GITHUB_REPOSITORY}-web:${SHORT_SHA}"
          CONTAINER_ID=$(docker create "${REGISTRY}/${GITHUB_REPOSITORY}-web:${SHORT_SHA}")
          mkdir -p sourcemaps
          docker cp "$CONTAINER_ID:/app/public/vite/" ./sourcemaps/ || true
          docker rm "$CONTAINER_ID"

      - name: Upload to Sentry
        run: |
          npx @sentry/cli releases new "${{ github.sha }}"
          npx @sentry/cli releases files "${{ github.sha }}" upload-sourcemaps ./sourcemaps/ --url-prefix "~/vite/"
          npx @sentry/cli releases finalize "${{ github.sha }}"
          npx @sentry/cli releases deploys "${{ github.sha }}" new -e production
