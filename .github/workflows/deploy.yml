name: Deploy aixle domains

on:
  push:
    branches-ignore:
      - main-images
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 541894707537.dkr.ecr.us-east-1.amazonaws.com
  ECR_ROLE_ARN: arn:aws:iam::541894707537:role/aixle-staging-gha-runner-image-push-role

jobs:
  prepare-config:
    name: Prepare Config
    runs-on: ubuntu-latest
    outputs:
      asset_host: ${{ steps.config.outputs.asset_host }}
      raw_tag: ${{ steps.config.outputs.raw_tag }}
      sha_prefix: ${{ steps.config.outputs.sha_prefix }}
      cache_ref: ${{ steps.config.outputs.cache_ref }}
      ci_runner: ${{ steps.config.outputs.ci_runner }}
      deploy_environment: ${{ steps.config.outputs.deploy_environment }}
      kube_namespace: ${{ steps.config.outputs.kube_namespace }}
      job_prefix: ${{ steps.config.outputs.job_prefix }}
      web_image_tag: ${{ steps.config.outputs.web_image_tag }}
      deploy_runner: ${{ steps.config.outputs.deploy_runner }}
      service_account: ${{ steps.config.outputs.service_account }}
      configmap_name: ${{ steps.config.outputs.configmap_name }}
      secret_name: ${{ steps.config.outputs.secret_name }}
    steps:
      - name: Compute Workflow Config
        id: config
        env:
          DEFAULT_CI_RUNNER: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
          DEFAULT_DEPLOY_RUNNER: ${{ vars.DEPLOY_RUNNER || 'ubuntu-latest' }}
        run: |
          SHORT_SHA="$(echo "$GITHUB_SHA" | cut -c1-7)"
          cache_ref="${ECR_REGISTRY}/aixle-app-web:buildcache-dev"
          asset_host="https://static.flow.aixle.com"
          raw_tag="latest"
          sha_prefix=""
          ci_runner="$DEFAULT_CI_RUNNER"
          deploy_environment="development"
          kube_namespace="aixle-dev"
          job_prefix="db-migrate-dev"
          web_image_tag="${SHORT_SHA}"
          deploy_runner="$DEFAULT_DEPLOY_RUNNER"
          service_account="aixle-web"
          configmap_name="aixle-app-config"
          secret_name="aixle-app-secrets"

          case "${GITHUB_REF}" in
            refs/heads/staging)
              asset_host="https://staging.flow.aixle.com"
              raw_tag="staging"
              sha_prefix="staging-"
              cache_ref="${ECR_REGISTRY}/aixle-app-web:buildcache-staging"
              deploy_environment="staging"
              kube_namespace="aixle-staging"
              job_prefix="db-migrate-staging"
              web_image_tag="staging-${SHORT_SHA}"
              deploy_runner="aixle-staging-runner"
              ;;
            refs/heads/main)
              cache_ref="${ECR_REGISTRY}/aixle-app-web:buildcache-main"
              raw_tag="main"
              deploy_environment="production"
              deploy_runner="aixle-prod-runner"
              kube_namespace="aixle-prod"
              job_prefix="db-migrate"
              ;;
          esac

          cat <<EOF >> "$GITHUB_OUTPUT"
          asset_host=${asset_host}
          raw_tag=${raw_tag}
          sha_prefix=${sha_prefix}
          cache_ref=${cache_ref}
          ci_runner=${ci_runner}
          deploy_environment=${deploy_environment}
          kube_namespace=${kube_namespace}
          job_prefix=${job_prefix}
          web_image_tag=${web_image_tag}
          deploy_runner=${deploy_runner}
          service_account=${service_account}
          configmap_name=${configmap_name}
          secret_name=${secret_name}
          EOF

  build-web:
    name: Build Web
    needs: prepare-config
    runs-on: ${{ needs.prepare-config.outputs.ci_runner }}
    env:
      IMAGE_NAME: aixle-app-web

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # Pull docker.io base images (e.g. ruby:4.0.5-alpine) through Google's
          # mirror to avoid Docker Hub's anonymous pull rate limit on CI runners.
          # FROM lines stay on docker.io, so Dependabot keeps tracking them.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.ECR_ROLE_ARN }}
          role-session-name: aixle-app-web-build
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login_ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.prepare-config.outputs.raw_tag }}
            type=sha,format=short,prefix=${{ needs.prepare-config.outputs.sha_prefix }}

      - name: Build And Push Web Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.sha }}
            AUTHOR_NAME=${{ github.actor }}
            AUTHOR_EMAIL=${{ github.actor }}@users.noreply.github.com
            ASSET_HOST=${{ needs.prepare-config.outputs.asset_host }}
          cache-from: type=registry,ref=${{ needs.prepare-config.outputs.cache_ref }}
          cache-to: type=registry,ref=${{ needs.prepare-config.outputs.cache_ref }},mode=max,image-manifest=true,oci-mediatypes=true

  # ---------------------------------------------------------------------------
  # Checks (frontend and backend run as SEPARATE jobs, on separate runners, in
  # parallel — so Vitest never competes with the Ruby suite for CPU. Each job
  # never short-circuits, prints the full log of every failed check, and exits
  # non-zero if any one fails. See the be_check_all / fe_check_all Makefile targets.)
  # ---------------------------------------------------------------------------
  be-checks:
    name: Backend Checks
    needs:
      - prepare-config
      - build-web
    uses: ./.github/workflows/code-check.yml
    with:
      # rails-test + rubocop + brakeman (Ruby). Needs the DB for the Rails test suite.
      command: be_check_all
      runner: ${{ needs.prepare-config.outputs.ci_runner }}
      needs-db: true
      timeout: 25
      image-tag: ${{ needs.prepare-config.outputs.web_image_tag }}
    secrets: inherit

  fe-checks:
    name: Frontend Checks
    needs:
      - prepare-config
      - build-web
    uses: ./.github/workflows/code-check.yml
    with:
      # eslint + tsc, then Vitest on its own (backendless, no DB needed).
      command: fe_check_all
      runner: ${{ needs.prepare-config.outputs.ci_runner }}
      needs-db: false
      timeout: 20
      image-tag: ${{ needs.prepare-config.outputs.web_image_tag }}
    secrets: inherit

  license-report:
    name: License Reports
    needs:
      - prepare-config
      - build-web
    uses: ./.github/workflows/code-check.yml
    with:
      command: license-report
      runner: ${{ needs.prepare-config.outputs.ci_runner }}
      image-tag: ${{ needs.prepare-config.outputs.web_image_tag }}
      artifact-path: tmp/license-reports
      artifact-name: license-reports
      timeout: 15
    secrets: inherit

  # ---------------------------------------------------------------------------
  # Deploy
  # ---------------------------------------------------------------------------
  db-migrate:
    name: DB Migrate
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    runs-on: ${{ needs.prepare-config.outputs.deploy_runner }}
    environment: ${{ needs.prepare-config.outputs.deploy_environment }}
    needs:
      - prepare-config
      - build-web
      - be-checks
      - fe-checks
    env:
      KUBE_NAMESPACE: ${{ needs.prepare-config.outputs.kube_namespace }}
      SERVICE_ACCOUNT: ${{ needs.prepare-config.outputs.service_account }}
      CONFIGMAP_NAME: ${{ needs.prepare-config.outputs.configmap_name }}
      SECRET_NAME: ${{ needs.prepare-config.outputs.secret_name }}

    steps:
      - name: Setup kubectl
        uses: azure/setup-kubectl@v5

      - name: Create migration job
        id: migrate_job
        run: |
          JOB_PREFIX="${{ needs.prepare-config.outputs.job_prefix }}"
          WEB_IMAGE_TAG="${{ needs.prepare-config.outputs.web_image_tag }}"
          JOB_NAME="${JOB_PREFIX}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          WEB_IMAGE="${ECR_REGISTRY}/aixle-app-web:${WEB_IMAGE_TAG}"

          cat <<EOF | kubectl -n "$KUBE_NAMESPACE" apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ${JOB_NAME}
          spec:
            ttlSecondsAfterFinished: 3600
            backoffLimit: 0
            template:
              spec:
                serviceAccountName: ${SERVICE_ACCOUNT}
                restartPolicy: Never
                containers:
                  - name: migrate
                    image: ${WEB_IMAGE}
                    imagePullPolicy: Always
                    command: ["bundle", "exec", "rails", "db:migrate", "db:seed"]
                    envFrom:
                      - configMapRef:
                          name: ${CONFIGMAP_NAME}
                      - secretRef:
                          name: ${SECRET_NAME}
          EOF

          echo "job_name=${JOB_NAME}" >> "$GITHUB_OUTPUT"

      - name: Wait for migration completion
        run: |
          JOB_NAME="${{ steps.migrate_job.outputs.job_name }}"
          TIMEOUT_SECONDS=$((5 * 60))

          while true; do
            SUCCEEDED="$(kubectl -n "$KUBE_NAMESPACE" get job "$JOB_NAME" -o jsonpath='{.status.succeeded}' 2>/dev/null || true)"
            FAILED="$(kubectl -n "$KUBE_NAMESPACE" get job "$JOB_NAME" -o jsonpath='{.status.failed}' 2>/dev/null || true)"
            ACTIVE="$(kubectl -n "$KUBE_NAMESPACE" get job "$JOB_NAME" -o jsonpath='{.status.active}' 2>/dev/null || true)"

            SUCCEEDED="${SUCCEEDED:-0}"
            FAILED="${FAILED:-0}"
            ACTIVE="${ACTIVE:-0}"

            echo "Migration job status: active=${ACTIVE} succeeded=${SUCCEEDED} failed=${FAILED} elapsed=${SECONDS}s"

            if [ "$SUCCEEDED" -gt 0 ]; then
              echo "Migration job completed successfully"
              exit 0
            fi

            if [ "$FAILED" -gt 0 ]; then
              echo "Migration job failed"
              kubectl -n "$KUBE_NAMESPACE" describe job "$JOB_NAME" || true
              exit 1
            fi

            if [ "$SECONDS" -ge "$TIMEOUT_SECONDS" ]; then
              echo "Timed out waiting for migration job completion"
              kubectl -n "$KUBE_NAMESPACE" describe job "$JOB_NAME" || true
              exit 1
            fi

            sleep 10
          done

      - name: Migration logs
        if: always()
        run: |
          kubectl -n "$KUBE_NAMESPACE" logs "job/${{ steps.migrate_job.outputs.job_name }}" --all-containers=true --tail=-1 || true

      - name: Cleanup migration job
        if: always()
        run: |
          kubectl -n "$KUBE_NAMESPACE" delete "job/${{ steps.migrate_job.outputs.job_name }}" --ignore-not-found=true

  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    runs-on: ${{ needs.prepare-config.outputs.deploy_runner }}
    environment: ${{ needs.prepare-config.outputs.deploy_environment }}
    permissions:
      contents: read
      id-token: write
    needs:
      - prepare-config
      - build-web
      - db-migrate
    env:
      KUBE_NAMESPACE: ${{ needs.prepare-config.outputs.kube_namespace }}

    steps:
      - name: Setup kubectl
        uses: azure/setup-kubectl@v5

      - name: Restart deployments
        run: |
          kubectl -n "$KUBE_NAMESPACE" rollout restart deployment/web deployment/worker-ruby deployment/mcp

      - name: Wait for rollout
        run: |
          kubectl -n "$KUBE_NAMESPACE" rollout status deployment/web --timeout=10m
          kubectl -n "$KUBE_NAMESPACE" rollout status deployment/worker-ruby --timeout=10m
          kubectl -n "$KUBE_NAMESPACE" rollout status deployment/mcp --timeout=10m

  # ---------------------------------------------------------------------------
  # Post-deploy: upload source maps to Sentry
  # ---------------------------------------------------------------------------
  sentry-sourcemaps:
    name: Sentry Source Maps
    runs-on: ${{ needs.prepare-config.outputs.ci_runner }}
    needs:
      - prepare-config
      - deploy
    if: github.ref_name == 'main'
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.ECR_ROLE_ARN }}
          role-session-name: palad-app-sentry-sourcemaps
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract source maps from image
        run: |
          WEB_IMAGE_TAG="${{ needs.prepare-config.outputs.web_image_tag }}"
          docker pull "${ECR_REGISTRY}/aixle-app-web:${WEB_IMAGE_TAG}"
          CONTAINER_ID=$(docker create "${ECR_REGISTRY}/aixle-app-web:${WEB_IMAGE_TAG}")
          mkdir -p sourcemaps
          docker cp "$CONTAINER_ID:/app/public/vite/" ./sourcemaps/ || true
          docker rm "$CONTAINER_ID"

      - name: Upload to Sentry
        run: |
          VERSION="${{ github.sha }}"
          npx @sentry/cli releases new "$VERSION"
          npx @sentry/cli sourcemaps upload --release="$VERSION" ./sourcemaps/
          npx @sentry/cli releases finalize "$VERSION"
          npx @sentry/cli releases deploys "$VERSION" new -e production
