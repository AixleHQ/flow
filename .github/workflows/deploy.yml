name: Deploy aixle domains

on:
  push:
    branches-ignore:
      - main-images
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-web:
    name: Build Web
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    outputs:
      web_image_tag: ${{ steps.web_config.outputs.web_image_tag }}
      deploy_environment: ${{ steps.web_config.outputs.deploy_environment }}
    env:
      IMAGE_NAME: ${{ github.repository }}-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute Web Build Config
        id: web_config
        run: |
          SHORT_SHA="$(echo "$GITHUB_SHA" | cut -c1-7)"

          if [ "${GITHUB_REF}" = "refs/heads/staging" ]; then
            echo "asset_host=https://staging.aixle.com" >> "$GITHUB_OUTPUT"
            echo "raw_tag=staging" >> "$GITHUB_OUTPUT"
            echo "sha_prefix=staging-" >> "$GITHUB_OUTPUT"
            echo "cache_scope=web-image-staging" >> "$GITHUB_OUTPUT"
            echo "deploy_environment=staging" >> "$GITHUB_OUTPUT"
            echo "web_image_tag=staging-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "asset_host=https://static.aixle.com" >> "$GITHUB_OUTPUT"
            echo "raw_tag=main" >> "$GITHUB_OUTPUT"
            echo "sha_prefix=" >> "$GITHUB_OUTPUT"
            echo "cache_scope=web-image" >> "$GITHUB_OUTPUT"
            echo "deploy_environment=production" >> "$GITHUB_OUTPUT"
            echo "web_image_tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "asset_host=https://static.aixle.com" >> "$GITHUB_OUTPUT"
            echo "raw_tag=latest" >> "$GITHUB_OUTPUT"
            echo "sha_prefix=" >> "$GITHUB_OUTPUT"
            echo "cache_scope=web-image" >> "$GITHUB_OUTPUT"
            echo "deploy_environment=development" >> "$GITHUB_OUTPUT"
            echo "web_image_tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login To GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.web_config.outputs.raw_tag }}
            type=sha,format=short,prefix=${{ steps.web_config.outputs.sha_prefix }}

      - name: Build And Push Web Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.sha }}
            AUTHOR_NAME=${{ github.actor }}
            AUTHOR_EMAIL=${{ github.actor }}@users.noreply.github.com
            ASSET_HOST=${{ steps.web_config.outputs.asset_host }}
          cache-from: type=gha,scope=${{ steps.web_config.outputs.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ steps.web_config.outputs.cache_scope }}

  # ---------------------------------------------------------------------------
  # Checks (parallel, via reusable workflow)
  # ---------------------------------------------------------------------------
  be-test:
    name: Backend Tests
    needs: build-web
    uses: ./.github/workflows/code-check.yml
    with:
      command: rails-test
      needs-db: true
      timeout: 20
      image-tag: ${{ needs.build-web.outputs.web_image_tag }}
    secrets: inherit

  be-lint:
    name: Backend Lint
    needs: build-web
    uses: ./.github/workflows/code-check.yml
    with:
      command: rubocop
      image-tag: ${{ needs.build-web.outputs.web_image_tag }}
    secrets: inherit

  be-security:
    name: Backend Security
    needs: build-web
    uses: ./.github/workflows/code-check.yml
    with:
      command: brakeman
      image-tag: ${{ needs.build-web.outputs.web_image_tag }}
    secrets: inherit

  fe-lint:
    name: Frontend Lint
    needs: build-web
    uses: ./.github/workflows/code-check.yml
    with:
      command: eslint
      image-tag: ${{ needs.build-web.outputs.web_image_tag }}
    secrets: inherit

  fe-typecheck:
    name: Frontend Typecheck
    needs: build-web
    uses: ./.github/workflows/code-check.yml
    with:
      command: typescript
      image-tag: ${{ needs.build-web.outputs.web_image_tag }}
    secrets: inherit

  fe-fsd:
    name: Frontend FSD
    needs: build-web
    uses: ./.github/workflows/code-check.yml
    with:
      command: fsd
      image-tag: ${{ needs.build-web.outputs.web_image_tag }}
    secrets: inherit

  # ---------------------------------------------------------------------------
  # Post-deploy: upload source maps to Sentry
  # ---------------------------------------------------------------------------
  sentry-sourcemaps:
    name: Sentry Source Maps
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    needs:
      - build-web
      - be-test
      - be-lint
      - be-security
      - fe-lint
      - fe-typecheck
      - fe-fsd
    if: github.ref_name == 'main'
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract source maps from image
        run: |
          SHORT_SHA="$(echo "$GITHUB_SHA" | cut -c1-7)"
          docker pull "${REGISTRY}/${GITHUB_REPOSITORY}-web:${SHORT_SHA}"
          CONTAINER_ID=$(docker create "${REGISTRY}/${GITHUB_REPOSITORY}-web:${SHORT_SHA}")
          mkdir -p sourcemaps
          docker cp "$CONTAINER_ID:/app/public/vite/" ./sourcemaps/ || true
          docker rm "$CONTAINER_ID"

      - name: Upload to Sentry
        run: |
          VERSION="${{ github.sha }}"
          npx @sentry/cli releases new "$VERSION"
          npx @sentry/cli sourcemaps upload --release="$VERSION" ./sourcemaps/
          npx @sentry/cli releases finalize "$VERSION"
          npx @sentry/cli releases deploys "$VERSION" new -e production
