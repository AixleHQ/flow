# The two example flags of the feature flags design (§4.1), for tests, so they
# do not depend on what config/feature_flags.yml happens to declare.
board_ai_summary:
  description: AI summary panel on the board task drawer.
  owner: "@AixleHQ/board"
  kind: release
  scope: company
  default: false
  client: true
  introduced: 2026-11-03
  remove_by: 2027-01-31

coder_reap:
  description: Lets the Coder reaper delete dead workspaces.
  owner: "@AixleHQ/platform"
  kind: ops
  scope: global
  default: true
  env_setting: coder.reap_enabled
  env_setting_variable: CODER_REAP_ENABLED
