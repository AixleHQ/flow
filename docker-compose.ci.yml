services:
  web:
    image: web
    depends_on:
      - db
    environment:
      # Marks the run as CI so vitest applies the slower-runner timeout/retry budget
      # (see vitest.config.ts). `docker compose run` only forwards declared env vars,
      # not the runner's ambient CI=true, so it must be set here explicitly.
      CI: "true"
      # Branch under test, forwarded from the runner's GITHUB_REF_NAME (empty locally).
      # The Makefile coverage gate reads it: coverage runs only on develop (task #288).
      # `docker compose run` only forwards declared env vars, so it must be listed here.
      CI_BRANCH: ${GITHUB_REF_NAME:-}
      APP_VERSION: ci
      AUTHOR_NAME: github-actions
      AUTHOR_EMAIL: github-actions@users.noreply.github.com
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_NAME: aixle_test
      ENVIRONMENT: test
      PORT: 4000
      RAILS_ENV: test
      RAILS_LOG_TO_STDOUT: "true"
      RAILS_SECRET_KEY_BASE: secret

  db:
    # Pulled from Google's Docker Hub mirror to avoid Docker Hub's anonymous
    # pull rate limit on CI runners (shared egress IPs hit it quickly). The
    # mirror serves the identical official image, no auth required.
    image: mirror.gcr.io/library/postgres:15.3-alpine
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
