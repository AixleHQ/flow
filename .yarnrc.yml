nodeLinker: node-modules

# Yarn's secure defaults. Install scripts do
# not run: the three packages that have one (@swc/core, @parcel/watcher,
# unrs-resolver) ship prebuilt binaries as optional dependencies and keep the
# script only as a fallback — `yarn install --immutable` with scripts off was
# checked to load all three. No git repository is approved as a dependency
# source (none is used). A release has to be three days old before `yarn add` or
# `yarn up` will pick it; `--no-time-gate` overrides that for one command.
enableScripts: false

npmMinimalAgeGate: 3d
