# Temporal Schedules Configuration
# Replaces Sidekiq-cron schedules

schedules:
  - workflow: stale_session_cleanup_workflow
    cron: "0 * * * *"
    enabled: true

  - workflow: dismissed_asset_cleanup_workflow
    cron: "0 3 * * *"
    enabled: true

  - workflow: quota_error_scan_workflow
    cron: "* * * * *"
    enabled: true

  # Watchdog for agent containers that died without telling anyone (node failure,
  # eviction, OOM kill). The pods are bare pods with restartPolicy: Never, so
  # nothing else notices: the session stays `ready` and its container workflow
  # waits 23 hours for a signal that will never arrive.
  #
  # Every minute, because the cost of a miss is a workflow step wedged for a day,
  # while the scan is one runtime lookup per active session. Nothing is failed on a
  # single sighting — the activity requires two, two minutes apart — so the cadence
  # sets detection latency (~3 minutes), not sensitivity.
  #
  # SKIP overlap: a slow sweep must not be joined by the next one re-checking the
  # same sessions, which would confirm a session dead against its own first
  # sighting.
  - workflow: dead_container_scan_workflow
    cron: "* * * * *"
    overlap: skip
    enabled: true

  # Transactional-outbox safety net: re-dispatches trigger events a producer
  # committed but crashed before dispatching. Every minute is the finest cron
  # granularity; the happy path dispatches inline, so this only recovers crashes.
  # SKIP overlap: the relay is idempotent and must never run two drains at once.
  - workflow: outbox_relay_workflow
    cron: "* * * * *"
    overlap: skip
    enabled: true

  - workflow: coder_sweep_expired_locks_workflow
    cron: "0 * * * *"
    enabled: true

  # Mirrors the Official MCP Registry into the local connector catalog.
  #
  # Weekly, not the hourly cadence the registry suggests to aggregators. What
  # goes stale is DISCOVERY only: an install re-fetches the manifest live, so a
  # week-old mirror can never produce a week-old configuration. The cost is that
  # a newly published connector takes up to a week to become searchable, which
  # is an acceptable trade for a catalog measured in thousands of entries that
  # change slowly.
  #
  # SKIP overlap: a first run walks the whole registry and must not race a second
  # walk writing the same natural keys. Correctness does not depend on the
  # cadence — the sync resumes from the newest mirrored change, so a missed or
  # doubled run both converge.
  - workflow: mcp_connector_catalog_sync_workflow
    cron: "15 5 * * 1"
    overlap: skip
    enabled: true

  # Rebuilds the skills catalog mirror. skills.sh publishes no list endpoint and no
  # change feed, so this is a seeded sweep of the public search endpoint rather than
  # a walk — coverage comes from the seeds, freshness from re-running. Weekly for
  # the same reason as the connector sync: only browse goes stale, since typed
  # searches query upstream live. SKIP overlap: two sweeps would duplicate every
  # request and write the same natural keys.
  - workflow: skills_catalog_sync_workflow
    cron: "45 5 * * 1"
    overlap: skip
    enabled: true

  # Follows demand rather than the static seed list: sweeps the terms users actually
  # searched for (CatalogSearchQuery, unattributed), then the same bounded description
  # backfill and audit passes. Daily is affordable because it is narrow — a few dozen
  # requests against the terms people are about to install from, versus the ~110-request
  # weekly full sweep. SKIP overlap: two runs would duplicate every request.
  - workflow: skills_demand_sync_workflow
    cron: "20 4 * * *"
    overlap: skip
    enabled: true

  # Re-probes catalog-installed MCP servers for tools whose declarations changed
  # after approval (rug pull, OWASP MCP03:2025). Daily: the change is durable,
  # and each scan makes one outbound request per installed server. SKIP overlap:
  # a slow sweep must not be joined by the next one probing the same servers.
  - workflow: mcp_tool_drift_scan_workflow
    cron: "40 4 * * *"
    overlap: skip
    enabled: true

  # Proactive server-side OAuth token refresh for agent-CLI credentials nearing
  # expiry. SKIP overlap: each sweep does read-merge-write under a row lock, so
  # two batches must never run concurrently (mirrors outbox_relay_workflow).
  - workflow: agent_token_refresh_workflow
    cron: "*/5 * * * *"
    overlap: skip
    enabled: true

  # Proactive server-side OAuth token refresh for integration + MCP-server
  # credentials nearing expiry (oauth-unification §4.5). SKIP overlap: each refresh
  # is a read-merge-write under a row lock, so two sweeps must never run at once.
  - workflow: oauth_token_refresh_workflow
    cron: "*/5 * * * *"
    overlap: skip
    enabled: true

  # Reminds invitees whose invitation is unaccepted and within 2 days of the
  # 7-day expiry. Hourly is plenty: `reminded_at` makes it idempotent, so the
  # cadence only affects how promptly the single reminder goes out.
  - workflow: membership_invitation_reminder_workflow
    cron: "30 * * * *"
    overlap: skip
    enabled: true
