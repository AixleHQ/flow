# Temporal Schedules Configuration
# Replaces Sidekiq-cron schedules

schedules:
  - workflow: stale_session_cleanup_workflow
    cron: "0 * * * *"
    enabled: true

  - workflow: dismissed_asset_cleanup_workflow
    cron: "0 3 * * *"
    enabled: true

  - workflow: quota_error_scan_workflow
    cron: "* * * * *"
    enabled: true

  # Transactional-outbox safety net: re-dispatches trigger events a producer
  # committed but crashed before dispatching. Every minute is the finest cron
  # granularity; the happy path dispatches inline, so this only recovers crashes.
  # SKIP overlap: the relay is idempotent and must never run two drains at once.
  - workflow: outbox_relay_workflow
    cron: "* * * * *"
    overlap: skip
    enabled: true

  - workflow: coder_sweep_expired_locks_workflow
    cron: "0 * * * *"
    enabled: true

  # Proactive server-side OAuth token refresh for agent-CLI credentials nearing
  # expiry. SKIP overlap: each sweep does read-merge-write under a row lock, so
  # two batches must never run concurrently (mirrors outbox_relay_workflow).
  - workflow: agent_token_refresh_workflow
    cron: "*/5 * * * *"
    overlap: skip
    enabled: true

  # Proactive server-side OAuth token refresh for integration + MCP-server
  # credentials nearing expiry (oauth-unification §4.5). SKIP overlap: each refresh
  # is a read-merge-write under a row lock, so two sweeps must never run at once.
  - workflow: oauth_token_refresh_workflow
    cron: "*/5 * * * *"
    overlap: skip
    enabled: true

  # Reminds invitees whose invitation is unaccepted and within 2 days of the
  # 7-day expiry. Hourly is plenty: `reminded_at` makes it idempotent, so the
  # cadence only affects how promptly the single reminder goes out.
  - workflow: membership_invitation_reminder_workflow
    cron: "30 * * * *"
    overlap: skip
    enabled: true
