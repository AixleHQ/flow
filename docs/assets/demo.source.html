<!--
  Source for docs/assets/demo.gif (the README hero animation).
  Deterministic: each frame is a pure function of the ?f=<frame>&n=<total> query.
  Regenerate:
    for ((F=0;F<100;F++)); do
      "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
        --disable-gpu --hide-scrollbars --force-device-scale-factor=2 --window-size=1000,500 \
        --screenshot="frames/f$(printf %04d $F).png" "file://$PWD/demo.source.html?f=$F&n=100"
    done
    gifski -o demo.gif --fps 14 --width 920 --quality 90 frames/f*.png
-->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1000px; height: 500px; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    color: #e2e8f0;
    -webkit-font-smoothing: antialiased;
  }
  #stage { position: absolute; inset: 0; }

  /* window chrome */
  .topbar {
    position: absolute; top: 0; left: 0; right: 0; height: 46px;
    display: flex; align-items: center; gap: 10px; padding: 0 18px;
    border-bottom: 1px solid rgba(148,163,184,.14);
    background: rgba(15,23,42,.6);
  }
  .dot { width: 11px; height: 11px; border-radius: 50%; }
  .logo { display:flex; align-items:center; gap:9px; margin-left: 8px; }
  .logo .mark { width: 20px; height: 20px; border-radius: 6px;
    background: linear-gradient(135deg,#4f8ff7,#6366f1); }
  .logo .name { font-weight: 700; font-size: 15px; letter-spacing: .2px; }
  .logo .sub { font-size: 12px; color: #64748b; margin-left: 6px; }

  /* board */
  .board { position: absolute; top: 46px; left: 0; bottom: 0; width: 560px;
    padding: 16px; display: flex; gap: 12px; }
  .col { flex: 1; background: rgba(30,41,59,.45); border: 1px solid rgba(148,163,184,.12);
    border-radius: 12px; padding: 10px; }
  .col h3 { font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .6px; color: #94a3b8; margin-bottom: 10px; display:flex;
    align-items:center; gap:6px; }
  .col .wf { font-size: 9px; color: #4f8ff7; background: rgba(79,143,247,.12);
    border: 1px solid rgba(79,143,247,.3); padding: 1px 6px; border-radius: 999px;
    text-transform: none; letter-spacing: 0; }
  .card { background: #0b1220; border: 1px solid rgba(148,163,184,.16);
    border-radius: 9px; padding: 9px 10px; margin-bottom: 8px; }
  .card .t { font-size: 12px; font-weight: 600; color: #e2e8f0; }
  .card .m { font-size: 10px; color: #64748b; margin-top: 5px; display:flex; gap:6px; align-items:center;}
  .tag { font-size: 9px; padding: 1px 6px; border-radius: 999px;
    background: rgba(148,163,184,.14); color:#cbd5e1; }
  .ghost { opacity: .35; border-style: dashed; background: transparent; }

  /* dragged card (absolute) */
  #drag { position: absolute; width: 210px; z-index: 30;
    box-shadow: 0 18px 40px rgba(0,0,0,.5); transform: rotate(-2deg); }
  #cursor { position:absolute; z-index:40; width:18px; height:18px; }

  /* run panel */
  .panel { position: absolute; top: 46px; right: 0; bottom: 0; width: 440px;
    border-left: 1px solid rgba(148,163,184,.14); background: rgba(2,6,23,.5);
    padding: 16px 18px; }
  .panel h2 { font-size: 13px; font-weight: 700; display:flex; align-items:center; gap:8px;}
  .runbadge { font-size:10px; padding:2px 8px; border-radius:999px; font-weight:600;}
  .panel .repo { font-size: 11px; color:#64748b; margin: 3px 0 14px; }
  .steps { display:flex; flex-direction:column; gap:0; margin-bottom:14px; }
  .step { display:flex; align-items:center; gap:10px; padding:6px 0; font-size:12px; position:relative;}
  .step .ic { width:18px; height:18px; border-radius:50%; flex:none; display:flex;
    align-items:center; justify-content:center; font-size:11px; font-weight:700; }
  .step .nm { color:#cbd5e1; }
  .step .ln { position:absolute; left:8.5px; top:22px; width:1px; height:14px;
    background: rgba(148,163,184,.2); }
  .term { background:#020617; border:1px solid rgba(148,163,184,.12); border-radius:9px;
    padding:10px 12px; height:150px; overflow:hidden; font-family: ui-monospace, Menlo, monospace;
    font-size:11px; line-height:1.7; color:#94a3b8; }
  .term .l { white-space:nowrap; }
  .term .g { color:#34d399; }
  .term .a { color:#fbbf24; }
  .term .b { color:#4f8ff7; }
  .cost { display:flex; align-items:center; gap:14px; margin-top:12px;
    padding-top:12px; border-top:1px solid rgba(148,163,184,.12); }
  .cost .k { font-size:10px; color:#64748b; text-transform:uppercase; letter-spacing:.5px;}
  .cost .v { font-size:18px; font-weight:700; }
  .cost .v.green { color:#34d399; }
  .cost .v.blue { color:#4f8ff7; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const params = new URLSearchParams(location.search);
const f = parseInt(params.get('f')||'0', 10);
const n = parseInt(params.get('n')||'1', 10);
let p = n > 1 ? f/(n-1) : 0;

const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
// segment progress mapped to 0..1 within [a,b]
const seg=(a,b)=> clamp((p-a)/(b-a),0,1);
const easeIO=t=> t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
const easeOut=t=> 1-Math.pow(1-t,3);

// ---- timeline ----
const dragP   = easeIO(seg(0.12,0.30));   // card slides backlog -> in progress
const panelP  = seg(0.28,0.37);            // run panel slides in
const runP    = seg(0.37,0.86);            // steps + output + cost
const dropped = p >= 0.295;

// card geometry (logical px in board area)
const start = {x: 28, y: 120};
const end   = {x: 212, y: 96};
const cx = start.x + (end.x-start.x)*dragP;
const cy = start.y + (end.y-start.y)*dragP;

// steps
const STEPS = ['Clone repository','Run test suite','AI code review','Open pull request'];
const stepWin = (i)=>{ const w=1/STEPS.length; return seg(0.37 + i*w*0.49 + 0.0, 0.37 + (i+1)*w*0.49); };
function stepState(i){
  // each step occupies a slice of runP
  const w = 0.49/STEPS.length;
  const a = 0.37 + i*w, b = 0.37 + (i+1)*w;
  if (p >= b) return 'done';
  if (p >= a) return 'run';
  return 'queue';
}

// terminal lines tied to step progress
const LINES = [
  {s:0, c:'b', t:'$ git clone palad-ai/palad-app'},
  {s:0, c:'',  t:'  cloned · 1,284 files · branch develop'},
  {s:1, c:'',  t:'$ bundle exec rspec'},
  {s:1, c:'g', t:'  ✓ 312 examples, 0 failures'},
  {s:2, c:'',  t:'$ aixle review --diff'},
  {s:2, c:'g', t:'  ✓ no security issues'},
  {s:2, c:'a', t:'  ⚠ 2 style nits in sessions_controller.rb'},
  {s:3, c:'b', t:'  → opening PR #182 → develop'},
  {s:3, c:'g', t:'  ✓ pull request opened'},
];
function linesShown(){
  let out=[];
  for(const ln of LINES){
    const st = stepState(ln.s);
    if(st==='done') out.push(ln);
    else if(st==='run'){
      // reveal partway through running step
      const w = 0.49/STEPS.length; const a=0.37+ln.s*w, b=0.37+(ln.s+1)*w;
      const local = clamp((p-a)/(b-a),0,1);
      if(local>0.35) out.push(ln);
    }
  }
  return out.slice(-7);
}

// cost meter
const costCents = Math.round(easeOut(runP)*12);   // -> $0.12
const tokens = Math.round(easeOut(runP)*3420);
const allDone = p >= 0.86;

// ---------- render ----------
function card(title, tag, cls){
  return `<div class="card ${cls||''}">
    <div class="t">${title}</div>
    <div class="m"><span class="tag">${tag}</span><span>#${tag==='feature'?'182':'176'}</span></div>
  </div>`;
}
function stepIcon(st){
  if(st==='done') return `<div class="ic" style="background:rgba(52,211,153,.18);color:#34d399">✓</div>`;
  if(st==='run')  return `<div class="ic" style="background:rgba(251,191,36,.18);color:#fbbf24">●</div>`;
  return `<div class="ic" style="background:rgba(148,163,184,.12);color:#64748b">○</div>`;
}

const runColor = allDone ? '#34d399' : '#fbbf24';
const runText  = allDone ? 'Completed' : 'Running';
const runBg    = allDone ? 'rgba(52,211,153,.16)' : 'rgba(251,191,36,.16)';

let panelHtml='';
if(panelP>0){
  const tx = (1-easeOut(panelP))*40;
  panelHtml = `
  <div class="panel" style="opacity:${panelP.toFixed(2)};transform:translateX(${tx}px)">
    <h2>Code Review <span class="runbadge" style="background:${runBg};color:${runColor}">${runText}</span></h2>
    <div class="repo">palad-app · claude_code · isolated container</div>
    <div class="steps">
      ${STEPS.map((s,i)=>{const st=stepState(i);
        return `<div class="step">${stepIcon(st)}<span class="nm" style="color:${st==='queue'?'#64748b':'#e2e8f0'}">${s}</span>${i<STEPS.length-1?'<span class="ln"></span>':''}</div>`;
      }).join('')}
    </div>
    <div class="term">
      ${linesShown().map(l=>`<div class="l ${l.c}">${l.t}</div>`).join('')}
    </div>
    <div class="cost">
      <div><div class="k">Cost</div><div class="v green">$${(costCents/100).toFixed(2)}</div></div>
      <div><div class="k">Tokens</div><div class="v blue">${tokens.toLocaleString()}</div></div>
      <div style="margin-left:auto"><div class="k">Step</div><div class="v">${Math.min(STEPS.filter((_,i)=>stepState(i)==='done').length+ (allDone?0:1),STEPS.length)}/${STEPS.length}</div></div>
    </div>
  </div>`;
}

document.getElementById('stage').innerHTML = `
  <div class="topbar">
    <span class="dot" style="background:#ef4444"></span>
    <span class="dot" style="background:#f59e0b"></span>
    <span class="dot" style="background:#22c55e"></span>
    <div class="logo"><div class="mark"></div><span class="name">Aixle Flow</span>
      <span class="sub">Code Review board</span></div>
  </div>

  <div class="board">
    <div class="col">
      <h3>Backlog</h3>
      ${(dragP>0 || dropped)
          ? '<div class="card ghost"><div class="t" style="color:#475569">Add Google OAuth login</div></div>'
          : card('Add Google OAuth login','feature')}
      ${card('Flaky CI on main','bug')}
    </div>
    <div class="col">
      <h3>In&nbsp;Progress <span class="wf">⚡ Code Review</span></h3>
      ${dropped ? card('Add Google OAuth login','feature') : '<div class="card ghost" style="height:46px"></div>'}
    </div>
    <div class="col">
      <h3>Done</h3>
      ${card('Upgrade React 19','chore')}
    </div>
  </div>

  ${(dragP>0 && !dropped) ? `
    <div id="drag" class="card" style="left:${cx}px; top:${cy}px;">
      <div class="t">Add Google OAuth login</div>
      <div class="m"><span class="tag">feature</span><span>#182</span></div>
    </div>
    <svg id="cursor" style="left:${cx+170}px; top:${cy+30}px" viewBox="0 0 24 24" fill="#e2e8f0">
      <path d="M4 2 L4 20 L9 15 L12 22 L15 21 L12 14 L19 14 Z"/>
    </svg>` : ''}

  ${panelHtml}
`;
</script>
</body>
</html>
